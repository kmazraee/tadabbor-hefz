# nginx site for the Tadabbor accounts server. This is the only file added to nginx; nothing else there changes.
#   sudo cp nginx-api.conf /etc/nginx/sites-available/tadabbor-api
#   replace api.example.com with your API subdomain (2 places + certificate paths)
#   sudo ln -s /etc/nginx/sites-available/tadabbor-api /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d api.example.com     (once, for the certificate)
#   sudo nginx -t && sudo systemctl reload nginx
# The port must match PORT used with install.sh (default 8095).

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;                      # works on Ubuntu 24.04's nginx 1.24 (newer nginx only warns)
    listen [::]:443 ssl http2;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    server_tokens off;
    # Behind Cloudflare (orange cloud): take the visitor's real IP from Cloudflare, so per-IP limits work.
    # Create the file once with the command in deploy/vps/README.md, then remove the # below.
    # include /etc/nginx/tadabbor-cloudflare.conf;
    access_log /var/log/nginx/tadabbor-api.log;
    client_max_body_size 8m;                   # one user's whole progress is sent in one request

    # The admin panel and admin sign-in are not public: use them only through an SSH tunnel (see README)
    location /_/ { return 404; }
    location ^~ /api/collections/_superusers/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
