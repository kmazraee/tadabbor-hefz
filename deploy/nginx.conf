# nginx site for the web copy built by scripts/build_server.py.
# Copy dist/ to /var/www/hefz, put this file in /etc/nginx/sites-available/hefz (link it into sites-enabled),
# set server_name and the certificate paths, then: nginx -t && systemctl reload nginx
#
# The app has no backend: nginx only sends files. Pre-compressed copies are sent as they are
# (no compression work per request), and long cache times keep returning readers off the server.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;                      # your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                      # nginx 1.25.1+; on older nginx write "listen 443 ssl http2;" instead
    server_name example.com;                      # your domain
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/hefz;
    index index.html;
    charset utf-8;

    # Send the .gz copy made at build time; nothing is compressed on the fly
    gzip off;
    gzip_static on;
    # With the brotli module (Debian/Ubuntu: apt install libnginx-mod-http-brotli-static) also send .br copies:
    # brotli_static on;

    # Serving static files cheaply
    sendfile on;
    tcp_nopush on;
    open_file_cache max=2000 inactive=10m;
    open_file_cache_valid 5m;
    access_log off;                                # or: access_log /var/log/nginx/hefz.log combined buffer=64k flush=5m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;

    # The page and the service worker: always check for a newer copy (answered with 304 when unchanged)
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location = /sw.js      { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    # Content-update check from the app
    location = /data/meta.json { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin *; add_header X-Content-Type-Options nosniff always; }

    # Fonts never change under the same name
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Mushaf pages, translations, search data: reused for a week, then revalidated with 304.
    # CORS lets the Android app download translations from here if it is built with SITE_BASE set to this server.
    location /data/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options nosniff always;
    }

    # Accounts and sync (optional): PocketBase listens only on this machine, see deploy/pocketbase/README.md.
    # Only /api/ is passed on; its admin panel (/_/) is not reachable from outside.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;                  # a user's progress record is well under this
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /_/ { return 404; }                  # to use the admin panel: ssh -L 8090:127.0.0.1:8090 server, then http://localhost:8090/_/

    location / {
        try_files $uri $uri/ =404;
    }
}
