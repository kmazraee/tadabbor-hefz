name: Build Android APK

on:
  # Never automatic on normal pushes: run by hand (Actions tab) or by pushing a version tag.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild app page from template and data
        run: python3 scripts/build_web.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare release signing (only if the keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KIND=release" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building a test (debug) APK"
            echo "KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$KIND" = "release" ]; then gradle --no-daemon assembleRelease; else gradle --no-daemon assembleDebug; fi

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$KIND" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            OUT="tadabbor-hefz-v$VERSION.apk"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            OUT="tadabbor-hefz-v$VERSION.apk"
          fi
          test -f "$SRC" || { echo "APK not found (is the release signed?)"; ls -R android/app/build/outputs/apk; exit 1; }
          cp "$SRC" "$OUT"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tadabbor-hefz-apk
          path: tadabbor-hefz-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: حفظ تدبری v${{ env.VERSION }}
          # Published as a normal release (the latest) even before the store signing key is set up
          prerelease: false
          make_latest: true
          files: tadabbor-hefz-v*.apk
          body: |
            حفظ تدبری نسخه ${{ env.VERSION }}
            - ${{ env.KIND == 'release' && 'امضاشده با کلید اصلی (دائمی). اگر نسخه ۰٫۷٫۰ را دارید، مستقیم روی آن نصب کنید. اگر نسخه ۰٫۶٫۱ یا قدیمی‌تر را دارید، یک بار از تنظیمات پشتیبان بگیرید، برنامه قبلی را پاک کنید، این نسخه را نصب و پشتیبان را بازیابی کنید.' || 'امضاشده با کلید موقت؛ برای نصب مستقیم. برای کافه‌بازار نسخه‌ای با کلید انتشار ساخته می‌شود.' }}
            - کاملاً آفلاین؛ قلم مصحف عثمان طه بعد از نصب یک بار روی گوشی ذخیره می‌شود. ترتیل و درس‌ها اینترنت لازم دارند.
