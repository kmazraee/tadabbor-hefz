const TAFSIR_API = "https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/";
const tafsirOf = id => TAFSIRS.find(t => t[0] === id) || TAFSIRS[0];
const altafsirUrl = (no, sn, ay) => `https://www.altafsir.com/Tafasir.asp?tMadhNo=4&tTafsirNo=${no}&tSoraNo=${sn}&tAyahNo=${ay}&tDisplay=yes&UserProfile=0&LanguageId=1`;
const TF = {};      // memory cache
// Plain text with paragraph breaks, from tafsir text that may carry HTML
function cleanText(t) {
  const html = String(t || "").replace(/<\s*br\s*\/?>/gi, "\n").replace(/<\/(p|div|h\d|li)>/gi, "\n");
  const doc = new DOMParser().parseFromString(html, "text/html");
  return (doc.body.textContent || "").replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function fetchTafsirSurah(t, sn) {      // tafsir_api: one JSON per surah
  const j = await getJSON(`${TAFSIR_API}${t[4]}/${sn}.json`);
  const arr = Array.isArray(j) ? j : (j.ayahs || []);
  const out = {}; arr.forEach(x => { out[x.ayah] = cleanText(x.text); });
  return out;
}
// Al-Mizan on altafsir.com: the largest block of Arabic text on the verse page (only the app may read other sites)
async function fetchAltafsir(no, sn, ay) {
  const r = await fetch(altafsirUrl(no, sn, ay)); if (!r.ok) throw new Error("HTTP " + r.status);
  const buf = await r.arrayBuffer();
  let cs = ((r.headers.get("content-type") || "").match(/charset=([\w-]+)/i) || [])[1];
  let html = new TextDecoder(cs || "utf-8").decode(buf);
  if (!cs) { const m = html.match(/charset=["']?([\w-]+)/i); if (m && !/utf-?8/i.test(m[1])) { try { html = new TextDecoder(m[1]).decode(buf); } catch (e) {} } }
  const doc = new DOMParser().parseFromString(html.replace(/<\s*br\s*\/?>/gi, "\n"), "text/html");
  doc.querySelectorAll("script,style,noscript,select,form,head,a").forEach(e => e.remove());
  const arab = el => ((el.textContent || "").match(/[ء-ي]/g) || []).length;
  let best = null, bestN = 0;
  doc.body.querySelectorAll("div,td,p,span,font").forEach(el => {
    const n = arab(el); if (n < 150 || n <= bestN) return;
    if ([...el.children].some(c => arab(c) > n * 0.85)) return;
    best = el; bestN = n;
  });
  const text = best ? (best.textContent || "").replace(/[ \t]+/g, " ").replace(/\n\s*\n\s*/g, "\n\n").trim() : "";
  if (text.length < 80) throw new Error("empty");
  return text;
}
const tfKey = (id, sn, ay) => ay ? `tf:${id}:${sn}:${ay}` : `tf:${id}:${sn}`;
async function getTafsir(id, sn, ay) {
  const t = tafsirOf(id), mk = tfKey(id, sn, ay);
  if (TF[mk] !== undefined) return TF[mk];
  if (t[3] === "api") {
    let s = await IDB.get(tfKey(id, sn));
    if (!s) { s = await fetchTafsirSurah(t, sn); IDB.set(tfKey(id, sn), s); }
    for (const a in s) TF[tfKey(id, sn, a)] = s[a];
    return TF[mk] = s[ay] || "";
  }
  let v = await IDB.get(mk);
  if (v === undefined) { v = await fetchAltafsir(t[4], sn, ay); IDB.set(mk, v); }
  return TF[mk] = v;
}
async function tafsirHave(id) {   // surahs (api) or verses (altafsir) on this device
  const keys = await IDB.keys(`tf:${id}:`);
  return tafsirOf(id)[3] === "api" ? new Set(keys.map(k => +k.split(":")[2])).size : keys.length;
}

// Offline download of tafsirs: one job per tafsir, surah by surah (api) or verse by verse (altafsir)
const TFJOBS = {};
async function downloadTafsir(id, surahs) {
  const t = tafsirOf(id); if (TFJOBS[id] && TFJOBS[id].run) { TFJOBS[id].queue.push(...surahs); return; }
  const job = TFJOBS[id] = {run: true, queue: surahs.slice(), done: 0, fail: 0, stop: false};
  while (job.queue.length && !job.stop) {
    const sn = job.queue.shift();
    try {
      if (t[3] === "api") { if (!(await IDB.get(tfKey(id, sn)))) await IDB.set(tfKey(id, sn), await fetchTafsirSurah(t, sn)); }
      else for (let a = 1; a <= S[sn].total && !job.stop; a++) { if ((await IDB.get(tfKey(id, sn, a))) === undefined) await IDB.set(tfKey(id, sn, a), await fetchAltafsir(t[4], sn, a)); }
      job.done++;
    } catch (e) { job.fail++; }
    tfRefresh();
  }
  job.run = false; tfRefresh();
  toast(`ذخیره «${t[1]}» تمام شد${job.fail ? ` (${FA(job.fail)} سوره ناموفق)` : ""}`);
}

function wireTafsirBox(root) {

function diffHtml(a, b) {
  const A = a.split(" ").map(arNorm), B = b.split(" "), Bn = B.map(arNorm);
  const m = A.length, n = Bn.length, L = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i] === Bn[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (A[i] === Bn[j]) { keep.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return B.map((w, k) => keep.has(k) ? esc(w) : `<mark class="diff">${esc(w)}</mark>`).join(" ");
}

  const memDue = all.filter(x => status(x.k) === "due"), tdDue = all.filter(x => tadDue(x.k)), weak = weakOpen();
  memDue.forEach(x => add(Math.max(2, ayahCount(x.q) * 0.6), `<button class="plan-i" data-start="${x.k}" data-mode="review"><span>🔁 مرور حفظ: ${x.s.name} · ${esc(title(x.s, x.q))}</span><small class="num">${FA(Math.round(Math.max(2, ayahCount(x.q) * 0.6)))} دقیقه</small></button>`));
  tdDue.forEach(x => add(4, `<button class="plan-i" data-tadrev="${x.k}"><span>🧠 مرور تدبر: ${x.s.name} · ${esc(title(x.s, x.q))}</span><small class="num">۴ دقیقه</small></button>`));

// ---------- quiz: which verse comes next, and where is this verse ----------
let quiz = null;
function quizPool() {
  const mem = siyaqs().filter(x => isMem(x.k)); const src = mem.length ? mem : siyaqs().filter(x => isTad(x.k) || status(x.k) !== "new");
  return src.flatMap(x => range(x.q.s, x.q.e).map(a => [x.s.n, a]));
}
function openQuiz(mode) {
  const pool = quizPool();
  if (!pool.length) { toast("اول چند سیاق را حفظ یا تدبر کنید"); return; }
  quiz = {mode, n: 0, ok: 0, pool}; nextQuiz();
}
function nextQuiz() {
  const z = quiz; if (z.n >= 10) return quizEnd();
  let v; for (let i = 0; i < 30; i++) { v = z.pool[Math.floor(Math.random() * z.pool.length)]; if (z.mode !== "next" || nextV(...v)) break; }
  z.cur = v; z.show = false; z.n++;
  if (z.mode === "where") { const opts = new Set([v[0]]); while (opts.size < 4) opts.add(1 + Math.floor(Math.random() * 114)); z.opts = [...opts].sort(() => Math.random() - 0.5); z.pick = null; }
  drawQuiz();
}
function drawQuiz() {
  const z = quiz, [sn, ay] = z.cur, nv = nextV(sn, ay);
  lastDraw = drawQuiz;
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="آزمون">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>${z.mode === "next" ? "آیه بعد چیست؟" : "این آیه کجاست؟"} · ${FA(z.n)} از ۱۰</h2></header>
    <div class="body">
      ${z.mode === "next" ? `<p class="small">این آیه را بخوانید و آیه بعد از آن را از حفظ بگویید.</p><div class="card"><span class="small muted">سوره ${S[sn].name} · آیه ${FA(ay)}</span><div class="ar">${esc(vplain(sn, ay))}</div></div>
        ${z.show ? `<div class="card okcard"><span class="small muted">سوره ${S[nv[0]].name} · آیه ${FA(nv[1])}</span><div class="ar">${esc(vplain(...nv))}</div></div>` : ""}`
      : `<p class="small">این آیه در کدام سوره است؟</p><div class="card"><div class="ar">${esc(vplain(sn, ay))}</div></div>
        <div class="quiz-opts">${z.opts.map(o => `<button data-qopt="${o}" class="${z.pick !== null ? (o === sn ? "right" : o === z.pick ? "wrong" : "") : ""}" ${z.pick !== null ? "disabled" : ""}>${S[o].name}</button>`).join("")}</div>
        ${z.pick !== null ? `<p class="small">${z.pick === sn ? "✓ درست" : "پاسخ: سوره " + S[sn].name} · آیه ${FA(ay)} · ${esc(title(S[sn], siyaqOf(sn, ay)))}</p>` : ""}`}
      <p class="small muted">امتیاز: ${FA(z.ok)} از ${FA(z.n - (z.mode === "next" ? (z.show ? 0 : 1) : (z.pick === null ? 1 : 0)))}</p>

      : `<button class="btn-main" id="qz-next" ${z.pick === null ? "disabled" : ""}>${z.n < 10 ? "سؤال بعد" : "پایان"}</button>`}</footer></div>`);

// ---------- backup (Google Drive via the share sheet) ----------
const backupName = () => `tadabbor-hefz-backup-${new Date().toISOString().slice(0, 10)}.json`;
const backupJson = () => JSON.stringify({app: "tadabbor-hefz", v: 1, at: new Date().toISOString(), progress: st, settings: cfg}, null, 1);
async function doBackup() {
  const json = backupJson(), name = backupName();
  const done = () => { cfg.lastBackup = Date.now(); saveCfg(); };
  if (window.Android && Android.shareFile) { Android.shareFile(name, json); done(); return; }
  try {
    const file = new File([json], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "پشتیبان حفظ تدبری"}); done(); toast("پشتیبان فرستاده شد"); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], {type: "application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); done(); toast("فایل پشتیبان ذخیره شد؛ آن را در گوگل‌درایو بارگذاری کنید");
  } catch (e) { toast("ذخیره فایل ممکن نشد"); }
}
function restoreFrom(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "tadabbor-hefz" || !d.progress) throw new Error("bad");
      st = Object.assign(EMPTY(), d.progress); delete st.day; save();
      cfg = Object.assign({}, DEFAULTS, d.settings || {}, {seenIntro: true}); saveCfg(); applySettings();
      toast("بازیابی انجام شد · " + (d.at || "").slice(0, 10)); openSettings();
    } catch (e) { toast("این فایل پشتیبان حفظ تدبری نیست"); }
  };
  r.readAsText(file);
}

// ---------- updates: new app version (GitHub Releases) and new siyaq content (GitHub Pages) ----------
const upd = {state: "idle", app: null, meta: null, changed: [], err: false};
const vnum = v => String(v || "").replace(/^v/, "").split(".").map(x => parseInt(x) || 0);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
function changedSurahs(oldM, newM) {
  const sig = s => JSON.stringify([s.siyaqs, s.fasls, s.dir, s.points]);
  return newM.surahs.filter((s, i) => !oldM.surahs[i] || sig(s) !== sig(oldM.surahs[i])).map(s => s.n);
}
async function checkUpdates(silent) {
  upd.state = "checking"; upd.err = false; if (!silent) refreshUpd();
  const jobs = [];
  jobs.push(fetch(SITE_BASE + "data/meta.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(m => {
    upd.meta = m && m.v !== DATA.v && m.built >= DATA.built ? m : null;
    upd.changed = upd.meta ? changedSurahs(DATA, upd.meta) : [];
  }).catch(() => { upd.err = true; }));
  if (IS_APP) jobs.push(fetch(REPO_API).then(r => r.ok ? r.json() : []).then(list => {
    const rel = (list || []).filter(r => !r.draft && r.tag_name).sort((a, b) => newer(a.tag_name, b.tag_name) ? -1 : 1)[0];
    const apk = rel && (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    upd.app = rel && newer(rel.tag_name, VERSION) ? {v: rel.tag_name.replace(/^v/, ""), url: apk ? apk.browser_download_url : rel.html_url, page: rel.html_url,
      name: apk ? apk.name : "", size: apk ? apk.size : 0, date: rel.published_at || (apk && apk.updated_at) || "", test: rel.prerelease} : null;
  }).catch(() => { upd.err = true; }));
  await Promise.all(jobs);
  upd.state = "done"; cfg.lastUpdateCheck = Date.now(); saveCfg();
  if (!silent) { refreshUpd(); if (!upd.app && !upd.meta) toast(upd.err ? "اتصال برقرار نشد؛ اینترنت را بررسی کنید" : "برنامه و محتوا به‌روز هستند"); }
  else if (upd.app || upd.meta) refresh();
}
// Keep progress when siyaq boundaries of a surah change: a new siyaq inherits what its overlapping old siyaqs had.
function migrateProgress(oldM, newM, surahNums) {
  surahNums.forEach(sn => {
    const os = oldM.surahs[sn - 1].siyaqs, ns = newM.surahs[sn - 1].siyaqs;
    const items = {}, notes = {};
    ns.forEach(q => {
      const ov = os.filter(o => o.e >= q.s && o.s <= q.e), ks = ov.map(o => key(sn, o.n));
      const its = ks.map(k => st.items[k]).filter(Boolean);
      if (its.length === ks.length && its.length) {
        const stage = Math.min(...its.map(x => x.stage || 0));
        if (stage >= 5) items[key(sn, q.n)] = {stage: 5, ivl: Math.min(...its.map(x => x.ivl || 1)), due: Math.min(...its.map(x => x.due || today()))};
        else if (stage > 0) items[key(sn, q.n)] = {stage};
      }
      const nts = ks.map(k => st.notes[k]).filter(Boolean);
      const same = ov.length === 1 && ov[0].s === q.s && ov[0].e === q.e;
      if (same && nts.length) notes[key(sn, q.n)] = nts[0];
      else if (nts.length === ks.length && nts.length && nts.every(x => x.done)) notes[key(sn, q.n)] = {done: true, title: "", answers: ["", "", "", ""], cuts: [], stepTitles: {}, carried: true};
    });
    Object.keys(st.items).filter(k => k.startsWith(sn + ":")).forEach(k => delete st.items[k]);
    Object.keys(st.notes).filter(k => k.startsWith(sn + ":")).forEach(k => delete st.notes[k]);
    Object.assign(st.items, items); Object.assign(st.notes, notes);
  });
  save();
}
function applyContent() {
  const m = upd.meta; if (!m) return;
  migrateProgress(DATA, m, upd.changed);
  store("tadabbor-meta", m);
  toast("محتوا به‌روز شد"); setTimeout(() => location.reload(), 600);
}

function updStart() {

window.__upd = (state, got, size, why) => {

function openSettingsKeep() { const b = document.querySelector(".sheet .body"); const y = b ? b.scrollTop : 0; openSettings(); const nb = document.querySelector(".sheet .body"); if (nb) nb.scrollTop = y; }

function openGuide(section) {
  lastDraw = () => {};
  const open = id => (section || "start") === id ? "open" : "";
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="راهنما">
  <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>راهنمای حفظ تدبری</h2></header>
  <div class="body">
    <p>این برنامه کمک می‌کند قرآن را <b>با فهم</b> حفظ کنید: هر سیاق اول فهمیده و تدبر می‌شود و بعد، با تکیه بر همان معنا، حفظ و مرور می‌شود. مسیر و سطح‌ها بر پایه روش «تدبر در قرآن کریم» استاد علی صبوحی طسوجی است.</p>

    <details ${open("start")}><summary>از کجا شروع کنم؟</summary><div><ol>
      <li><b>مبانی تدبر:</b> در داشبورد «شروع مبانی تدبر» را بزنید. جلسه‌های یکی از دو دوره «مبانی تدبر» را ببینید یا بشنوید و بعد از هر جلسه تیک «دیده شد» را بزنید؛ یا کتاب «آشنایی با دانش تدبر در قرآن کریم» را بخوانید.</li>
      <li><b>گذر:</b> وقتی شرط‌ها کامل شد، «گذراندم» را بزنید تا سطح ۱ باز شود.</li>
      <li><b>سطح‌ها:</b> در هر سطح درس‌های همان سطح را ببینید و سوره‌هایش را تدبر کنید. سطح بعد وقتی باز می‌شود که یک دوره از درس‌ها دیده و همه سوره‌های سطح تدبر شده باشد.</li>
      <li><b>هر روز:</b> «برنامه امروز» در داشبورد، به اندازه وقتی که گفته‌اید، کارهای همان روز را می‌چیند: مرورها، تمرین آیه‌های ضعیف و سیاق تازه.</li>
    </ol><p>سوره‌هایی را که از قبل حفظ یا تدبر کرده‌اید هر وقت خواستید از صفحه سوره ثبت کنید؛ این کار قفل ندارد. اگر دوره‌ها را در کلاس گذرانده‌اید، «قبلاً گذرانده‌ام» یا در تنظیمات «مسیر آزاد» را بزنید.</p></div></details>

    <details ${open("tracks")}><summary>چهار مرحله یادگیری هر سیاق</summary><div><ul>
      <li><b>تدبر:</b> فهم آیات، درس استاد، کشف گام‌ها و پرسش‌ها.</li>
      <li><b>تثبیت تدبر:</b> مرورهای فاصله‌دار معنا؛ با ${FA(3)} بار یادآوری کامل، تدبر سیاق تثبیت می‌شود.</li>
      <li><b>حفظ:</b> شنیدن، حفظ گام‌به‌گام و اتصال کل سیاق.</li>
      <li><b>تثبیت حفظ:</b> مرورهای فاصله‌دار حفظ؛ وقتی فاصله مرور به ${FA(21)} روز برسد، حفظ سیاق تثبیت‌شده است.</li>
    </ul><p>پیشرفت هر مرحله در داشبورد، صفحه هر سوره و کنار هر سیاق جدا نشان داده می‌شود. صفحه هر سوره نوع سوره (مکی یا مدنی)، تعداد آیه‌ها و سیاق‌ها و زمان تقریبی خواندن، تدبر و حفظ را هم دارد.</p></div></details>

    <details ${open("siyaq")}><summary>سیاق و فصل چیست؟</summary><div>
      <p>سیاق مجموعه‌ای از آیات پشت‌سرهم با یک معنای پیوسته است و از چند «گام» معنایی می‌گذرد. وقتی آیات را در قالب سیاق حفظ کنید، ترتیب آیات را از روی معنا به یاد می‌آورید و آیات مشابه کمتر جابه‌جا می‌شوند.</p>
      <p>در سوره‌های بلند چند سیاق هم‌جهت یک «فصل» می‌سازند؛ گاهی فصلی کوتاه وسط فصل دیگر می‌آید (فصل معترضه)، مثل فصل دهم سوره بقره.</p>
      <p>سوره بقره بر اساس سیاق‌بندی استاد است؛ مرز سیاق‌های بقیه سوره‌ها فعلاً بر اساس رکوع‌های مصحف است و گام‌ها را خودتان در تدبر پیدا می‌کنید.</p></div></details>

    <details ${open("tadabbur")}><summary>تدبر را چطور انجام دهم؟</summary><div>
      <p><b>۱. فهم آیات:</b> هر آیه کلمه‌به‌کلمه با معنای فارسی هر کلمه می‌آید. روی کلمه بزنید تا تلفظ، ریشه و آیه‌های هم‌ریشه را ببینید و اگر معنایش را نمی‌دانستید به «لغت‌نامه من» اضافه کنید. ترجمه کامل و «📖 تفسیر» هر آیه هم همان‌جاست. هر آیه را که فهمیدید تیک بزنید.</p>
      <p><b>۲. درس استاد:</b> تدبر همین بخش را از فیلم، صوت یا کتاب استاد یاد بگیرید، پیام استاد را ببینید و «تدبر این سیاق را یاد گرفتم» را بزنید.</p>
      <p><b>۳. کشف گام‌ها:</b> هر جا معنا وارد مرحله تازه‌ای شد، روی نشانه پایان آیه بزنید و برای هر گام عنوان بنویسید؛ بعد با گام‌های مرجع مقایسه کنید.</p>
      <p><b>۴. پرسش‌ها:</b> به چند پرسش کوتاه جواب دهید و عنوان سیاق را به زبان خودتان بنویسید. همه این‌ها در «دفتر تدبر من» جمع می‌شود.</p></div></details>

    <details ${open("cycle")}><summary>حفظ و مرور</summary><div><ol>
      <li><b>شنیدن:</b> ترتیل کل سیاق با تکرار دلخواه.</li>
      <li><b>حفظ گام‌به‌گام:</b> کلمات در چهار سطح محو می‌شوند (کامل، نیمه، سرنخ، معنا). اگر آیه‌ای مشابه داشته باشد، هشدار «⚠ آیه مشابه» می‌آید.</li>
      <li><b>اتصال:</b> کل سیاق را از حفظ بخوانید؛ روی هر آیه بزنید و بگویید درست خواندید یا نه. می‌توانید خواندن خودتان را ضبط و با قاری مقایسه کنید.</li>
      <li><b>ثبت:</b> «سخت» سیاق را به حفظ برمی‌گرداند؛ «خوب» و «آسان» مرور بعدی را دورتر می‌برند.</li>
    </ol><p>هر مرور حفظ با یادآوری معنا شروع می‌شود. «مرور تدبر» جداست: پیام و گام‌های سیاق را به یاد می‌آورید و با برداشت خودتان و پیام استاد مقایسه می‌کنید.</p></div></details>

    <details ${open("weak")}><summary>دفتر اشتباهات و آیات مشابه</summary><div>
      <p>اشتباه هر آیه را با نوعش ثبت کنید (یادم نیامد، کلمه یا اعراب، قاطی با آیه مشابه، ترتیب) و اگر خواستید کلمه‌های اشتباه را بزنید. «دفتر اشتباهات» آیه‌های ضعیف را جمع می‌کند و «تمرین تثبیت» با آیه قبل به‌عنوان سرنخ، آن‌ها را تمرین می‌دهد؛ هر آیه با ${FA(2)} بار درست خواندن در روزهای بعد تثبیت می‌شود.</p>
      <p>نشان «≈» یعنی آیه مشابه دارد؛ در صفحه آیات مشابه، کلمه‌هایی که فرق دارند رنگی‌اند.</p></div></details>

    <details ${open("tools")}><summary>ابزارهای مطالعه و تمرین</summary><div><ul>
      <li><b>تفسیر:</b> المیزان (پیش‌فرض، متن عربی، در برنامه اندروید)، المختصر و سعدی به فارسی و ده‌ها تفسیر عربی؛ انتخاب از فهرست بالای صفحه تفسیر.</li>
      <li><b>ریشه کلمه:</b> همه آیه‌هایی که کلمه‌ای از همان ریشه دارند.</li>
      <li><b>لغت‌نامه من:</b> کلمه‌های نشان‌کرده، با تمرین کارتی (صفحه مرور).</li>
      <li><b>آزمون:</b> «آیه بعد چیست؟» و «این آیه کجاست؟» (صفحه مرور)؛ «تمرین ترتیب سیاق‌ها» (صفحه سوره).</li>
      <li><b>دفتر تدبر من:</b> برداشت‌ها و پاسخ‌ها با جستجو و خروجی فایل.</li>
      <li><b>هدف و کارنامه:</b> هدف حفظ با تاریخ پایان، کارنامه هفته، نشان‌ها (صفحه مسیر و مرور).</li>
      <li><b>کلاس و استاد:</b> کارنامه را برای استاد بفرستید؛ مربی‌ها کارنامه شاگردان را در «کلاس من» یکجا می‌بینند.</li>
      <li><b>جستجو:</b> ذره‌بین بالای هر صفحه؛ در متن آیات بدون اعراب و در ترجمه، یا «بقره ۲۵۵».</li>
    </ul></div></details>

    <details ${open("mushaf")}><summary>مصحف، پخش و درس‌ها</summary><div>
      <p><b>مصحف:</b> صفحه‌های مصحف به خط عثمان طه. با کشیدن صفحه ورق بزنید. روی هر کلمه بزنید تا معنا، ریشه، تفسیر، آیات مشابه و ترتیل را ببینید، آیه را به اشتراک بگذارید یا با ☆ به علاقه‌مندی‌ها (★ بالای مصحف) اضافه کنید.</p>
      <p><b>پخش‌کننده:</b> از آیه انتخاب‌شده تا آخر صفحه، سیاق، فصل، سوره یا قرآن؛ تکرار هر آیه و کل بازه از ۱ تا بی‌نهایت؛ ترجمه گویا بعد از هر آیه؛ صفحه‌ها خودکار ورق می‌خورند. دکمه 🎧 در داشبورد سیاق امروز را با ترجمه گویا پخش می‌کند.</p>
      <p><b>ترتیل:</b> ${FA(RECITERS.filter(r => r[3] !== "fa").length)} قاری (پیش‌فرض شهریار پرهیزگار)؛ «⬇ دانلود ترتیل» برای انتخاب سوره‌ها، جزء یا کل قرآن.</p>
      <p><b>درس‌ها:</b> فیلم و صوت جلسه‌های استاد صبوحی برای هر سوره و هر سطح؛ در برنامه اندروید با «⬇ ذخیره صوت/فیلم» روی گوشی می‌مانند.</p></div></details>

    <details><summary>معنی رنگ‌ها</summary><div>${legend()}<p>رنگ هر نوار وضعیت حفظ آن سیاق است و طولش به اندازه تعداد آیه‌ها.</p></div></details>

    <details ${open("settings")}><summary>تنظیمات، بدون اینترنت و پشتیبان</summary><div>
      <p>از چرخ‌دنده بالای هر صفحه: مشخصات شما، پوسته و رنگ، قلم مصحف، ترجمه (پیش‌فرض صفوی)، قاری، تفسیر پیش‌فرض، یادآور روزانه، «حفظ فقط بعد از تدبر» و «مسیر آزاد».</p>
      <p><b>بدون اینترنت:</b> متن، صفحه‌ها و چهار ترجمه داخل برنامه است. قلم عثمان طه و ترجمه‌های دیگر بعد از نصب ذخیره می‌شوند. ترتیل، تفسیرها، معنای کلمه‌به‌کلمه و درس‌ها را هم از تنظیمات یا همان صفحه روی گوشی ذخیره کنید.</p>
      <p><b>پشتیبان:</b> در برنامه اندروید هر روز خودکار یک پشتیبان در پوشه Download/HefzTadabbori نوشته می‌شود. برای ایمنی بیشتر، گاهی «ذخیره پشتیبان» را بزنید و Drive را انتخاب کنید؛ برای بازیابی «بازیابی از فایل».</p>
      <p><b>یادآور و ویجت:</b> یادآور را در تنظیمات روشن کنید؛ ویجت را از «ابزارک‌های» صفحه اصلی گوشی اضافه کنید.</p></div></details>

    <details><summary>پرسش‌های رایج</summary><div>
      <p><b>داده‌هایم کجاست؟</b> فقط روی همین دستگاه و در فایل‌های پشتیبان خودتان. برنامه چیزی برای کسی نمی‌فرستد.</p>
      <p><b>چطور به‌روز کنم؟</b> تنظیمات ← «بررسی به‌روزرسانی». برنامه روزی یک بار خودش هم بررسی می‌کند؛ پیشرفت شما حفظ می‌شود.</p>
      <p><b>چرا بعضی سوره‌ها قفل‌اند؟</b> تدبر هر سوره در سطح خودش باز می‌شود؛ بعد از سطح ۶ همه باز است. مصحف، مرور و ثبت سوره‌های حفظ‌شده همیشه آزاد است.</p>
      <p><b>شمارنده بالای صفحه چه می‌شمارد؟</b> سوره‌ای «حفظ» حساب می‌شود که همه سیاق‌هایش حفظ شده باشد، و «تدبر» وقتی تدبر همه سیاق‌هایش تمام شده باشد.</p>
      <p><b>مشکل یا پیشنهاد دارم.</b> تنظیمات ← «ارتباط با ما»: ایمیل، ایتا یا بله.</p>
    </div></details>
    <button id="replay-intro">نمایش دوباره معرفی برنامه</button>
  </div></div>`);
  box.querySelector("#replay-intro").addEventListener("click", () => { box.innerHTML = ""; showIntro(); });
}

// ---------- first-run welcome: name and mobile number, kept on the phone ----------
const normPhone = v => faNum(String(v || "")).replace(/[\s\-()]/g, "").replace(/^\+98|^0098/, "0").replace(/^9(\d{9})$/, "09$1");
const PHONE_OK = v => /^09\d{9}$/.test(v);
function showWelcome(err) {
  const box = document.getElementById("intro");
  box.innerHTML = `<div class="intro" role="dialog" aria-modal="true" aria-label="خوش آمدید" data-welcome>
    <h1>به حفظ تدبری خوش آمدید</h1>
    <p>برای شروع، خودتان را معرفی کنید تا برنامه با نام خودتان همراهتان باشد.</p>
    <form id="wl" class="wform" novalidate>
      <label for="wl-name">نام شما</label><input id="wl-name" type="text" autocomplete="given-name" value="${esc(cfg.name)}" placeholder="مثلاً کمیل" required>
      <label for="wl-phone">شماره همراه</label><input id="wl-phone" type="tel" inputmode="numeric" dir="ltr" autocomplete="tel" value="${esc(cfg.phone)}" placeholder="09xxxxxxxxx" required>
      ${err ? `<p class="werr" role="alert">${err}</p>` : ""}
      <button type="submit">ادامه</button>
      <p class="small" style="opacity:.85">این اطلاعات فقط روی همین گوشی ذخیره می‌شود و برای کسی فرستاده نمی‌شود. بعداً از تنظیمات قابل تغییر است.</p>
    </form></div>`;
  box.querySelector("#wl").addEventListener("submit", e => { e.preventDefault();
    const name = box.querySelector("#wl-name").value.trim(), phone = normPhone(box.querySelector("#wl-phone").value);
    cfg.name = name; cfg.phone = phone;
    if (name.length < 2) return showWelcome("نام خود را بنویسید.");
    if (!PHONE_OK(phone)) return showWelcome("شماره همراه را درست بنویسید؛ ۱۱ رقم که با ۰۹ شروع شود.");
    saveCfg(); box.innerHTML = ""; render();
    if (!cfg.seenIntro) showIntro(); else toast("خوش آمدید " + name);
  });
  setTimeout(() => { const i = box.querySelector(err && err.includes("شماره") ? "#wl-phone" : "#wl-name"); if (i) i.focus(); }, 50);
}

// ---------- first-run intro ----------
const INTRO = [
  ["اول بفهم، بعد حفظ کن", "هر بخش از آیات اول تدبر می‌شود: می‌خوانید، گام‌های معنایی‌اش را پیدا می‌کنید و به چند پرسش جواب می‌دهید."],
  ["واحد حفظ: سیاق", "آیات در قالب سیاق، یعنی مجموعه‌ای با معنای پیوسته، روی صفحه‌های مصحف عثمان طه حفظ می‌شوند. معنا ترتیب آیات را در ذهن نگه می‌دارد."],
  ["هر روز کمی، با مرور", "برنامه هر سیاق را درست پیش از فراموش شدن برای مرور برمی‌گرداند. داشبورد نشان می‌دهد امروز چه باید کرد."],
  ["مسیر شما قدم‌به‌قدم است", "قدم اول «مبانی تدبر» است: فیلم‌های استاد علی صبوحی یا کتاب «آشنایی با دانش تدبر در قرآن کریم». بعد سطح ۱ باز می‌شود و هر سطح، با گذراندن سطح قبل."]
];
function showIntro(i = 0) {
  const box = document.getElementById("intro");
  const [h, p] = INTRO[i];
  box.innerHTML = `<div class="intro" role="dialog" aria-modal="true" aria-label="معرفی برنامه">
    <div class="dots">${INTRO.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>
    <h1>${h}</h1><p>${p}</p>
    <div class="row"><button id="in-next">${i < INTRO.length - 1 ? "بعدی" : passed("intro") ? "شروع" : "شروع از مبانی تدبر"}</button>${i < INTRO.length - 1 ? `<button class="skip" id="in-skip">رد شدن</button>` : ""}</div></div>`;
  const done = () => { cfg.seenIntro = true; saveCfg(); box.innerHTML = ""; render(); };
  box.querySelector("#in-next").addEventListener("click", () => { if (i < INTRO.length - 1) return showIntro(i + 1); done(); if (!passed("intro")) openLevel("intro"); });
  const sk = box.querySelector("#in-skip"); if (sk) sk.addEventListener("click", done);
}

// Android back button: close intro, word bar or an open sheet, else go to the dashboard
window.__back = () => {
  const intro = document.getElementById("intro");
  if (intro.querySelector("[data-welcome]")) return true;     // the welcome form has to be filled in
  if (intro.innerHTML) { cfg.seenIntro = true; saveCfg(); intro.innerHTML = ""; return true; }
  if (document.getElementById("wordbar").innerHTML) { closeWordbar(); return true; }
  const box = document.getElementById("sheet");
  if (box.innerHTML) { stopAudio(); openVid = null; box.innerHTML = ""; ses = null; render(); return true; }
  if (tab !== "home") { tab = "home"; render(); return true; }
  return false;
};

mushafPage = 1;
if (window.__oldWebView) throw new Error("old webview");
applySettings();
render();
setTimeout(autoBackupDaily, 3000);
if (!myName() || !PHONE_OK(cfg.phone)) showWelcome(); else if (!cfg.seenIntro) showIntro();
if (IS_APP && !qcfLocal() && !cfg.qcfAsked && cfg.qfont === "qcf") qcfStart();
if (IS_APP && !cfg.transAsked) { cfg.transAsked = true; saveCfg(); setTimeout(downloadAllTrans, 1500); }
if (navigator.onLine !== false && (!cfg.lastUpdateCheck || Date.now() - cfg.lastUpdateCheck > 864e5)) setTimeout(() => checkUpdates(true), 4000);
</script>

</body>
