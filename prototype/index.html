<style>
/* Layout: one phone-width column, bottom tab bar, full-screen sheets; Quran always shown as Madinah mushaf pages */
:root{
  --acc-l:#1F4E79; --acc-d:#7FB0E3; --accs-l:#E3ECF5; --accs-d:#1B2C3D;
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5E6E68; --line:#DCE3E0;
  --page:#FFFDF7; --page-edge:#E6DDC6;
  --lapis:var(--acc-l); --lapis-soft:var(--accs-l); --on-lapis:#FFFFFF;
  --gold:#A8711A; --gold-soft:#F6EBD6;
  --st-new:#C9D1CE; --st-learn:#3A78C2; --st-solid:#2E8B57; --st-due:#D9822B;
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-q:"Amiri Quran","Amiri","Scheherazade New",serif;
  --q-lh:1.9;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="sepia"]){
  --paper:#0F1715; --surface:#17221F; --ink:#E7EEEB; --muted:#93A39D; --line:#2A3834;
  --page:#141D1A; --page-edge:#2A3834;
  --lapis:var(--acc-d); --lapis-soft:var(--accs-d); --on-lapis:#0F1715;
  --gold:#E0B25E; --gold-soft:#33291A;
  --st-new:#3A4743; --st-learn:#5B98DD; --st-solid:#4DB37A; --st-due:#E89A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1715; --surface:#17221F; --ink:#E7EEEB; --muted:#93A39D; --line:#2A3834;
  --page:#141D1A; --page-edge:#2A3834;
  --lapis:var(--acc-d); --lapis-soft:var(--accs-d); --on-lapis:#0F1715;
  --gold:#E0B25E; --gold-soft:#33291A;
  --st-new:#3A4743; --st-learn:#5B98DD; --st-solid:#4DB37A; --st-due:#E89A4A; color-scheme:dark}
:root[data-theme="sepia"]{
  --paper:#EFE5CD; --surface:#FBF5E7; --ink:#3A2E1F; --muted:#76664F; --line:#E0D3B6;
  --page:#FBF3DF; --page-edge:#D9C9A3;
  --gold:#9A6516; --gold-soft:#EEDDB8; --st-new:#D6CBB2}
:root[data-accent="green"]{--acc-l:#2F6B4F; --acc-d:#7CC4A0; --accs-l:#E2EFE8; --accs-d:#18302A}
:root[data-accent="teal"]{--acc-l:#0F6E73; --acc-d:#6CC9CC; --accs-l:#DDF0F0; --accs-d:#14302F}
:root[data-accent="maroon"]{--acc-l:#7A2E3B; --acc-d:#E39AA6; --accs-l:#F4E3E6; --accs-d:#33191E}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:15px;line-height:1.7}
.app{max-width:480px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;padding-block:16px 96px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--lapis)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{background:var(--lapis);color:var(--on-lapis);border:none}
.hero .muted{color:inherit;opacity:.8}
.hero .q{font-family:"Amiri Quran",var(--f-q);font-size:22px;line-height:2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-main{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.hero .btn-main{background:var(--on-lapis);color:var(--lapis);border-color:var(--on-lapis)}
.btn-ghost{background:transparent}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;flex:none}
.icon-btn svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--st-solid)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
.siyaq-strip{display:flex;gap:3px}
.siyaq-strip span{height:10px;border-radius:3px;background:var(--c)}
.siyaq-strip span.fstart{margin-inline-start:5px}
.fasl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding:6px 2px;border-top:2px solid var(--line)}
.fasl-head b{font-size:15px;color:var(--lapis)}
.fasl-head .fdesc{flex-basis:100%;color:var(--ink)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd{display:flex;flex-direction:column;gap:8px}
.upd-app{display:flex;flex-direction:column;gap:8px}
.rc-h{margin:14px 4px 6px;font-size:15px}
.rc-list{padding:4px 12px}
.rc-row{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.rc-row:last-child{border-bottom:0}
.rc-row.cur .rc-main b{color:var(--lapis)}
.rc-play{width:38px;height:38px;border-radius:50%;padding:0;flex:none;display:grid;place-items:center}
.rc-main{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rc-act{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.rc-def{font-size:11px;background:var(--lapis);color:var(--on-lapis);border-radius:99px;padding:1px 8px}
.rc-b{font-size:12px;border-radius:99px;padding:1px 8px;align-self:flex-start}
.rc-b.ok{background:var(--lapis-soft);color:var(--lapis);font-weight:700}
.rc-b.part{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.rc-b.run{background:color-mix(in srgb,var(--gold) 30%,transparent);color:var(--ink)}
.rc-b.none{color:var(--muted,#888);border:1px dashed var(--line)}
.upd-meta{display:flex;flex-wrap:wrap;gap:4px 14px}
.upd-msg{margin:0}
.dlrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dlrow:last-child{border-bottom:none}
.dlrow .bar{grid-column:1/-1}
.ok{color:var(--st-solid);font-weight:700}
.fasl-head.nested{border-top-style:dashed;margin-inline-start:14px}
.siyaq-item.nested{margin-inline-start:14px;width:calc(100% - 14px)}
.siyaq-strip span.cur{outline:2px solid var(--gold);outline-offset:1px}
.surah-row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;border-radius:0;text-align:right;width:100%}
.surah-row .idx{font-size:12px;color:var(--muted);text-align:center}
.surah-row .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:none;border-radius:0;background:none;padding:9px 2px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-current="page"]{color:var(--lapis);font-weight:700}
.tabs svg{width:22px;height:22px}
.topbar{display:flex;flex-direction:column;gap:8px}
.counters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.chip{font-size:12.5px;padding:2px 10px 2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.mem{--c:var(--st-solid)} .chip.tad{--c:var(--lapis)}
.chip b{font-size:14px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--lapis-soft);color:var(--ink)}
.tag-test{background:var(--gold-soft);color:var(--ink);font-size:12px;padding:6px 10px;border-radius:10px}
.siyaq-item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;width:100%}
.siyaq-item .stripe{align-self:stretch;border-radius:4px;background:var(--c)}
.mine{font-size:12px;color:var(--lapis)}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--paper);z-index:10;display:flex;flex-direction:column;max-width:480px;margin-inline:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{flex:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 16px 0}
.steps span{height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--gold)}
.steplabels{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 16px 0;font-size:11px;color:var(--muted);text-align:center}
.steplabels .on{color:var(--ink);font-weight:700}
.sheet .body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet .body > *,main > *{flex-shrink:0}
.sheet footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:10px}
.sheet footer button{flex:1}
.subnav{display:flex;gap:6px}
.subnav span{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:8px;background:var(--line);color:var(--muted)}
.subnav span.on{background:var(--lapis-soft);color:var(--ink);font-weight:700}
.help{background:var(--lapis-soft);border-radius:12px;padding:12px 14px;font-size:13px}
.deck-btn{display:flex;align-items:center;gap:12px;text-align:start;width:100%;padding:12px 14px;border-radius:14px;background:var(--lapis-soft);border:1px solid var(--lapis)}
.deck-ic{font-size:26px;line-height:1}
.deck-hero{text-align:center;gap:8px}
.deck-name{font-size:20px}
.deck-id{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.deck-id>div{display:flex;flex-direction:column;gap:2px;background:var(--lapis-soft);border-radius:12px;padding:8px 4px}
.deck-id b{font-size:16px}
@media (max-width:380px){.deck-id{grid-template-columns:repeat(2,1fr)}}
.deck-list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.flow{display:flex;flex-direction:column;gap:8px}
.fl-node{display:flex;flex-direction:column;gap:8px}
.fl-kids{display:flex;flex-direction:column;gap:8px;padding-right:14px;margin-right:10px;border-right:2px solid var(--lapis)}
.fl-box{display:flex;flex-direction:column;gap:4px;text-align:start;width:100%;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.fl-lbl{background:var(--lapis-soft);border-color:var(--lapis);text-align:center}
.fl-pre{padding-bottom:12px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
.fl-note{margin:2px 0 0;color:var(--muted,#777)}
.fl-ay{font-size:12px;color:var(--lapis);font-weight:700}
.fl-ar{font-family:var(--f-q);font-size:18px;line-height:1.9;direction:rtl}
.deck-dua{background:var(--lapis-soft)}
.deck-dua p{font-size:16px;line-height:2}
.meaning{background:var(--lapis-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.meaning b{font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;font-size:13px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;gap:2px;padding:12px 6px}
.rate small{color:var(--muted);font-size:12px}
select,input[type=text],textarea{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
textarea{resize:vertical}
label{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:12px}
.swatch{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold)}
input[type=range]{width:100%;accent-color:var(--lapis)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--lapis);flex:none}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
details summary::after{content:"+";float:left;color:var(--muted)}
details[open] summary::after{content:"−"}
details > div{padding-bottom:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details ol,details ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.dl-pill{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:12px;z-index:25;display:flex;align-items:center;gap:6px;max-width:62%;padding:7px 12px;border-radius:99px;background:var(--lapis);color:var(--on-lapis);border:0;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:13px}
.dl-pill[hidden]{display:none}
.dl-pill .dl-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-pill .dl-ic{animation:dlb 1.4s ease-in-out infinite}
@keyframes dlb{50%{transform:translateY(2px)}}
@media (prefers-reduced-motion:reduce){.dl-pill .dl-ic{animation:none}}
.dl-row{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:0}
.dl-why{color:var(--danger,#b3261e)}
.path{font-size:12px;background:var(--lapis-soft);border-radius:8px;padding:6px 10px;word-break:break-all;text-align:left}
.path-s{font-size:11px;word-break:break-all;unicode-bidi:isolate}
.store-list{display:flex;flex-direction:column;gap:8px;margin-block:8px}
.store-list>.row{padding-bottom:6px;border-bottom:1px solid var(--line)}
body.has-dl .toast{bottom:128px}
.toast{position:fixed;bottom:84px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30}
.mw.weak{text-decoration:underline dotted var(--st-due);text-decoration-thickness:2px;text-underline-offset:6px}
.mw.errw{background:color-mix(in srgb,var(--st-due) 28%,transparent)}
.markbar{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--gold-soft)}
.markbar>span{flex:1 1 100%}
.sheet footer .markbar button{flex:0 0 auto;padding:7px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.ar{font-family:"Amiri Quran","Amiri",serif;font-size:21px;line-height:2.2;direction:rtl}
.ar mark,.ar .errw{background:color-mix(in srgb,var(--st-due) 30%,transparent);color:inherit;border-radius:4px}
.ar mark{background:var(--gold-soft)}
.sres{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px solid var(--line)}
.sres:last-child{border-bottom:none}
.tbar{display:flex;align-items:center;gap:8px;font-size:13px}
.tbar>span:first-child{flex:0 0 132px}
.tbar .bar{flex:1;margin:0}
.books{display:flex;flex-direction:column;gap:8px}
.book{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.book b{font-size:14px;font-weight:700}
.bk-ic{font-size:20px}
.bk-buy{color:var(--lapis);font-weight:700;white-space:nowrap}
.about{gap:14px}
.about-head{display:flex;gap:14px;align-items:center}
.about-logo svg{width:72px;height:72px;display:block;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.about-head h2{font-size:20px}
.about-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.about-row{display:grid;grid-template-columns:30px 64px 1fr;gap:8px;align-items:center;padding:9px 12px}
.about-row+.about-row{border-top:1px solid var(--line)}
.about-ic{font-size:17px;text-align:center}
.about-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnlink{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px}
.about-foot{text-align:center}
.about-feats{display:flex;flex-wrap:wrap;gap:6px}
.about-feats span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--lapis-soft)}
.about-row{grid-template-columns:30px 82px 1fr}
.about-actions>:last-child:nth-child(odd){grid-column:1/-1}
.contact-row{display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.contact-title{font-weight:700;font-size:14px}

.contacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.contact{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
.contact-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}

.player{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:8px 10px;display:flex;flex-direction:column;gap:8px}

.pl-play svg{width:24px;height:24px}
.pl-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.pl-info b,.pl-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-set{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.pl-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-set .seg{display:grid;grid-template-columns:repeat(5,1fr)}
.pl-set .seg button{padding:7px 2px;font-size:13px}
.me.fav{color:var(--gold)!important;text-shadow:0 0 1px var(--gold)}
.fav-star{color:var(--gold);font-size:18px}
.uv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.uv.got{border-color:var(--st-solid)}
.wbw{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.wb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:10px;background:var(--paper);border:1px solid var(--line);min-width:52px}
.wb.on{border-color:var(--lapis);background:var(--lapis-soft)}
.wb.mine{box-shadow:inset 0 -3px 0 var(--gold)}
.wb-ar{font-size:22px;line-height:1.7}
.wb-fa{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;max-width:120px}
.wsel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--gold-soft)}
.wsel .ar{font-size:24px}
.uv-tr{font-size:14px;margin:0}
.uv-ok{border-top:1px dashed var(--line);padding-top:6px}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:none}
.vrow-ar{font-size:24px}
.flash{align-items:center;text-align:center;gap:12px;padding:28px 16px}
.flash-ar{font-size:44px}
.flash-fa{font-size:22px;font-weight:700;color:var(--lapis)}
.sinfo{gap:10px}
.sinfo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.sinfo-grid div{display:flex;flex-direction:column;background:var(--paper);border-radius:10px;padding:6px 2px}
.sinfo-grid b{font-size:18px}
.sinfo-time{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.tracks4{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.tr4 .bar{margin:2px 0 0}
.chips4{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.c4{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.c4.on{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 18%,transparent)}
.tafsir-body{line-height:2;font-size:15px}
.tafsir-body.ar-text .tf-text{font-family:"Amiri Quran","Amiri",serif;font-size:19px;line-height:2.1}
.tf-text{white-space:normal}
.plan-i{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;padding:10px 12px;width:100%}
.plan-i small{color:var(--muted);white-space:nowrap}
.resume .row{gap:8px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:8px 4px;border-radius:12px;background:var(--paper);opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:var(--gold-soft)}
.badge span{font-size:24px}
.badge small{font-size:10.5px;line-height:1.4}
.quiz-opts,.order-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order-opts{grid-template-columns:1fr}
.quiz-opts button.right{background:var(--st-solid);color:#fff;border-color:var(--st-solid)}
.quiz-opts button.wrong,.order-opts button.wrong{background:var(--st-due);color:#fff;border-color:var(--st-due)}
.class-table{display:flex;flex-direction:column;gap:6px}
.class-row{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.class-row button{align-self:flex-start}
.tip{border:1px dashed var(--lapis);background:var(--lapis-soft)}
.report .row{padding:4px 0;border-bottom:1px solid var(--line)}
mark.diff{background:color-mix(in srgb,var(--st-due) 35%,transparent);color:inherit;border-radius:4px}
.simwarn{border-color:var(--st-due);color:var(--st-due)}
video{width:100%;border-radius:10px;background:#000}
.stepper{display:flex;gap:2px;position:relative;padding-top:2px}
.stepper::before{content:"";position:absolute;inset-inline:7%;top:19px;height:2px;background:var(--line)}
.step{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;position:relative;color:var(--ink);text-align:center}
.step:focus-visible i{outline:2px solid var(--lapis);outline-offset:2px}
.step i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:14px;font-weight:800}
.step.done i{background:var(--st-solid);border-color:var(--st-solid);color:#fff}
.step.cur i{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px var(--gold-soft)}
.step.cur span{font-weight:800}
.step.lock{color:var(--muted)}
.ic-lock{width:15px;height:15px;vertical-align:-2px}
.siyaq-item.locked{opacity:.7}
.ok-pill{background:var(--st-solid);color:#fff}
.cur-pill{background:var(--gold);color:#fff}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start}

.okcard{border-color:var(--st-solid)}
.lockcard{align-items:center;text-align:center}

.intro p{font-size:16px;opacity:.9}

.intro .dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.intro .dots i.on{opacity:1}
.intro button{background:var(--on-lapis);color:var(--lapis);border:none;font-weight:700}
.intro .skip{background:transparent;color:inherit;opacity:.8}
footer.note{font-size:12px;color:var(--muted);text-align:center}

.mpage{background:var(--page);border:1px solid var(--page-edge);border-radius:6px;padding:10px 8px 6px;box-shadow:inset 0 0 0 4px var(--page),inset 0 0 0 5px var(--page-edge);color:var(--ink);overflow:hidden}
.mrow{display:grid;grid-template-columns:5px minmax(0,1fr);gap:5px;align-items:stretch}
.mmark{display:flex;flex-direction:column;border-radius:3px;overflow:hidden}
.mmark i{flex:1;background:var(--c)}

.mline.txt{column-gap:.22em;font-family:var(--f-q)}

.mfoot{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-ui);margin-top:4px}

.mnav{display:flex;align-items:center;gap:8px}
.mnav .pg{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.wordbar{position:fixed;inset-inline:0;bottom:64px;max-width:480px;margin-inline:auto;padding:0 12px;z-index:6}
.wordbar .card{box-shadow:0 6px 24px rgba(0,0,0,.18);gap:8px}
/* lessons */
.tr{margin:0;font-size:14.5px;line-height:1.9}
.lesson{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lesson audio{width:100%}
.vframe{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

میان خود صلح و آشتی برقرار سازید و از خدا و رسول اطاعت کنید و با یادآوری نصرت‌های الهی در این مرحله از پیروزی، خود را آماده‌ی ادامه‌ی جهاد کرده و به دشمن پشت نکنید.","to":["p1","p2","p3"]},{"id":"f2","t":"فراز دوم (آیات ۱۷ تا ۲۹): اختلاف و نزاع برخی از مؤمنان درباره‌ی انفال، جامعه‌ی ایمانی را در معرض فتنه قرار داده است. ای مؤمنان! از خدا و رسول اطاعت کنید و دعوت ایشان را استجابت کنید و به خدا و رسول خیانت نکنید و تقوای الهی پیشه کنید تا در پرتو آن به تشخیص حق برسید.","to":["p4","p5","p6","p7","p8"]},{"id":"r2","t":"سیاق دوم (آیات ۳۰ تا ۷۱)","to":["f3","f4"]},{"id":"f3","t":"فراز اول (آیات ۳۰ تا ۴۹): اینک که پیروزی حاصل شده و غنائمی به دست آمده است، چرا باید جهاد با کافران را ادامه داد؟ کافران خبیثانی هستند که دین خدا را مسخره گرفته‌اند و اینک زمان عذاب ایشان رسیده است و هدف نهایی، نابودی کافران و ریشه‌کن شدن فتنه از کل عالم است؛ ای مؤمنان نزاع را رها کنید و جهاد را ادامه دهید و مانند منافقان و مؤمنان مریض‌القلب نباشید.","to":["p9","p10","p11"]},{"id":"f4","t":"فراز دوم (آیات ۵۰ تا ۷۱): چرا باید همه‌ی کافران از بین بروند؟ و چگونه این کار باید انجام شود؟ نابودی کافران ظلم خدا نیست و به ظلم آنان برمی‌گردد؛ از این رو نابودی ایشان سنتی حتمی است که در قالب جهاد و به دنبال پیمان‌شکنی و خیانت ایشان صورت می‌پذیرد. از این رو، پیامبر به امر خدا مؤمنان را برای تحقق این سنت الهی به جهاد با کافران دعوت می‌کند.","to":["p12","p13","p14","p15"]},{"id":"r3","t":"سیاق سوم (آیات ۷۲ تا ۷۵): غفلت از لزوم پشتیبانی مؤمنان از یکدیگر در فضایی که کافران پشتیبان یکدیگرند. ولایت مؤمنان نسبت به یکدیگر و حتی یاری کردن مؤمنانی که از ولایت ایشان خارج‌اند، موجب جلوگیری از فتنه و فساد کافران در زمین و توسعه‌ی جامعه‌ی مؤمنان خواهد بود.","to":["p16","p17"]},{"id":"p1","s":1,"e":6,"t":"انفال از آنِ خدا و رسول است؛ ویژگی‌های مؤمنان حقیقی؛ و ناخوشایندی گروهی از مؤمنان از بیرون آمدن به حق"},{"id":"p2","s":7,"e":14,"t":"وعده‌ی یکی از دو گروه؛ یاری خدا با هزار فرشته، آرامش و آب؛ و فرمان به فرشتگان"},{"id":"p3","s":15,"e":16,"t":"نهی از پشت کردن به دشمن در میدان نبرد"},{"id":"p4","s":17,"e":19,"t":"شما آنان را نکشتید بلکه خدا کشت؛ آزمونی نیکو برای مؤمنان؛ و سست‌کردن نیرنگ کافران"},{"id":"p5","s":20,"e":23,"t":"فرمان اطاعت از خدا و رسول؛ و بدترین جنبندگان، کر و لال‌های نیندیشنده"},{"id":"p6","s":24,"e":26,"t":"استجابت دعوت رسول که زندگی می‌بخشد؛ پروا از فتنه‌ای فراگیر؛ یادآوری روزگار ضعف"},{"id":"p7","s":27,"e":28,"t":"خیانت نکردن به خدا و رسول و امانت‌ها؛ مال و فرزند فتنه‌اند"},{"id":"p8","s":29,"e":29,"t":"تقوا فرقان می‌آورد و گناهان را می‌پوشاند"},{"id":"p9","s":30,"e":38,"t":"نیرنگ کافران علیه پیامبر؛ نماز سوت و کف‌زدن‌شان؛ انفاق مال برای بازداشتن از راه خدا"},{"id":"p10","s":39,"e":44,"t":"ادامه‌ی جهاد تا فتنه‌ای نماند؛ خمس غنایم؛ بازگویی روز فرقان (بدر)"},{"id":"p11","s":45,"e":49,"t":"ثبات‌قدم و یاد خدا؛ پرهیز از نزاع؛ شبیه کافران متکبر و منافقان نبودن؛ فریب شیطان"},{"id":"p12","s":50,"e":54,"t":"لحظه‌ی جان‌گرفتن کافران؛ و سنت الهی در سرنوشت آل فرعون و پیشینیان"},{"id":"p13","s":55,"e":63,"t":"بدترین جنبندگان کافران پیمان‌شکن‌اند؛ آماده کردن نیرو؛ و پذیرش صلح در صورت تمایل دشمن"},{"id":"p14","s":64,"e":66,"t":"خدا و مؤمنان پیرو تو را بس‌اند؛ برانگیختن مؤمنان به جنگ"},{"id":"p15","s":67,"e":71,"t":"حکم اسیران و غنایم"},{"id":"p16","s":72,"e":73,"t":"ولایت مؤمنان هجرت‌کرده و یاری‌دهندگان نسبت به یکدیگر؛ و ولایت کافران با یکدیگر"},{"id":"p17","s":74,"e":75,"t":"مؤمنان حقیقی: هجرت‌کنندگان، جهادگران، پناه‌دهندگان و یاران؛ و خویشاوندان در کتاب خدا نسبت به هم سزاوارترند"}]},"source":"اسلاید «تدبر در سوره انفال»، مؤسسه تدبر در کلام وحی"},{"n":9,"name":"توبه","type":"medinan","total":129,"src":"ruku","dir":null,"siyaqs":[{"n":1,"s":1,"e":6,"title":null,"steps":[]},{"n":2,"s":7,"e":16,"title":null,"steps":[]},{"n":3,"s":17,"e":24,"title":null,"steps":[]},{"n":4,"s":25,"e":29,"title":null,"steps":[]},{"n":5,"s":30,"e":37,"title":null,"steps":[]},{"n":6,"s":38,"e":42,"title":null,"steps":[]},{"n":7,"s":43,"e":59,"title":null,"steps":[]},{"n":8,"s":60,"e":66,"title":null,"steps":[]},{"n":9,"s":67,"e":72,"title":null,"steps":[]},{"n":10,"s":73,"e":80,"title":null,"steps":[]},{" function stepsOf(s, q) {
  if (q.steps.length) return q.steps.map(x => ({...x, ref: true}));

  if (n && n.cuts.length) {

function ensureFonts(names) {
  if (cfg.qfont !== "qcf") return false;
  let ready = true;
  names.forEach(n => {
    if (fontState[n] === "ok") return;
    ready = false;
    if (fontState[n]) return;
    fontState[n] = "loading";
    try {
      const ff = new FontFace(n, `url(${fontFile(n)}) format("woff2")`, {display: "block"});
      ff.load().then(f => { document.fonts.add(f); fontState[n] = "ok"; refresh(); })
        .catch(() => { fontState[n] = "fail"; if (!fontWarned) { fontWarned = true; toast("قلم مصحف دریافت نشد؛ صفحه با قلم جایگزین نمایش داده شد"); } refresh(); });
    } catch (e) { fontState[n] = "fail"; }
  });
  return ready;
}
const pageFonts = pg => [...new Set(pg.lines.flat().map(w => w[2]))];

// Mushaf pages are loaded on demand (604 small files) and kept in memory
const PAGE_CACHE = {}, PAGE_LOADING = {};
function getPage(p) {
  if (PAGE_CACHE[p]) return PAGE_CACHE[p];
  if (!PAGE_LOADING[p]) {
    PAGE_LOADING[p] = fetch(PAGE_BASE + String(p).padStart(3, "0") + ".json").then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => { PAGE_CACHE[p] = j; refresh(); })
      .catch(() => { setTimeout(() => { PAGE_LOADING[p] = null; }, 3000); });
  }
  return null;
}
const pagesFor = (sn, a, b) => { const s = S[sn], set = new Set(); for (let i = a; i <= b; i++) { set.add(s.vp[i - 1]); (s.split[i] || []).forEach(x => set.add(x)); } return [...set].sort((x, y) => x - y); };
const pageOfSurah = sn => S[sn].vp[0];
function vtext(sn, ay) {
  const p = S[sn].vp[ay - 1], pg = getPage(p);
  if (!pg) return "";
  return pg.lines.flat().filter(w => w[0] === "w" && w[3] === key(sn, ay)).map(w => w[4]).join(" ");
}

/* Render mushaf pages.
   opt.state(vk) -> "show" | "dim" | "mask" | "hidden-line"
   opt.wordMask(vk, pos) -> true to mask one word
   opt.only(vk) -> line is shown only if it holds a verse where only() is true
   opt.labels: {vk: label} shown above the line holding that verse's first word
   opt.cut: end markers act as step dividers
   opt.marks: siyaq status bar beside each line */
function renderPages(pnums, opt = {}) {
  const st8 = opt.state || (() => "show");
  return pnums.map(pn => {
    const pg = getPage(pn);
    if (!pg) return `<div class="mpage" style="min-height:40vh;display:grid;place-items:center"><span class="small muted">در حال بارگیری صفحه ${FA(pn)}…</span></div>`;
    const qcf = ensureFonts(pageFonts(pg));
    const out = [];
    let curSura = null;
    pg.lines.forEach((ln, li) => {
      const vks = ln.filter(w => w[0] === "w" || w[0] === "e").map(w => w[3]);
      if (ln[0] && (ln[0][0] === "h" || ln[0][0] === "b")) curSura = +ln[0][3];
      if (opt.only) {
        const keep = vks.length ? vks.some(opt.only) : (curSura && opt.onlySura === curSura && opt.showHead);
        if (!keep) return;
      }
      const labels = opt.labels ? [...new Set(vks)].filter(v => opt.labels[v] && ln.find(w => w[3] === v) === ln.find(w => w[3] === v && w[0] === "w") && firstWordLine(pg, v) === li).map(v => `<div class="mlabel">${esc(opt.labels[v])}</div>`).join("") : "";
      let pos = {};
      const words = ln.map(w => {
        const [t, ch, font, ref, text] = w;
        if (t === "h") return qcf ? `<span class="mhead" style="font-family:'${font}'">${ch}</span>` : `<span class="mhead txt">سوره ${esc(S[+ref] ? S[+ref].name : text)}</span>`;
        if (t === "b") return qcf ? `<span style="font-family:'${font}'">${ch}</span>` : `<span style="font-family:var(--f-q)">${esc(text || "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ")}</span>`;
        const vk = ref, s8 = st8(vk);
        pos[vk] = (pos[vk] || 0) + (t === "w" ? 1 : 0);
        let cls = t === "e" ? "me" : "mw";
        if (s8 === "dim") cls += " dim";
        if (t === "w" && (s8 === "mask" || (opt.wordMask && opt.wordMask(vk, pos[vk])))) cls += " mask";
        if (t === "e" && opt.cut && opt.cut.has(vk)) cls += " cut";
        if (t === "e" && opt.marks && (st.fav || {})[vk]) cls += " fav";
        if (opt.weak && t === "w" && !cls.includes("mask")) { const er = errOf(vk); if (er && errOpen(vk)) cls += " weak"; if (er && er.w[pos[vk]] > 0) cls += " errw"; }
        if (playingVk === vk) cls += " playing";
        const glyph = qcf ? ch : (t === "e" ? `﴿${AR(parseVk(vk)[1])}﴾` : esc(text));
        const style = qcf ? ` style="font-family:'${font}'"` : "";
        return `<span class="${cls}" data-vk="${vk}" data-t="${t}"${t === "w" ? ` data-i="${pos[vk]}"` : ""}${style}>${glyph}</span>`;
      }).join("");
      const center = ln.length === 1 && (ln[0][0] === "h" || ln[0][0] === "b");
      const sy = opt.marks ? [...new Set(vks.map(v => { const [a, b] = parseVk(v); const q = siyaqOf(a, b); return q ? key(a, q.n) : null; }).filter(Boolean))] : [];
      const mark = opt.marks ? `<span class="mmark">${sy.map(k => `<i style="--c:${COLORS[status(k)]}"></i>`).join("")}</span>` : "<span></span>";
      out.push(`${labels}<div class="mrow">${mark}<div class="mline${center ? " center" : ""}${qcf ? "" : " txt"}">${words}</div></div>`);
    });
    return `<div class="mpage" data-p="${pn}">${out.join("")}<div class="mfoot num">${FA(pg.p)}</div></div>`;

// ---------- mushaf player: play on from a verse to the end of the page, siyaq, fasl, surah or the whole Quran ----------
const MP_ENDS = [["page", "صفحه"], ["siyaq", "سیاق"], ["fasl", "فصل"], ["surah", "سوره"], ["quran", "قرآن"]];
const MP_REPS = [1, 2, 3, 4, 5, 7, 10, 20, 0];     // 0 = endless
const repName = n => n ? FA(n) + " بار" : "بی‌نهایت";
const nextV = (sn, ay) => ay < S[sn].total ? [sn, ay + 1] : sn < 114 ? [sn + 1, 1] : null;
const prevV = (sn, ay) => ay > 1 ? [sn, ay - 1] : sn > 1 ? [sn - 1, S[sn - 1].total] : null;
const pageOf = (sn, ay) => S[sn].vp[ay - 1];
function mpEnd(sn, ay, mode) {
  const s = S[sn];
  if (mode === "page") { let c = [sn, ay], n; const p = pageOf(sn, ay); while ((n = nextV(...c)) && pageOf(...n) === p) c = n; return c; }
  if (mode === "siyaq") return [sn, siyaqOf(sn, ay).e];
  if (mode === "fasl") { const f = faslOf(s, siyaqOf(sn, ay)); return [sn, f ? f.e : s.total]; }
  if (mode === "surah") return [sn, s.total];
  return [114, 6];
}
const firstOnPage = p => { for (const s of DATA.surahs) { const i = s.vp.indexOf(p); if (i >= 0) return [s.n, i + 1]; } return [1, 1]; };
let mp = {playing: false, cur: null, start: null, end: null, k: 0, round: 1, open: false};
function mpStart(sn, ay) {
  stopAudio();
  Object.assign(mp, {playing: true, start: [sn, ay], cur: [sn, ay], end: mpEnd(sn, ay, cfg.mpEnd), k: 0, round: 1, phase: "ar"});
  mpPlay();
}
function mpPlay() {
  const [sn, ay] = mp.cur;
  try { if (audio) audio.pause(); } catch (e) {}
  mp.playing = true;
  if (tab === "mushaf" && pageOf(sn, ay) !== mushafPage && !document.getElementById("sheet").innerHTML) { mushafPage = pageOf(sn, ay); closeWordbar(); render(); }
  setPlaying(key(sn, ay)); mpRefresh();
  const r = mp.phase === "tr" && cfg.mpTrans ? cfg.mpTrans : cfg.reciter;
  const a = audio = new Audio(audioHave(r, sn) && fileExists(localAudio(r, sn, ay)) ? Android.fileBase() + localAudio(r, sn, ay) : remoteAudio(r, sn, ay));
  a.onended = () => { if (audio === a && mp.playing) mpNext(); };
  a.play().catch(() => { if (audio !== a) return; mp.playing = false; setPlaying(null); mpRefresh(); toast("پخش صوت ممکن نشد؛ اینترنت را بررسی کنید"); });
}
function mpNext() {
  if (mp.phase !== "tr") {
    mp.k++;
    if (!cfg.mpRep || mp.k < cfg.mpRep) return mpPlay();
    mp.k = 0;
    if (cfg.mpTrans) { mp.phase = "tr"; return mpPlay(); }
  }
  mp.phase = "ar";

function deckFlow(s, flow) {

  const node = x => `<div class="fl-node">${x.s ? `<button class="fl-box" data-gov="${key(s.n, x.s)}" aria-label="آیات ${FA(x.s)}${x.e > x.s ? " تا " + FA(x.e) : ""} در مصحف">
      <span class="fl-ay">${x.e > x.s ? `آیات ${FA(x.s)} تا ${FA(x.e)}` : `آیه ${FA(x.s)}`}</span>

  <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>${s.name} · ${sesTitle(s, q)}</h2><button class="icon-btn btn-ghost" id="shelp" aria-label="راهنمای این مرحله" aria-expanded="${ses.help}">${ICON_HELP}</button></header>
  <div class="steps">${STAGES.map((_, i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>
  <div class="steplabels">${STAGES.map((l, i) => `<span class="${i === step ? "on" : ""}">${l}</span>`).join("")}</div>
  <div class="body">${ses.help ? `<div class="help">${HELP[step]}</div>` : ""}${content.body}</div>
  <footer>${content.foot}</footer></div>`);
  box.querySelector("#shelp").addEventListener("click", () => { ses.help = !ses.help; redraw(); });
  content.wire && content.wire(box);

  const b = box.querySelector(".body"); if (ses.keepScroll) { b.scrollTop = ses.keepScroll; ses.keepScroll = 0; }
}
function redraw() { const b = document.querySelector(".sheet .body"); if (ses) { ses.keepScroll = b ? b.scrollTop : 0; drawSession(); } }
function advance() {
  stopAudio();
  const it = st.items[ses.k] || (st.items[ses.k] = {stage: 0});

}

// ---------- word-by-word meanings (Persian, from Quran.com), fetched once per surah and kept on the phone ----------
const WBW_API = "https://api.qurancdn.com/api/qdc/verses/by_chapter/";
const WBW_AUDIO = "https://audio.qurancdn.com/";
const WBW = {}, WBW_LOADING = {};
const wbwKey = sn => "tadabbor-wbw-" + sn;
// WBW[sn][ay] = [[arabic, meaning, audio], ...] in reading order (verse-end signs left out)
function wbw(sn) {
  if (WBW[sn]) return WBW[sn];
  const c = load(wbwKey(sn), null); if (c) return (WBW[sn] = c);
  return null;
}
function storeWbw(sn, data, bulk) {
  IDB.set("wbw:" + sn, data);
  if (bulk) return;
  try { localStorage.setItem(wbwKey(sn), JSON.stringify(data)); } catch (e) {
    Object.keys(localStorage).filter(k => k.startsWith("tadabbor-wbw-") && k !== wbwKey(sn)).forEach(k => localStorage.removeItem(k));
  }
}
function loadWbw(sn) {
  if (wbw(sn)) return Promise.resolve(WBW[sn]);
  if (WBW_LOADING[sn]) return WBW_LOADING[sn];
  return WBW_LOADING[sn] = (async () => {
    const saved = await IDB.get("wbw:" + sn); if (saved) return (WBW[sn] = saved);
    const out = {};
    for (let page = 1; page <= 10; page++) {
      const j = await getJSON(`${WBW_API}${sn}?words=true&word_translation_language=fa&word_fields=text_uthmani&fields=text_uthmani&per_page=50&page=${page}`);
      (j.verses || []).forEach(v => { out[v.verse_number] = (v.words || []).filter(w => w.char_type_name === "word").map(w => [w.text_uthmani || w.text, ((w.translation || {}).text || "").trim(), w.audio_url || ""]); });
      if (!j.pagination || !j.pagination.next_page) break;
    }
    if (Object.keys(out).length < S[sn].total) throw new Error("incomplete");
    WBW[sn] = out; storeWbw(sn, out, WBW_BULK); return out;
  })().finally(() => { WBW_LOADING[sn] = null; });
}
let WBW_BULK = false, wbwAll = null;
async function downloadAllWbw() {
  if (wbwAll) return; wbwAll = {done: 0, fail: 0}; WBW_BULK = true;
  const have = new Set((await IDB.keys("wbw:")).map(k => +k.slice(4)));
  for (let sn = 1; sn <= 114; sn++) { if (!have.has(sn)) { try { await loadWbw(sn); } catch (e) { wbwAll.fail++; } } wbwAll.done = sn; const el = document.getElementById("wbw-st"); if (el) el.textContent = `در حال ذخیره: ${FA(sn)} از ۱۱۴`; }
  WBW_BULK = false; toast("معنای کلمه‌به‌کلمه ذخیره شد" + (wbwAll.fail ? ` (${FA(wbwAll.fail)} سوره ناموفق)` : "")); wbwAll = null; if (document.getElementById("wbw-st")) openSettingsKeep();
}
const wordMeaning = (sn, ay, i) => { const w = wbw(sn); return w && w[ay] && w[ay][i - 1] ? w[ay][i - 1] : null; };
function playWord(src) { if (!src) return; stopAudio(); try { audio = new Audio(WBW_AUDIO + src); audio.play().catch(() => toast("پخش تلفظ کلمه به اینترنت نیاز دارد")); } catch (e) {} }

// Stage 1, part 1: understanding the verses, word by word and verse by verse

// ---------- the four tracks of learning a siyaq: tadabbur, consolidating tadabbur, memorizing, consolidating memorization ----------
const TAD_FIX = 3;          // meaning reviews recalled in full before tadabbur counts as consolidated
const MEM_FIX = 21;         // review interval (days) from which memorization counts as consolidated
const isTadFix = k => ((st.notes[k] || {}).tok || 0) >= TAD_FIX;
const isMemFix = k => { const it = st.items[k]; return !!it && it.stage >= 5 && (it.ivl || 0) >= MEM_FIX; };
const tadDue = k => { const n = st.notes[k]; return !!n && n.done && !!n.tdue && n.tdue <= today(); };
// Called whenever the tadabbur stage of a siyaq is completed: its first meaning review comes three days later
function markTadDone(n, offset) { if (!n.done && !offset) logInc("t"); n.done = true; if (!n.tdue) { n.tivl = n.tivl || 3; n.tdue = today() + (offset || 3); } }
const TRACKS = [["tad", "تدبر", isTad, "var(--lapis)"], ["tadFix", "تثبیت تدبر", isTadFix, "var(--gold)"], ["mem", "حفظ", isMem, "var(--st-learn)"], ["memFix", "تثبیت حفظ", isMemFix, "var(--st-solid)"]];
function trackCounts(list) {   // list of siyaq keys
  const o = {}; TRACKS.forEach(([id, , f]) => { o[id] = list.filter(f).length; }); o.total = list.length; return o;
}
const surahKeys = s => s.siyaqs.map(q => key(s.n, q.n));
const trackBars = c => `<div class="tracks4">${TRACKS.map(([id, l, , col]) => `<div class="tr4"><div class="row between"><span class="small">${l}</span><span class="small muted num">${FA(c[id])} از ${FA(c.total)}</span></div>${miniBar(c.total ? c[id] / c.total : 0, col)}</div>`).join("")}</div>`;
const trackChips = k => `<span class="chips4">${TRACKS.map(([id, l, f, col]) => `<span class="c4${f(k) ? " on" : ""}" style="--c:${col}" title="${l}">${f(k) ? "✓ " : ""}${l}</span>`).join("")}</span>`;

// Rough time estimates for a surah, from its length in mushaf pages and verses
const fmtMin = m => m < 1 ? "کمتر از یک دقیقه" : m < 60 ? "حدود " + FA(Math.max(1, Math.round(m))) + " دقیقه" : "حدود " + FA(Math.round(m / 30) / 2).replace(".", "٫") + " ساعت";
function surahEstimates(s) {
  const pages = surahPages(s.n);
  return {read: pages * 1.5, tad: s.total * 3 + s.siyaqs.length * 15, mem: pages * 75};
}
const surahInfo = s => { const e = surahEstimates(s), c = trackCounts(surahKeys(s));
  return `<div class="card sinfo">
    <div class="sinfo-grid">
      <div><b>${s.type === "meccan" ? "مکی" : "مدنی"}</b><span class="small muted">نزول</span></div>
      <div><b class="num">${FA(s.total)}</b><span class="small muted">آیه</span></div>
      <div><b class="num">${FA(s.siyaqs.length)}</b><span class="small muted">سیاق</span></div>
      ${s.fasls && s.fasls.length ? `<div><b class="num">${FA(s.fasls.length)}</b><span class="small muted">فصل</span></div>` : `<div><b class="num">${FA(Math.max(0.1, Math.round(surahPages(s.n) * 10) / 10)).replace(".", "٫")}</b><span class="small muted">صفحه</span></div>`}
    </div>
    <div class="sinfo-time">
      <span>📖 خواندن: <b>${fmtMin(e.read)}</b></span>
      <span>🧠 تدبر: <b>${fmtMin(e.tad)}</b></span>
      <span>🔁 حفظ: <b>${fmtMin(e.mem)}</b></span>
    </div>
    <p class="small muted">زمان‌ها تخمینی است: خواندن با سرعت معمولی، تدبر با فهم آیات و درس استاد و کشف گام‌ها، حفظ برای یک حافظ معمولی. درس‌های ویدیویی استاد جدا حساب نشده است.</p>
    <h3>پیشرفت شما در این سوره</h3>${trackBars(c)}
  </div>`; };

// Tadabbur, part 2: learning the tadabbur of this siyaq from the teacher (lessons, books, his reading of the siyaq)
function stepTeacher(nav) {

  return {

      ${s.deck ? `<button class="deck-btn" id="t-deck"><span class="deck-ic" aria-hidden="true">🗺</span><span><b>نقشه تدبر سوره ${s.name}</b><br><span class="small muted">اسلاید مؤسسه: سیر و جهت هدایتی سوره</span></span></button>` : ""}
      <div class="row"><button id="t-les" class="btn-main">🎬 فیلم و صوت درس‌های سوره ${s.name}</button><button data-tafsir="${key(s.n, q.s)}">📖 تفسیر این آیات (${esc(tafsirOf(cfg.tafsir)[1].split("،")[0])})</button></div></div>
    ${q.title ? `<div class="card"><div class="row between"><h3>${s.src === "book" ? "پیام این سیاق از درس استاد" : s.deck ? "جهت و سیر هدایتی (اسلاید مؤسسه)" : "عنوان مرجع (آزمایشی)"}</h3><button class="small" id="t-msg" aria-expanded="${!!ses.tmsg}">${ses.tmsg ? "پنهان کن" : "نشانم بده"}</button></div>
      ${ses.tmsg ? `<div class="meaning"><b>${esc(q.title)}</b>${(q.sum || []).map(x => `<span class="small">${esc(x)}</span>`).join("")}</div>${q.steps.length ? `<ol class="small" style="margin:0;padding-inline-start:20px">${q.steps.map(x => `<li>${esc(x.t)} <span class="muted">(آیات ${FA(x.s)}${x.e > x.s ? " تا " + FA(x.e) : ""})</span></li>`).join("")}</ol>` : ""}${s.source ? `<p class="small muted">از ${esc(s.source)}</p>` : ""}` : `<p class="small muted">بعد از دیدن درس، پیام استاد درباره این سیاق را اینجا ببینید.</p>`}</div>` : ""}
    ${booksCard(books, "📚 کتاب‌های تدبر این سوره")}
    <div class="card ${n.learned ? "okcard" : ""}"><label class="switch"><span><b>تدبر این سیاق را یاد گرفتم</b><br><span class="small muted">از درس، کتاب یا کلاس استاد</span></span><input type="checkbox" id="t-ok" ${n.learned ? "checked" : ""}></label></div>`,
    foot: `<button id="back">قبلی</button><button class="btn-main" id="next">برو به کشف گام‌ها</button>`,
    wire: b => {
      b.querySelector("#t-les").addEventListener("click", () => { stopAudio(); const back = () => drawSession(); openLessons(s.n); lastDraw = () => {}; const c = document.querySelector("#sheet [data-close]"); c.replaceWith(c.cloneNode(true)); document.querySelector("#sheet [data-close]").addEventListener("click", back); });
      const dk = b.querySelector("#t-deck"); if (dk) dk.addEventListener("click", () => { stopAudio(); openDeck(s.n, () => drawSession()); });
      const m = b.querySelector("#t-msg"); if (m) m.addEventListener("click", () => { ses.tmsg = !ses.tmsg; redraw(); });
      b.querySelector("#t-ok").addEventListener("change", e => { n.learned = e.target.checked; save(); redraw(); });
      b.querySelector("#back").addEventListener("click", () => { ses.sub = 0; drawSession(); });
      b.querySelector("#next").addEventListener("click", () => {
        if (cfg.gate && !n.learned) { toast("بعد از یادگیری تدبر این بخش از استاد، تیک «یاد گرفتم» را بزنید"); return; }
        ses.sub = 1; drawSession(); });
    }
  };
}

// Consolidating tadabbur: recall the message and steps of a siyaq, then check against your notes and the teacher's
function openTadReview(k, phase) {
  const [sn, qn] = k.split(":").map(Number), s = S[sn], q = s.siyaqs[qn - 1], n = note(k), steps = stepsOf(s, q);
  lastDraw = () => openTadReview(k, phase);
  const show = phase === "show";
  const mineSteps = Object.entries(n.stepTitles || {}).filter(([, t]) => t && t.trim()).sort((a, b) => a[0] - b[0]);
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="مرور تدبر">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>مرور تدبر · ${s.name} · سیاق ${FA(qn)}</h2></header>
    <div class="body">
      <div class="card"><span class="small muted">آیات ${FA(q.s)} تا ${FA(q.e)} · تثبیت تدبر: ${FA(Math.min(n.tok || 0, TAD_FIX))} از ${FA(TAD_FIX)}</span>
        <h3>بدون نگاه به یادداشت‌ها به یاد بیاورید</h3>
        <ol class="small" style="margin:0;padding-inline-start:20px"><li>این سیاق درباره چیست و چه پیامی دارد؟</li><li>از چه گام‌هایی می‌گذرد؟</li><li>چه پیامی برای زندگی امروز شما دارد؟</li></ol>
        <button class="small" id="tr-listen">▶ شنیدن آیات</button></div>
      ${show ? `<div class="card"><h3>برداشت شما</h3>${n.title ? `<p><b>${esc(n.title)}</b></p>` : `<p class="small muted">عنوانی ننوشته بودید.</p>`}
          ${mineSteps.length ? `<ol class="small" style="margin:0;padding-inline-start:20px">${mineSteps.map(([a, t]) => `<li>${esc(t)} <span class="muted">(از آیه ${FA(a)})</span></li>`).join("")}</ol>` : ""}
          ${(n.answers || []).some(a => a && a.trim()) ? `<details><summary class="small">پاسخ‌های شما به پرسش‌های تدبری</summary><div>${QUESTIONS.map((qq, i) => n.answers[i] && n.answers[i].trim() ? `<p class="small"><b>${esc(qq)}</b><br>${esc(n.answers[i])}</p>` : "").join("")}</div></details>` : ""}
          ${(n.extra || []).length ? `<details><summary class="small">برداشت‌های بعدی (${FA(n.extra.length)})</summary><div>${n.extra.map(x => `<p class="small">${esc(x.text)}</p>`).join("")}</div></details>` : ""}</div>
        ${q.title || steps.filter(g => g.t).length > 1 ? `<div class="card"><h3>${s.src === "book" ? "پیام استاد" : s.deck ? "جهت و سیر هدایتی سوره" : "گام‌های مرجع"}</h3>${q.title ? `<div class="meaning"><b>${esc(q.title)}</b>${(q.sum || []).map(x => `<span class="small">${esc(x)}</span>`).join("")}</div>` : ""}
          ${steps.length > 1 ? `<ol class="small" style="margin:0;padding-inline-start:20px">${steps.map(g => `<li>${esc(g.t)}</li>`).join("")}</ol>` : ""}</div>` : ""}
        <div class="field"><label for="tr-ins">برداشت تازه امروز (اختیاری)</label><textarea id="tr-ins" rows="2"></textarea></div>` : ""}
    </div>
    <footer>${show ? `<button data-tr="0">یادم نبود</button><button data-tr="1">نیمه</button><button class="btn-main" data-tr="2">کامل یادم بود</button>` : `<button class="btn-main" id="tr-show">به یاد آوردم؛ نشانم بده</button>`}</footer></div>`, () => render());
  const on = (sel, f) => box.querySelectorAll(sel).forEach(x => x.addEventListener("click", () => f(x)));
  on("#tr-listen", () => playQueue(range(q.s, q.e).map(i => [sn, i])));
  on("#tr-show", () => openTadReview(k, "show"));
  on("[data-tr]", x => {
    const r = +x.dataset.tr, ins = (box.querySelector("#tr-ins") || {}).value;
    if (ins && ins.trim()) { n.extra = n.extra || []; n.extra.push({day: today(), text: ins.trim()}); }
    const ivl = n.tivl || 3;
    if (r === 2) { n.tok = (n.tok || 0) + 1; n.tivl = Math.max(7, Math.round(ivl * 2.5)); }
    else if (r === 1) { n.tivl = Math.max(2, Math.round(ivl * 1.2)); }
    else { n.tivl = 1; n.tok = Math.max(0, (n.tok || 0) - 1); }
    n.tdue = today() + n.tivl; logInc("tr"); markActive(); save();
    toast(r === 2 && n.tok === TAD_FIX ? "تدبر این سیاق تثبیت شد" : "ثبت شد · مرور تدبر بعدی " + FA(n.tivl) + " روز دیگر");
    stopAudio(); document.getElementById("sheet").innerHTML = ""; render();
  });
}
const tadReviewButton = x => `<button class="siyaq-item" data-tadrev="${x.k}" style="--c:var(--gold)"><span class="stripe"></span><span><b>${x.s.name}</b> · ${esc(title(x.s, x.q))}<br><span class="small muted">مرور تدبر · ${FA(Math.min((st.notes[x.k] || {}).tok || 0, TAD_FIX))} از ${FA(TAD_FIX)}</span></span><span class="small muted">${FA(ayahCount(x.q))} آیه</span></button>`;

// Stage 1: tadabbur, in four parts: understanding, the teacher's lesson, finding the steps, questions
function stepTadabbur() {
  const {s, q} = ses, n = note(ses.k);
  const sub = ses.sub;
  const nav = `<div class="subnav">${[[0, "فهم آیات"], [3, "درس استاد"], [1, "کشف گام‌ها"], [2, "پرسش‌ها"]].map(([id, l], i) => `<span class="${id === sub ? "on" : ""}">${FA(i + 1)}. ${l}</span>`).join("")}</div>`;
  if (sub === 0) return stepUnderstand(nav);
  if (sub === 3) return stepTeacher(nav);
  if (sub === 1) {
    const cuts = new Set(n.cuts.filter(c => c > q.s && c <= q.e).map(c => key(s.n, c - 1)));
    const segs = [q.s, ...n.cuts.filter(c => c > q.s && c <= q.e).sort((a, b) => a - b)];
    const refStarts = q.steps.map(x => x.s).slice(1), myStarts = segs.slice(1);
    const hits = refStarts.filter(x => myStarts.includes(x)).length;
    return {
      body: `${nav}
      <div class="card"><h3>این سیاق از چند گام معنایی ساخته شده؟</h3>
      <p class="small">هر جا حس کردید معنا به مرحله تازه‌ای رفت، روی <b>نشانه پایان آیه</b> بزنید تا گام تازه از آیه بعد شروع شود. نشانه‌های طلایی مرز گام‌های شماست. بعد برای هر گام یک عنوان کوتاه بنویسید.</p></div>
      <div id="cutpages">${sesPages(q.s, q.e, {cut: cuts})}</div>
      <div class="card"><h3>گام‌های من</h3>
      ${segs.map((a, i) => { const e = (segs[i + 1] || q.e + 1) - 1; return `<div class="field"><label for="st-${a}">گام ${FA(i + 1)} · آیات ${FA(a)}${e > a ? " تا " + FA(e) : ""}</label><input type="text" id="st-${a}" data-stitle="${a}" value="${esc(n.stepTitles[a] || "")}" placeholder="عنوان کوتاه این گام"></div>`; }).join("")}</div>
      ${q.steps.length ? `<div class="card"><div class="row between"><h3>مقایسه با گام‌های مرجع</h3><button class="small" id="cmp" aria-expanded="${ses.cmp}">${ses.cmp ? "پنهان کن" : "نشانم بده"}</button></div>
        ${ses.cmp ? `<p class="small">شما ${FA(hits)} مرز از ${FA(refStarts.length)} مرز مرجع را پیدا کردید.</p><ol class="small" style="margin:0;padding-inline-start:20px">${q.steps.map(x => `<li>${esc(x.t)} <span class="muted">(آیات ${FA(x.s)}${x.e > x.s ? " تا " + FA(x.e) : ""})</span></li>`).join("")}</ol><p class="small muted">در حفظ، گام‌های مرجع مبنا هستند و برداشت شما کنارش نگه داشته می‌شود.</p>` : `<p class="small muted">بعد از تقسیم خودتان، گام‌های مرجع را ببینید و مقایسه کنید.</p>`}</div>` : `<p class="small muted">برای این سیاق هنوز گام مرجع نداریم؛ گام‌های خودتان مبنای حفظ می‌شود.</p>`}`,
      foot: `<button id="back">قبلی</button><button class="btn-main" id="next">برو به پرسش‌ها</button>`,
      wire: b => {
        b.querySelector("#cutpages").addEventListener("click", e => {
          const m = e.target.closest('[data-t="e"]'); if (!m) return;
          const [x, y] = parseVk(m.dataset.vk); if (x !== s.n || y < q.s || y >= q.e) return;
          const a = y + 1; n.cuts = n.cuts.includes(a) ? n.cuts.filter(c => c !== a) : [...n.cuts, a]; save(); redraw();
        });
        b.querySelectorAll("[data-stitle]").forEach(x => x.addEventListener("input", () => { n.stepTitles[x.dataset.stitle] = x.value; save(); }));
        const c = b.querySelector("#cmp"); if (c) c.addEventListener("click", () => { ses.cmp = !ses.cmp; redraw(); });
        b.querySelector("#back").addEventListener("click", () => { ses.sub = 3; drawSession(); });
        b.querySelector("#next").addEventListener("click", () => { ses.sub = 2; drawSession(); });
      }
    };
  }
  return {
    body: `${nav}
    <div class="card"><h3>پرسش‌های تدبری</h3><p class="small">کوتاه و به زبان خودتان بنویسید. پاسخ درست و غلط ندارد؛ هدف، ارتباط گرفتن با آیات پیش از حفظ است.</p></div>
    ${QUESTIONS.map((qq, i) => `<div class="field"><label for="qa-${i}">${FA(i + 1)}. ${qq}</label><textarea id="qa-${i}" data-qa="${i}" rows="2">${esc(n.answers[i] || "")}</textarea></div>`).join("")}
    <div class="field"><label for="mytitle"><b>عنوان این سیاق به زبان من</b></label><input type="text" id="mytitle" value="${esc(n.title)}" placeholder="در یک جمله کوتاه"></div>
    ${q.title ? `<div class="card"><div class="row between"><h3>${s.src === "book" ? "مقایسه با برداشت استاد" : s.deck ? "مقایسه با جهت هدایتی سوره" : "عنوان مرجع (آزمایشی)"}</h3><button class="small" id="cmp2" aria-expanded="${!!ses.cmp2}">${ses.cmp2 ? "پنهان کن" : "نشانم بده"}</button></div>
      ${ses.cmp2 ? `<div class="meaning"><b>${esc(q.title)}</b>${(q.sum || []).map(x => `<span class="small">${esc(x)}</span>`).join("")}</div>${s.source ? `<p class="small muted">از ${esc(s.source)}</p>` : ""}` : `<p class="small muted">اول برداشت خودتان را بنویسید، بعد با پیام اصلی این سیاق مقایسه کنید.</p>`}</div>` : ""}`,
    foot: `<button id="back">قبلی</button><button class="btn-main" id="next">تدبر تمام شد؛ برو به شنیدن</button>`,
    wire: b => {
      b.querySelectorAll("[data-qa]").forEach(x => x.addEventListener("input", () => { n.answers[+x.dataset.qa] = x.value; save(); }));
      b.querySelector("#mytitle").addEventListener("input", e => { n.title = e.target.value; save(); });
      const c2 = b.querySelector("#cmp2"); if (c2) c2.addEventListener("click", () => { ses.cmp2 = !ses.cmp2; redraw(); });
      b.querySelector("#back").addEventListener("click", () => { ses.sub = 1; drawSession(); });
      b.querySelector("#next").addEventListener("click", () => {
        if (cfg.gate && !n.title.trim() && !n.answers.some(a => a.trim())) { toast("دست‌کم به یک پرسش پاسخ دهید یا عنوانی بنویسید"); return; }
        markTadDone(n); markActive(); save(); advance();
      });
    }
  };
}

function stepListen() {
  const {s, q} = ses, steps = stepsOf(s, q);
  const labels = Object.fromEntries(steps.map(g => [key(s.n, g.s), g.t]));
  return {body: `
    <div class="card"><p class="small">کل سیاق را چند بار بشنوید و همراه قاری در دل بخوانید. قاری: ${reciterName(cfg.reciter)}</p>
    <div class="row"><span class="small">تکرار هر آیه</span><div class="seg" style="flex:1">${[1, 3, 5].map(x => `<button data-reps="${x}" aria-pressed="${cfg.reps === x}">${FA(x)} بار</button>`).join("")}</div></div>
    <div class="row"><button id="playall" class="btn-main">▶ پخش کل سیاق</button><button id="stop">■ توقف</button></div>
    <p class="small muted">روی هر آیه بزنید تا همان آیه پخش شود.</p></div>
    <div id="lpages">${sesPages(q.s, q.e, {labels})}</div>`,
    foot: `<button class="btn-main" id="next">برو به حفظ</button>`,
    wire: b => {
      b.querySelector("#next").addEventListener("click", advance);
      b.querySelectorAll("[data-reps]").forEach(x => x.addEventListener("click", () => { cfg.reps = +x.dataset.reps; saveCfg(); redraw(); }));
      b.querySelector("#playall").addEventListener("click", () => playQueue(range(q.s, q.e).flatMap(i => [...Array(cfg.reps)].map(() => [s.n, i]))));
      b.querySelector("#stop").addEventListener("click", stopAudio);
      b.querySelector("#lpages").addEventListener("click", e => { const w = e.target.closest("[data-vk]"); if (!w) return; const [x, y] = parseVk(w.dataset.vk); if (x === s.n && y >= q.s && y <= q.e) play(x, y, cfg.reps); });
    }};
}

const LEVELS = [["full", "کامل"], ["half", "نیمه"], ["first", "سرنخ"], ["none", "معنا"]];
function stepMemorize() {
  const {s, q} = ses, steps = stepsOf(s, q), g = steps[ses.si];
  const head = `<div class="meaning"><span class="small muted">گام ${FA(ses.si + 1)} از ${FA(steps.length)} · آیات ${FA(g.s)}${g.e > g.s ? " تا " + FA(g.e) : ""}</span><b>${esc(g.t)}</b></div>`;
  const ayOf = vk => parseVk(vk)[1];
  if (ses.recap) {
    const ay = range(g.s, g.e), opened = ay.filter(i => ses.shown[i]).length;
    return {body: `${head}
      <div class="card"><h3>کل این گام را یکجا از حفظ بخوانید</h3><p class="small">بعد روی هر آیه بزنید تا متن را ببینید و خودتان را بسنجید؛ اگر اشتباه داشتید ثبتش کنید تا در «دفتر اشتباهات» بماند. <span class="num">(${FA(opened)} از ${FA(ay.length)})</span></p></div>
      <div id="mpages">${sesPages(g.s, g.e, {weak: true, state: vk => ses.shown[ayOf(vk)] ? "show" : "mask"})}</div>`,
      foot: `${markBar()}<button id="again">تمرین دوباره گام</button><button class="btn-main" id="go" ${opened < ay.length ? "disabled" : ""}>${ses.si < steps.length - 1 ? "گام بعد" : "برو به اتصال"}</button>`,
      wire: b => {
        b.querySelector("#mpages").addEventListener("click", e => { const w = e.target.closest("[data-vk]"); if (!w || markWordClick(w)) return; const y = ayOf(w.dataset.vk); if (y >= g.s && y <= g.e && parseVk(w.dataset.vk)[0] === s.n) { ses.shown[y] = 1; ses.mark = {ay: y, phase: "ask"}; redraw(); } });
        wireMark(b);
        b.querySelector("#again").addEventListener("click", () => { settleChecks(range(g.s, g.e)); ses.mark = null; ses.recap = false; ses.ay = g.s; ses.level = 0; ses.shown = {}; drawSession(); });
        b.querySelector("#go").addEventListener("click", () => {
          settleChecks(range(g.s, g.e)); ses.mark = null;
          if (ses.si < steps.length - 1) { ses.si++; ses.ay = steps[ses.si].s; ses.level = 0; ses.recap = false; ses.shown = {}; drawSession(); } else advance();
        });
      }};
  }
  if (!SIMILAR) loadSimilar().then(() => { if (ses && ses.step === 2) redraw(); }).catch(() => {});
  const lv = LEVELS[ses.level][0];
  const wordMask = (vk, pos) => {
    const y = ayOf(vk); if (y !== ses.ay || parseVk(vk)[0] !== s.n) return false;
    if (lv === "half") return pos % 2 === 0;
    if (lv === "first") return pos > 1;
    if (lv === "none") return true;
    return false;
  };
  return {body: `${head}
    <div class="card"><div class="row between"><span class="small muted">سطح محو کلمات</span><span class="small num">آیه ${FA(ses.ay)}</span></div>
    <div class="seg" role="group" aria-label="سطح محو">${LEVELS.map((l, i) => `<button data-lv="${i}" aria-pressed="${i === ses.level}">${l[1]}</button>`).join("")}</div>
    ${ses.level === 3 ? `<p class="small">فقط معنای گام مانده؛ آیه را از روی معنا به یاد بیاورید. روی کلمه پنهان بزنید تا دیده شود.</p>` : `<p class="small muted">آیه‌های بعدی این گام پنهان‌اند. روی کلمه پنهان بزنید تا دیده شود.</p>`}</div>
    <div id="mpages">${sesPages(g.s, g.e, {state: vk => { const y = ayOf(vk); return y < ses.ay ? "show" : y === ses.ay ? "show" : "mask"; }, wordMask})}</div>
    <button id="hear">▶ شنیدن آیه ${FA(ses.ay)} (${FA(cfg.reps)} بار)</button>
    ${similarOf(key(s.n, ses.ay)).length ? `<button class="small simwarn" data-similar="${key(s.n, ses.ay)}">⚠ این آیه ${FA(similarOf(key(s.n, ses.ay)).length)} آیه مشابه دارد؛ تفاوت‌ها را ببینید</button>` : ""}`,
    foot: `<button id="prev" ${ses.ay === g.s && ses.level === 0 ? "disabled" : ""}>قبلی</button><button class="btn-main" id="nextay">${ses.level < 3 ? "سطح بعد" : ses.ay < g.e ? "آیه بعد" : "مرور کل گام"}</button>`,
    wire: b => {
      b.querySelectorAll("[data-lv]").forEach(x => x.addEventListener("click", () => { ses.level = +x.dataset.lv; redraw(); }));
      b.querySelector("#mpages").addEventListener("click", e => { const w = e.target.closest(".mw.mask"); if (w && ayOf(w.dataset.vk) === ses.ay) w.classList.add("peek"); });
      b.querySelector("#hear").addEventListener("click", () => play(s.n, ses.ay, cfg.reps));
      b.querySelector("#prev").addEventListener("click", () => { if (ses.level > 0) ses.level--; else { ses.ay--; ses.level = 0; } redraw(); });
      b.querySelector("#nextay").addEventListener("click", () => {

}

function stepConnect() {

}

// ---------- mistakes: where memorization slips and what still needs consolidating ----------
// st.err["2:5"] = {n: times wrong, t: {type: count}, w: {wordPos: count}, first, last: day, clean: clean recalls since, cday}
const ERR_TYPES = [["forget", "یادم نیامد"], ["word", "اشتباه در کلمه یا اعراب"], ["similar", "قاطی با آیه مشابه"], ["order", "جابه‌جایی ترتیب"]];
const errName = t => (ERR_TYPES.find(x => x[0] === t) || [, t])[1];
const CLEAN_NEED = 2;      // clean recalls, each on a later day, before a verse counts as consolidated
const errOf = vk => (st.err || {})[vk];
const errOpen = vk => { const e = errOf(vk); return !!e && (e.clean || 0) < CLEAN_NEED; };
const errList = () => Object.entries(st.err || {}).map(([vk, e]) => { const [sn, ay] = parseVk(vk); return {vk, sn, ay, e, open: (e.clean || 0) < CLEAN_NEED}; })
  .sort((a, b) => (b.open - a.open) || (b.e.n - a.e.n) || (b.e.last - a.e.last));
const weakOpen = () => errList().filter(x => x.open);
function addErr(vk, t) {
  st.err = st.err || {};
  const e = st.err[vk] || (st.err[vk] = {n: 0, t: {}, w: {}, first: today()});
  e.n++; e.t[t] = (e.t[t] || 0) + 1; e.last = today(); e.clean = 0; e.cday = null;
  markActive(); save();
}
function undoErr(vk, t, words) {
  const e = errOf(vk); if (!e) return;
  e.n--; e.t[t] = Math.max(0, (e.t[t] || 1) - 1);
  (words || []).forEach(i => { e.w[i] = Math.max(0, (e.w[i] || 1) - 1); });
  if (e.n <= 0) delete st.err[vk];
  save();
}
// A correct recall of a weak verse; counts once a day and not on the day of the mistake
function cleanCheck(vk) {
  const e = errOf(vk); if (!e || e.last === today() || e.cday === today()) return false;
  e.clean = (e.clean || 0) + 1; e.cday = today(); if (e.clean === CLEAN_NEED) logInc("w"); save(); return true;
}
const ago = d => { const n = today() - d; return n <= 0 ? "امروز" : n === 1 ? "دیروز" : FA(n) + " روز پیش"; };

// In-session marking: after a verse is revealed the reader says whether it was right
function markBar() {
  const m = ses.mark; if (!m) return "";
  const had = ses.errs[m.ay];
  if (had) return `<div class="markbar" role="status"><span class="small"><b>آیه ${FA(m.ay)}:</b> «${errName(had)}» در دفتر اشتباهات ثبت شد. اگر خواستید روی کلمه‌های اشتباه بزنید.</span>${had === "similar" ? `<button class="small" data-similar="${key(ses.s.n, m.ay)}">دیدن آیات مشابه</button>` : ""}<button class="small btn-ghost" data-mk="undo">لغو ثبت</button><button class="small" data-mk="ok">بستن</button></div>`;
  if (m.phase === "type") return `<div class="markbar"><span class="small"><b>آیه ${FA(m.ay)}</b> · چه اشتباهی بود؟</span>${ERR_TYPES.map(([k, l]) => `<button class="small" data-mk="t:${k}">${l}</button>`).join("")}<button class="small btn-ghost" data-mk="ok">انصراف</button></div>`;
  return `<div class="markbar"><span class="small">آیه ${FA(m.ay)} را درست از حفظ خواندید؟</span><button class="small" data-mk="ok">✓ درست</button><button class="small" data-mk="bad">✗ اشتباه داشتم</button></div>`;
}
function wireMark(b) {
  b.querySelectorAll("[data-mk]").forEach(x => x.addEventListener("click", () => {
    const a = x.dataset.mk, m = ses.mark; if (!m) return;
    const vk = key(ses.s.n, m.ay);
    if (a === "ok") ses.mark = null;
    else if (a === "bad") m.phase = "type";
    else if (a === "undo") { undoErr(vk, ses.errs[m.ay], ses.ew[m.ay]); delete ses.errs[m.ay]; delete ses.ew[m.ay]; ses.mark = null; }
    else if (a.startsWith("t:")) { const t = a.slice(2); addErr(vk, t); ses.errs[m.ay] = t; ses.ew[m.ay] = []; }
    redraw();
  }));
}
// Tapping a word of the verse just marked wrong toggles that word as one of the slips
function markWordClick(w) {
  const m = ses.mark; if (!m || !ses.errs[m.ay] || w.dataset.t !== "w") return false;
  const [x, y] = parseVk(w.dataset.vk); if (x !== ses.s.n || y !== m.ay) return false;
  const i = +w.dataset.i, e = errOf(w.dataset.vk), list = ses.ew[y];
  if (list.includes(i)) { ses.ew[y] = list.filter(v => v !== i); e.w[i] = Math.max(0, (e.w[i] || 1) - 1); }
  else { list.push(i); e.w[i] = (e.w[i] || 0) + 1; }
  save(); redraw(); return true;
}
// Revealed verses not marked wrong count as clean recalls
function settleChecks(ays) { ays.forEach(y => { if (ses.shown[y] && !ses.errs[y]) cleanCheck(key(ses.s.n, y)); }); }
const resetMarks = () => { ses.mark = null; ses.errs = ses.errs || {}; ses.ew = ses.ew || {}; };

// ---------- full text (for search and the mistakes book) ----------
let QTEXT = null, QNORM = null, QTEXT_LOADING = null;
function loadText() {
  if (QTEXT) return Promise.resolve(QTEXT);
  return QTEXT_LOADING = QTEXT_LOADING || fetch(DATA_BASE + "quran.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(j => (QTEXT = j)).catch(e => { QTEXT_LOADING = null; throw e; });
}
const vplain = (sn, ay) => QTEXT ? QTEXT[sn - 1][ay - 1] : vtext(sn, ay);
// Arabic folded for search: no diacritics, one form per letter, «صلوة/صلاة» and «إلاه/إله» alike
const arNorm = x => String(x || "").replace(/[ً-ٰٟۖ-ۭـ‌‍]/g, "")
  .replace(/[أإآٱ]/g, "ا").replace(/[ىی]/g, "ي").replace(/ک/g, "ك").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ة/g, "ه")
  .replace(/واه(?=\s|$)/g, "اه").replace(/(\S)ا/g, "$1").replace(/\s+/g, " ").trim();
const faNum = x => String(x).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const findSurah = name => { const n = normFa(name).replace(/^سوره\s+/, "").trim(); if (!n) return null;
  return DATA.surahs.find(s => surahNames(s.n).includes(n) || normFa(s.name) === n) || DATA.surahs.find(s => normFa(s.name).startsWith(n)) || null; };
function searchQuran(q) {
  const out = {ref: [], ar: [], tr: []}, raw = faNum(q.trim());
  if (!raw) return out;
  let m = raw.match(/^(\d{1,3})\s*[:：\/.\-]\s*(\d{1,3})$/);
  if (m && S[+m[1]] && +m[2] >= 1 && +m[2] <= S[+m[1]].total) out.ref.push([+m[1], +m[2]]);
  m = raw.match(/^(.+?)\s*[:：]?\s*(\d{1,3})$/);
  if (m && !/^\d+$/.test(m[1])) { const s = findSurah(m[1]); if (s && +m[2] >= 1 && +m[2] <= s.total) out.ref.push([s.n, +m[2]]); }
  if (!/\d/.test(raw)) { const s = findSurah(raw); if (s && normFa(raw).replace(/^سوره\s+/, "").length >= 2) out.ref.push([s.n, 1]); }
  const nq = arNorm(raw);
  if (QTEXT && nq.replace(/\s/g, "").length >= 2) {
    QNORM = QNORM || QTEXT.map(sv => sv.map(arNorm));
    QNORM.forEach((sv, si) => sv.forEach((v, ai) => { if (v.includes(nq)) out.ar.push([si + 1, ai + 1]); }));
  }
  const tq = normFa(raw).trim(), T = TR[cfg.trans];
  if (T && tq.length >= 2) T.forEach((sv, si) => sv.forEach((v, ai) => { if (normFa(v).includes(tq)) out.tr.push([si + 1, ai + 1]); }));
  return out;
}
// Verse text with the searched words (or the words once read wrong) highlighted
function arHtml(sn, ay, opt = {}) {
  const words = (vplain(sn, ay) || "").split(" "), toks = opt.q ? arNorm(opt.q).split(" ").filter(t => t.length >= 2) : [];
  const e = opt.err ? errOf(key(sn, ay)) : null;
  return words.map((w, i) => { const nw = arNorm(w);
    if (e && e.w[i + 1] > 0) return `<span class="errw">${esc(w)}</span>`;
    return toks.some(t => nw.includes(t) || (t.length > 2 && t.includes(nw) && nw.length > 2)) ? `<mark>${esc(w)}</mark>` : esc(w); }).join(" ");
}
let searchState = {q: "", scope: "all", more: 0};
function openSearch() {
  lastDraw = () => {};
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="جستجو در قرآن">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>جستجو در قرآن</h2></header>
    <div class="body">
      <input type="search" id="sq" value="${esc(searchState.q)}" placeholder="کلمه یا عبارت، یا آیه مثل «بقره ۲۵۵»" aria-label="عبارت جستجو" autocomplete="off">
      <div class="seg" role="group" aria-label="جستجو در">${[["all", "متن و ترجمه"], ["ar", "متن عربی"], ["tr", "ترجمه"]].map(([v, l]) => `<button data-scope="${v}" aria-pressed="${searchState.scope === v}">${l}</button>`).join("")}</div>
      <div id="sres"></div>
    </div></div>`);

}
function drawResults(box) {
  const out = box.querySelector("#sres"); if (!out) return;
  const q = searchState.q.trim();
  if (!q) { out.innerHTML = `<p class="small muted">در متن عربی آیات (بدون نیاز به اعراب) و در ترجمه «${transName()}» جستجو می‌شود. برای رفتن به یک آیه، نام یا شماره سوره و شماره آیه را بنویسید، مثل «بقره ۲۵۵» یا «۲:۲۵۵».</p>`; return; }

  const r = searchQuran(q), sc = searchState.scope;
  const seen = new Set(), list = [];
  const add = (arr, kind) => arr.forEach(([sn, ay]) => { const k = key(sn, ay); if (!seen.has(k)) { seen.add(k); list.push({sn, ay, kind}); } });
  add(r.ref, "ref"); if (sc !== "tr") add(r.ar, "ar"); if (sc !== "ar") add(r.tr, "tr");
  const nAr = sc !== "tr" ? r.ar.length : 0, nTr = sc !== "ar" ? r.tr.length : 0, lim = 40 + searchState.more;
  const trWait = sc !== "ar" && cfg.trans !== "none" && !TR[cfg.trans];
  out.innerHTML = `<p class="small muted">${[sc !== "tr" ? `${FA(nAr)} آیه در متن عربی` : "", sc !== "ar" ? (cfg.trans === "none" ? "ترجمه خاموش است" : trWait ? "ترجمه در حال بارگیری…" : `${FA(nTr)} آیه در ترجمه ${transName()}`) : ""].filter(Boolean).join(" · ")}</p>
    ${list.length ? list.slice(0, lim).map(x => { const k = key(x.sn, x.ay), sq = siyaqOf(x.sn, x.ay), tx = trans(x.sn, x.ay);
      return `<div class="sres"><div class="row between"><b>${x.kind === "ref" ? "↵ " : ""}سوره ${S[x.sn].name} · آیه ${FA(x.ay)}</b><span class="small muted">${sq ? "سیاق " + FA(sq.n) : ""}${errOf(k) ? ` · <span style="color:var(--st-due)">${FA(errOf(k).n)} اشتباه</span>` : ""}</span></div>
        <div class="ar">${arHtml(x.sn, x.ay, {q: x.kind === "ar" ? q : ""})}</div>
        ${tx ? `<p class="small">${esc(tx)}</p>` : ""}
        <div class="row"><button class="small" data-sgo="${k}">در مصحف</button><button class="small" data-splay="${k}" aria-label="ترتیل آیه">▶</button><button class="small" data-tafsir="${k}">📖</button>${sq ? `<button class="small" data-ssiyaq="${x.sn}:${sq.n}">سیاق</button>` : ""}</div></div>`; }).join("")
      + (list.length > lim ? `<button id="smore">نمایش بیشتر (${FA(list.length - lim)} آیه دیگر)</button>` : "")
      : `<p class="small">چیزی پیدا نشد.${trWait ? " ترجمه هنوز بارگیری نشده؛ چند لحظه بعد دوباره امتحان کنید." : ""}</p>`}`;
  out.querySelectorAll("[data-sgo]").forEach(b => b.addEventListener("click", () => { const [sn, ay] = parseVk(b.dataset.sgo); goVerse(sn, ay); }));
  out.querySelectorAll("[data-splay]").forEach(b => b.addEventListener("click", () => { const [sn, ay] = parseVk(b.dataset.splay); play(sn, ay); }));
  out.querySelectorAll("[data-ssiyaq]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.ssiyaq; startSession(k, ["solid", "due"].includes(status(k)) ? "review" : "learn"); }));
  const mo = out.querySelector("#smore"); if (mo) mo.addEventListener("click", () => { searchState.more += 40; drawResults(box); });
}
// Open the mushaf on a verse and select it

// ---------- the mistakes book ----------

  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="دفتر اشتباهات">

    <div class="body">
    ${all.length ? `<div class="stats">

      <div class="stat"><b class="num" style="color:var(--st-solid)">${FA(fixed.length)}</b><span class="small muted">تثبیت‌شده</span></div>
      <div class="stat"><b class="num">${FA(all.reduce((a, x) => a + x.e.n, 0))}</b><span class="small muted">کل اشتباه‌ها</span></div></div>

// Consolidation drill: the verse before stays visible as the cue, the weak verse is recited from memory
let drill = null;
function openDrill(list, i, phase) {
  if (!list.length) return openWeak();
  const was = drill && drill.list === list ? drill : null;
  drill = {list, i, phase: phase || "ask", ok: was ? was.ok : 0, msg: was && was.i === i ? was.msg : ""};
  lastDraw = () => openDrill(list, i, drill.phase);
  const vk = list[i], [sn, ay] = parseVk(vk), s = S[sn], q = siyaqOf(sn, ay), e = errOf(vk) || {t: {}, w: {}, n: 0};
  const g = q ? stepsOf(s, q).find(x => ay >= x.s && ay <= x.e) : null, prev = q && ay > q.s ? ay - 1 : (ay > 1 ? ay - 1 : ay);
  const shown = drill.phase !== "ask";
  const inR = v => { const [x, y] = parseVk(v); return x === sn && y >= prev && y <= ay; };
  const pages = renderPages(pagesFor(sn, prev, ay), {only: inR, weak: shown, state: v => { const [x, y] = parseVk(v); if (x !== sn || y < prev || y > ay) return "dim"; return y < ay || shown ? "show" : "mask"; }});
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="تمرین تثبیت">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>تمرین تثبیت · ${FA(i + 1)} از ${FA(list.length)}</h2></header>
    <div class="body">
      <div class="meaning"><span class="small muted">سوره ${s.name} · آیه ${FA(ay)}${q ? " · سیاق " + FA(q.n) : ""}</span>${q ? `<b>${esc(title(s, q))}</b>` : ""}${g && g.t ? `<span class="small">گام: ${esc(g.t)}</span>` : ""}</div>
      <p class="small">${prev < ay ? "آیه قبل پیدا است. آیه بعد از آن را از حفظ بخوانید، بعد «نشانم بده» را بزنید." : "این آیه را از حفظ بخوانید، بعد «نشانم بده» را بزنید."} قبلاً: ${Object.entries(e.t).filter(([, n]) => n).map(([t]) => errName(t)).join("، ") || "—"}.</p>
      <div id="dpages">${pages}</div>
      ${drill.phase === "type" ? `<div class="card"><h3>چه اشتباهی بود؟</h3><div class="chips">${ERR_TYPES.map(([k, l]) => `<button class="small" data-dt="${k}">${l}</button>`).join("")}</div></div>` : ""}
      ${drill.phase === "done" ? `<div class="card"><p class="small">${drill.msg}</p></div>` : ""}
    </div>
    <footer>${drill.phase === "ask" ? `<button id="dhear">▶ شنیدن آیه قبل</button><button class="btn-main" id="dshow">نشانم بده</button>`
      : drill.phase === "show" ? `<button id="dbad">✗ اشتباه داشتم</button><button class="btn-main" id="dok">✓ درست خواندم</button>`
      : drill.phase === "type" ? `<button id="dback">برگشت</button>`
      : `<button id="dplay">▶ شنیدن آیه</button><button class="btn-main" id="dnext">${i < list.length - 1 ? "آیه بعد" : "پایان تمرین"}</button>`}</footer></div>`, () => { drill = null; openWeak(); });
  fitPages(box);
  const on = (sel, f) => { const el = box.querySelector(sel); if (el) el.addEventListener("click", f); };
  const re = ph => openDrill(list, i, ph);
  on("#dhear", () => play(sn, prev));
  on("#dshow", () => re("show"));
  on("#dbad", () => re("type"));
  on("#dback", () => re("show"));
  on("#dok", () => { const c = cleanCheck(vk), ee = errOf(vk); drill.ok++;
    drill.msg = !ee ? "درست بود." : !c ? (ee.last === today() ? "درست بود. چون امروز در این آیه اشتباه ثبت شده، این بار در شمارش تثبیت حساب نمی‌شود؛ فردا دوباره تمرین کنید." : "درست بود. امروز یک بار برای این آیه حساب شده؛ تمرین بعدی را فردا انجام دهید.")
      : ee.clean >= CLEAN_NEED ? "✓ این آیه تثبیت شد." : `درست بود. ${FA(ee.clean)} از ${FA(CLEAN_NEED)} بار برای تثبیت.`;
    re("done"); });
  box.querySelectorAll("[data-dt]").forEach(b => b.addEventListener("click", () => { addErr(vk, b.dataset.dt); drill.msg = "اشتباه ثبت شد. آیه را چند بار بشنوید و دوباره بخوانید؛ فردا هم تمرینش کنید."; re("done"); }));
  on("#dplay", () => play(sn, ay, cfg.reps));
  on("#dnext", () => { stopAudio(); if (i < list.length - 1) openDrill(list, i + 1); else { toast(`${nameComma()}تمرین تمام شد · ${FA(drill.ok)} از ${FA(list.length)} درست`); drill = null; openWeak(); } });
  if (!QTEXT) loadText().catch(() => {});
}

// ---------- IndexedDB key-value store (large offline data: tafsir, word meanings, recordings) ----------
const IDB = (() => {
  let dbp = null;
  const open = () => dbp = dbp || new Promise((res, rej) => {
    const r = indexedDB.open("tadabbor", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error); };
  });
  const run = (mode, f) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction("kv", mode), q = f(t.objectStore("kv"));
    t.oncomplete = () => res(q && "result" in q ? q.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    get: k => run("readonly", s => s.get(k)).catch(() => undefined),
    set: (k, v) => run("readwrite", s => s.put(v, k)).catch(() => undefined),
    del: k => run("readwrite", s => s.delete(k)).catch(() => undefined),
    keys: p => run("readonly", s => s.getAllKeys(IDBKeyRange.bound(p, p + "￿"))).catch(() => []),
    delPrefix: p => run("readwrite", s => s.delete(IDBKeyRange.bound(p, p + "￿"))).catch(() => undefined)
  };
})();
