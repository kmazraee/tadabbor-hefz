plugins {
    id "com.android.application"
}

android {
    namespace "ir.tadabbor.hefz"
    compileSdk 34

    defaultConfig {
        applicationId "ir.tadabbor.hefz"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // keep woff2 fonts uncompressed-safe and readable from assets
    androidResources {
        noCompress += ["woff2"]
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
