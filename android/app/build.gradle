plugins {
    id "com.android.application"
}

// Release signing comes from CI secrets (never commit the keystore):
//   SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
def signingFile = System.getenv("SIGNING_STORE_FILE")
def canSign = signingFile != null && new File(signingFile).exists()

android {
    namespace "ir.tadabbor.hefz"
    compileSdk 34

    defaultConfig {
        applicationId "ir.tadabbor.hefz"
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "0.6.1"
    }

    signingConfigs {
        if (canSign) {
            release {
                storeFile file(signingFile)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSign) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ["woff2"]
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
