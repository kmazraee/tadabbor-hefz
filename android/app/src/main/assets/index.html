/* Layout: one phone-width column, bottom tab bar, full-screen sheets; Quran always shown as Madinah mushaf pages */
:root{
  --acc-l:#1F4E79; --acc-d:#7FB0E3; --accs-l:#E3ECF5; --accs-d:#1B2C3D;
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5E6E68; --line:#DCE3E0;
  --page:#FFFDF7; --page-edge:#E6DDC6;
  --lapis:var(--acc-l); --lapis-soft:var(--accs-l); --on-lapis:#FFFFFF;
  --gold:#A8711A; --gold-soft:#F6EBD6;
  --st-new:#C9D1CE; --st-learn:#3A78C2; --st-solid:#2E8B57; --st-due:#D9822B;
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-q:"Amiri Quran","Amiri","Scheherazade New",serif;
  --q-lh:1.9;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="sepia"]){
  --paper:#0F1715; --surface:#17221F; --ink:#E7EEEB; --muted:#93A39D; --line:#2A3834;
  --page:#141D1A; --page-edge:#2A3834;
  --lapis:var(--acc-d); --lapis-soft:var(--accs-d); --on-lapis:#0F1715;
  --gold:#E0B25E; --gold-soft:#33291A;
  --st-new:#3A4743; --st-learn:#5B98DD; --st-solid:#4DB37A; --st-due:#E89A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1715; --surface:#17221F; --ink:#E7EEEB; --muted:#93A39D; --line:#2A3834;
  --page:#141D1A; --page-edge:#2A3834;
  --lapis:var(--acc-d); --lapis-soft:var(--accs-d); --on-lapis:#0F1715;
  --gold:#E0B25E; --gold-soft:#33291A;
  --st-new:#3A4743; --st-learn:#5B98DD; --st-solid:#4DB37A; --st-due:#E89A4A; color-scheme:dark}
:root[data-theme="sepia"]{
  --paper:#EFE5CD; --surface:#FBF5E7; --ink:#3A2E1F; --muted:#76664F; --line:#E0D3B6;
  --page:#FBF3DF; --page-edge:#D9C9A3;
  --gold:#9A6516; --gold-soft:#EEDDB8; --st-new:#D6CBB2}
:root[data-accent="green"]{--acc-l:#2F6B4F; --acc-d:#7CC4A0; --accs-l:#E2EFE8; --accs-d:#18302A}
:root[data-accent="teal"]{--acc-l:#0F6E73; --acc-d:#6CC9CC; --accs-l:#DDF0F0; --accs-d:#14302F}
:root[data-accent="maroon"]{--acc-l:#7A2E3B; --acc-d:#E39AA6; --accs-l:#F4E3E6; --accs-d:#33191E}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:15px;line-height:1.7}
.app{max-width:480px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;padding-block:16px 96px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--lapis)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{background:var(--lapis);color:var(--on-lapis);border:none}
.hero .muted{color:inherit;opacity:.8}
.hero .q{font-family:"Amiri Quran",var(--f-q);font-size:22px;line-height:2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-main{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.hero .btn-main{background:var(--on-lapis);color:var(--lapis);border-color:var(--on-lapis)}
.btn-ghost{background:transparent}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;flex:none}
.icon-btn svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--st-solid)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
.siyaq-strip{display:flex;gap:3px}
.siyaq-strip span{height:10px;border-radius:3px;background:var(--c)}
.siyaq-strip span.fstart{margin-inline-start:5px}
.fasl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding:6px 2px;border-top:2px solid var(--line)}
.fasl-head b{font-size:15px;color:var(--lapis)}
.fasl-head .fdesc{flex-basis:100%;color:var(--ink)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd{display:flex;flex-direction:column;gap:8px}
.dlrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dlrow:last-child{border-bottom:none}
.dlrow .bar{grid-column:1/-1}
.ok{color:var(--st-solid);font-weight:700}
.fasl-head.nested{border-top-style:dashed;margin-inline-start:14px}
.siyaq-item.nested{margin-inline-start:14px;width:calc(100% - 14px)}
.siyaq-strip span.cur{outline:2px solid var(--gold);outline-offset:1px}
.surah-row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;border-radius:0;text-align:right;width:100%}
.surah-row .idx{font-size:12px;color:var(--muted);text-align:center}
.surah-row .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:none;border-radius:0;background:none;padding:9px 2px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-current="page"]{color:var(--lapis);font-weight:700}
.tabs svg{width:22px;height:22px}
.topbar{display:flex;flex-direction:column;gap:8px}
.counters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.chip{font-size:12.5px;padding:2px 10px 2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.mem{--c:var(--st-solid)} .chip.tad{--c:var(--lapis)}
.chip b{font-size:14px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--lapis-soft);color:var(--ink)}
.tag-test{background:var(--gold-soft);color:var(--ink);font-size:12px;padding:6px 10px;border-radius:10px}
.siyaq-item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;width:100%}
.siyaq-item .stripe{align-self:stretch;border-radius:4px;background:var(--c)}
.mine{font-size:12px;color:var(--lapis)}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--paper);z-index:10;display:flex;flex-direction:column;max-width:480px;margin-inline:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{flex:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 16px 0}
.steps span{height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--gold)}
.steplabels{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 16px 0;font-size:11px;color:var(--muted);text-align:center}
.steplabels .on{color:var(--ink);font-weight:700}
.sheet .body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet .body > *,main > *{flex-shrink:0}
.sheet footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:10px}
.sheet footer button{flex:1}
.subnav{display:flex;gap:6px}
.subnav span{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:8px;background:var(--line);color:var(--muted)}
.subnav span.on{background:var(--lapis-soft);color:var(--ink);font-weight:700}
.help{background:var(--lapis-soft);border-radius:12px;padding:12px 14px;font-size:13px}
.meaning{background:var(--lapis-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.meaning b{font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;font-size:13px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;gap:2px;padding:12px 6px}
.rate small{color:var(--muted);font-size:12px}
select,input[type=text],textarea{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
textarea{resize:vertical}
label{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:12px}
.swatch{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold)}
input[type=range]{width:100%;accent-color:var(--lapis)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--lapis);flex:none}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
details summary::after{content:"+";float:left;color:var(--muted)}
details[open] summary::after{content:"−"}
details > div{padding-bottom:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details ol,details ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;bottom:84px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30}
.mw.weak{text-decoration:underline dotted var(--st-due);text-decoration-thickness:2px;text-underline-offset:6px}
.mw.errw{background:color-mix(in srgb,var(--st-due) 28%,transparent)}
.markbar{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--gold-soft)}
.markbar>span{flex:1 1 100%}
.sheet footer .markbar button{flex:0 0 auto;padding:7px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.ar{font-family:"Amiri Quran","Amiri",serif;font-size:21px;line-height:2.2;direction:rtl}
.ar mark,.ar .errw{background:color-mix(in srgb,var(--st-due) 30%,transparent);color:inherit;border-radius:4px}
.ar mark{background:var(--gold-soft)}
.sres{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px solid var(--line)}
.sres:last-child{border-bottom:none}
.tbar{display:flex;align-items:center;gap:8px;font-size:13px}
.tbar>span:first-child{flex:0 0 132px}
.tbar .bar{flex:1;margin:0}
.books{display:flex;flex-direction:column;gap:8px}
.book{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.book b{font-size:14px;font-weight:700}
.bk-ic{font-size:20px}
.bk-buy{color:var(--lapis);font-weight:700;white-space:nowrap}
.about{gap:14px}
.about-head{display:flex;gap:14px;align-items:center}
.about-logo svg{width:72px;height:72px;display:block;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.about-head h2{font-size:20px}
.about-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.about-row{display:grid;grid-template-columns:30px 64px 1fr;gap:8px;align-items:center;padding:9px 12px}
.about-row+.about-row{border-top:1px solid var(--line)}
.about-ic{font-size:17px;text-align:center}
.about-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnlink{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px}
.about-foot{text-align:center}
.about-actions>:last-child:nth-child(odd){grid-column:1/-1}
.contact-row{display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.contact-title{font-weight:700;font-size:14px}
.contact-ch{display:flex;gap:28px;justify-content:center}
.ch{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted)}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.contact{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
.contact-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.contact-ic svg{width:20px;height:20px}
.player{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.pl-main{display:flex;align-items:center;gap:6px}
.pl-btn{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.pl-btn svg{width:20px;height:20px}
.pl-play{width:48px;height:48px;background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.pl-play svg{width:24px;height:24px}
.pl-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.pl-info b,.pl-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-set{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.pl-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-set .seg{display:grid;grid-template-columns:repeat(5,1fr)}
.pl-set .seg button{padding:7px 2px;font-size:13px}
.me.fav{color:var(--gold)!important;text-shadow:0 0 1px var(--gold)}
.fav-star{color:var(--gold);font-size:18px}
.uv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.uv.got{border-color:var(--st-solid)}
.wbw{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.wb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:10px;background:var(--paper);border:1px solid var(--line);min-width:52px}
.wb.on{border-color:var(--lapis);background:var(--lapis-soft)}
.wb.mine{box-shadow:inset 0 -3px 0 var(--gold)}
.wb-ar{font-size:22px;line-height:1.7}
.wb-fa{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;max-width:120px}
.wsel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--gold-soft)}
.wsel .ar{font-size:24px}
.uv-tr{font-size:14px;margin:0}
.uv-ok{border-top:1px dashed var(--line);padding-top:6px}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:none}
.vrow-ar{font-size:24px}
.flash{align-items:center;text-align:center;gap:12px;padding:28px 16px}
.flash-ar{font-size:44px}
.flash-fa{font-size:22px;font-weight:700;color:var(--lapis)}
.stepper{display:flex;gap:2px;position:relative;padding-top:2px}
.stepper::before{content:"";position:absolute;inset-inline:7%;top:19px;height:2px;background:var(--line)}
.step{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;position:relative;color:var(--ink);text-align:center}
.step:focus-visible i{outline:2px solid var(--lapis);outline-offset:2px}
.step i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:14px;font-weight:800}
.step.done i{background:var(--st-solid);border-color:var(--st-solid);color:#fff}
.step.cur i{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px var(--gold-soft)}
.step.cur span{font-weight:800}
.step.lock{color:var(--muted)}
.ic-lock{width:15px;height:15px;vertical-align:-2px}
.siyaq-item.locked{opacity:.7}
.ok-pill{background:var(--st-solid);color:#fff}
.cur-pill{background:var(--gold);color:#fff}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800}
.checks li.ok i{background:var(--st-solid);border-color:var(--st-solid);color:#fff}
.okcard{border-color:var(--st-solid)}
.lockcard{align-items:center;text-align:center}
.lockicon .ic-lock{width:36px;height:36px;color:var(--muted)}
.linkbtn{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--lapis);color:var(--on-lapis);text-decoration:none;font-weight:700;font-size:14px}
.startnote{border:2px dashed var(--gold)}
.wform{display:flex;flex-direction:column;gap:8px}
.wform label{font-weight:700;font-size:14px}
.wform input{background:var(--surface);color:var(--ink);border:none;border-radius:12px;padding:12px 14px;font-size:16px}
.wform button{margin-top:8px}
.werr{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-size:14px}
.intro{position:fixed;inset:0;z-index:40;background:var(--lapis);color:var(--on-lapis);display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:20px;max-width:480px;margin-inline:auto}
.intro h1{font-size:26px}
.intro p{font-size:16px;opacity:.9}
.intro .dots{display:flex;gap:6px}
.intro .dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.intro .dots i.on{opacity:1}
.intro button{background:var(--on-lapis);color:var(--lapis);border:none;font-weight:700}
.intro .skip{background:transparent;color:inherit;opacity:.8}
footer.note{font-size:12px;color:var(--muted);text-align:center}

/* ---- Madinah mushaf page ---- */
.mpage{background:var(--page);border:1px solid var(--page-edge);border-radius:6px;padding:10px 8px 6px;box-shadow:inset 0 0 0 4px var(--page),inset 0 0 0 5px var(--page-edge);color:var(--ink);overflow:hidden}
.mrow{display:grid;grid-template-columns:5px minmax(0,1fr);gap:5px;align-items:stretch}
.mmark{display:flex;flex-direction:column;border-radius:3px;overflow:hidden}
.mmark i{flex:1;background:var(--c)}
.mline{min-width:0;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;direction:rtl;line-height:var(--q-lh);min-height:1.2em}
.mline.center{justify-content:center}
.mline.txt{column-gap:.22em;font-family:var(--f-q)}
.mw,.me{cursor:pointer;border-radius:4px;transition:opacity .15s}
.mw.dim,.me.dim{opacity:.28}
.mw.mask,.me.mask{color:transparent!important;background:var(--line)}
.mw.peek{color:inherit!important;background:var(--gold-soft)}
.mw.sel,.me.sel{background:var(--gold-soft)}
.mw.playing,.me.playing{background:var(--lapis-soft)}
.me.cut{background:var(--gold);color:#fff}
.mhead{border:1px solid var(--page-edge);border-radius:6px;padding:0 1em;background:var(--surface)}
.mhead.txt{font-family:var(--f-ui);font-weight:700;font-size:.62em;padding:.15em 1.4em}
.mfoot{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-ui);margin-top:4px}
.mlabel{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--lapis);display:flex;align-items:center;gap:6px;margin:4px 0 0}
.mlabel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lapis)}
.mnav{display:flex;align-items:center;gap:8px}
.mnav .pg{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.wordbar{position:fixed;inset-inline:0;bottom:64px;max-width:480px;margin-inline:auto;padding:0 12px;z-index:6}
.wordbar .card{box-shadow:0 6px 24px rgba(0,0,0,.18);gap:8px}
/* lessons */
.tr{margin:0;font-size:14.5px;line-height:1.9}
.lesson{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lesson audio{width:100%}
.vframe{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

بهشت شد؛ اینک همه ما در دار آزمایش هستیم تا در قبال هدایت الهی موضع خود را مشخص کنیم؛ کفر یا ایمان؟!"]},{"n":7,"s":40,"e":46,"title":"دعوت بنی‌اسرائیل به ایمان به قرآن کریم و پیامبر اسلام صلی‌الله‌علیه‌وآله‌وسلم و پرهیز از کفر","steps":[],"f":2,"sum":["ای بنی‌اسرائیل از شما توقع می‌رود اولین مؤمنان به پیامبر صلی‌الله‌علیه‌وآله‌وسلم و قرآن باشید، حال چرا اولین کافران به اسلام شده‌اید؟"]},{"n":8,"s":47,"e":62,"title":"یادآوری نعمت تفضیل به بنی‌اسرائیل (در فاصله تاریخی نجات از فرعون تا بازگشت به مصر که با ظلم و ناشکری یعنی گوساله پرستی و دنیاگرایی آنان ختم به ذلت و مسکنت شد)؛ و دعوت ایشان به تقوا از روز قیامت (در عصر حاضر)","steps":[],"f":2,"sum":["خدا هم ولی نعمت شماست و هم تنها یاور شما در قیامت پس چرا از ایمان به کتاب او سر باز می‌زنید؟!"]},{"n":9,"s":63,"e":66,"title":"روی گردانی بنی‌اسرائیل از میثاق مؤکد الهی بر اخذ با قوت و ذکر کتاب آسمانی","steps":[],"f":2,"sum":["اگر فضل و رحمت خدا نبود این روی گردانی خسارتی بزرگ را برای ایشان به بار می‌آورد"]},{"n":10,"s":67,"e":74,"title":"لجاجت بنی‌اسرائیل در جریان ذبح بقره نشانی از حب عجل (حب دنیای) ایشان که به قساوت قلبشان انجامید","steps":[],"f":2,"sum":["با اینکه خدا در ماجرای عجل قدرت خود بر معاد را نشان داد اما دنیاگرایی بنی‌اسرائیل سرانجام ایشان را به قساوت رساند"]},{"n":11,"s":75,"e":82,"title":"با وجود محرفانی که دانسته و خدعه گرانه تورات را تحریف می‌کنند و ناآگاهانی که با چشم و گوش بسته از آنان پیروی می‌کنند، دیگر امیدی به ایمان بنی‌اسرائیل به قرآن نیست","steps":[],"f":3,"sum":["وای بر این محرفان از آنچه می‌نویسند و وای بر آنان از آنچه بدان کسب می‌کنند؛ بی تردید اعتقاد ایشان به عذاب نشدن بی پایه و اساس است و قانون جزای الهی استثناء ندارد"]},{"n":12,"s":83,"e":86,"title":"عدم پایبندی بنی‌اسرائیل به میثاق الهی کتاب آسمانی خودشان، به خاطر حب دنیا و ترجیح آن بر آخرت","steps":[],"f":3,"sum":["بنی‌اسرائیل در دوران معاصر قرآن برخلاف میثاق کتاب آسمانی خود به گروه‌هایی از خودشان ظلم می‌کنند و این به خاطر دنیاگرایی ایشان است"]},{"n":13,"s":87,"e":91,"title":"مقاومت معاندانه بنی‌اسرائیل در برابر ایمان به قرآن به رغم علم به حقانیت آن و در ادامه سیره استکبار و تکذیب و قتل انبیاء در طول تاریخ","steps":[],"f":3,"sum":["بنی‌اسرائیل دعوت ایمان به قرآن را رد می‌کنند در حالی که مدعی ایمان به کتابهای آسمانی خود هستند ولی واقعیت این است که رفتار ایشان در طول تاریخ و امروز نشان داده که حتی به کتابهای خود نیز ایمان ندارند."]},{"n":14,"s":92,"e":98,"title":"حب عجل (دنیاگرایی) و خیال آسوده از عذاب و دشمنی با جبرئیل علیه‌السلام عوامل مقاومت معاندانه بنی‌اسرائیل در برابر ایمان به پیامبر اسلام صلی‌الله‌علیه‌وآله‌وسلم و قرآن","steps":[],"f":3,"sum":["بنی‌اسرائیل گوشی برای شنیدن دعوت ایمان به پیامبر اسلام صلی‌الله‌علیه‌وآله‌وسلم و قرآن ندارند چون دل در گرو دنیا دارند و از بابت عذاب قیامت خیال خود را آسوده کرده‌اند و با فرشته وحیی که آیات عذاب را بیاورد دشمنی دارند"]},{"n":15,"s":99,"e":103,"title":"جلوه کفر فاسقانه بنی‌اسرائیل به قرآن و پیامبر صلی‌الله‌علیه‌وآله‌وسلم، در پشت سر انداختن کتاب آسمانی و تبعیت از بافته‌های شیاطین","steps":[],"f":3,"sum":["بنی‌اسرائیل طبق سیره بدعهدی تاریخی خود فاسقانه به قرآن و پیامبر کفر می‌ورزند و در مقابل رسولی که به حقانیتش یقین دارند، کتاب خدا را وامی‌نهند و از تلاوت شیاطین بر ملک سلیمان علیه‌السلام پیروی می‌کنند"]},{"n":16,"s":104,"e":110,"title":"فرهنگ سازی الهی برای مؤمنان به منظور جلوگیری از اثرپذیری ایشان از بنی‌اسرائیل در مواجهه با پیامبر صلی‌الله‌علیه‌وآله‌وسلم (در جریان نسخ آیه ای مهم)","steps":[],"f":4,"sum":["اهل کتاب هیچ تمایلی درباره رسیدن خیر به شما ندارند و دوست دارند شما را از طریق مقابله با رسولتان به کفر بکشانند، فعلا زمان جنگ با ایشان نیست، ولی در خصوص تأثیرپذیری از ایشان مراقب باشید"]},{"n":17,"s":111,"e":113,"title":"پاسخ خدا به این شبهه که راه انحصاری ورود به بهشت، یهودی یا نصرانی بودن است","steps":[],"f":4,"sum":["تنها راه ورود به بهشت، اسلام است و شاهد کذب ادعای مذکور، اختلاف شدید یهود و نصاری است تا جایی که یکدیگر را قبول ندارند"]},{"n":18,"s":114,"e":117,"title":"دفع دخل مقدر درباره رو کردن مسلمانان به خانه خدا که ظاهرش آلوده به لوث شرک است","steps":[],"f":4,"sum":["این مشرکان هستند که حق حضور امن در خانه خدا را ندارند و خدا مالک مطلق شرق و غرب است و خانه خود را مورد توجه مسلمانان قرار می‌دهد"]},{"n":19,"s":118,"e":121,"title":"نفی توقع بی‌جای ناآگاهان جامعه اسلامی از رسول خدا صلی‌الله‌علیه‌وآله‌وسلم در راستای روی‌گردانی از رو کردن به خانه خدا و هماهنگ کردن آن حضرت با یهود و نصاری","steps":[],"f":4,"sum":["این توقع که خدا با ایشان سخن بگوید و یا آیه ای ویژه برای ایشان بفرستند، بی‌جا است و پیامبر صلی‌الله‌علیه‌وآله‌وسلم در برابر چنین نادانهای جهنمی مسئولیتی ندارد و بی تردید یهود و نصارای جز با تبعیت کامل پیامبر صلی‌الله‌علیه‌وآله‌وسلم از خودشان راضی نمی‌شوند"]},{"n":20,"s":122,"e":123,"title":"یادآوری نعمت تفضیل به بنی‌اسرائیل در راستای دعوت ایشان به تقوا درباره قیامت","steps":[],"f":4,"sum":["ای بنی‌اسرائیل به یاد آورید که شما را بر جهانیان برتری بخشیدیم و درباره قیامت تقوا پیشه کنید"]},{"n":21,"s":124,"e":129,"title":"از امامت توحیدی ابراهیم علیه‌السلام تا شکل گیری امت مسلمان و بعثت رسول اکرم صلی‌الله‌علیه‌وآله‌وسلم","steps":[],"f":5,"sum":["امامت ابراهیم علیه‌السلام و ذریه غیر ظالم او به جعل الهی","لزوم اقتدا به ابراهیم علیه‌السلام در قالب نماز و با محوریت خانه خدا","دعای مستجاب ابراهیم علیه‌السلام برای امنیت و رزق شهر خانه خدا","دعای مستجاب ابراهیم و اسماعیل علیه‌السلام برای شکل گیری امت مسلمان و بعثت رسول اکرم صلی‌الله‌علیه‌وآله‌وسلم"]},{"n":22,"s":130,"e":141,"title":"تطبیق ملت ابراهیم علیه‌السلام بر اسلام و ممانعت از مصادره ملت ابراهیم علیه‌السلام توسط یهود و نصاری","steps":[],"f":5,"sum":["ملت ابراهیم علیه‌السلام اسلام است که سفارش او و یعقوب علیه‌السلام بود و روی گردانی از این ملت، سفاهت است. یهودیت و نصرانیت خالی از حقیقت اسلام، مصداق ملت ابراهیم علیه‌السلام نیست؛ بلکه ایمان به خدا و همه کتب آسمانی و همه انبیاء، حقیقت اسلام است."]},{"n":23,"s":142,"e":152,"title":"تغییر و تثبیت قبله به عنوان شاخص شکل گیری امت معیار به رسالت پیامبر اکرم صلی‌الله‌علیه‌وآله‌وسلم","steps":[],"f":5,"sum":["به رغم تلاش اهل کتاب برای ایجاد شبهه در فرایند تغییر قبله"]},{"n":24,"s":153,"e":157,"title":"دعوت مؤمنان به صبر درباره کشتگان در راه خدا در فضای ناامنی ناشی از تغییر قبله","steps":[],"f":5,"sum":["با استعانت از صبر و /* Render mushaf pages.
   opt.state(vk) -> "show" | "dim" | "mask" | "hidden-line"
   opt.wordMask(vk, pos) -> true to mask one word
   opt.only(vk) -> line is shown only if it holds a verse where only() is true

function renderPages(pnums, opt = {}) {
  const st8 = opt.state || (() => "show");
  return pnums.map(pn => {
    const pg = getPage(pn);
    if (!pg) return `<div class="mpage" style="min-height:40vh;display:grid;place-items:center"><span class="small muted">در حال بارگیری صفحه ${FA(pn)}…</span></div>`;
    const qcf = ensureFonts(pageFonts(pg));
    const out = [];
    let curSura = null;
    pg.lines.forEach((ln, li) => {
      const vks = ln.filter(w => w[0] === "w" || w[0] === "e").map(w => w[3]);
      if (ln[0] && (ln[0][0] === "h" || ln[0][0] === "b")) curSura = +ln[0][3];
      if (opt.only) {
        const keep = vks.length ? vks.some(opt.only) : (curSura && opt.onlySura === curSura && opt.showHead);
        if (!keep) return;
      }
      const labels = opt.labels ? [...new Set(vks)].filter(v => opt.labels[v] && ln.find(w => w[3] === v) === ln.find(w => w[3] === v && w[0] === "w") && firstWordLine(pg, v) === li).map(v => `<div class="mlabel">${esc(opt.labels[v])}</div>`).join("") : "";
      let pos = {};
      const words = ln.map(w => {
        const [t, ch, font, ref, text] = w;
        if (t === "h") return qcf ? `<span class="mhead" style="font-family:'${font}'">${ch}</span>` : `<span class="mhead txt">سوره ${esc(S[+ref] ? S[+ref].name : text)}</span>`;
        if (t === "b") return qcf ? `<span style="font-family:'${font}'">${ch}</span>` : `<span style="font-family:var(--f-q)">${esc(text || "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ")}</span>`;
        const vk = ref, s8 = st8(vk);
        pos[vk] = (pos[vk] || 0) + (t === "w" ? 1 : 0);
        let cls = t === "e" ? "me" : "mw";
        if (s8 === "dim") cls += " dim";
        if (t === "w" && (s8 === "mask" || (opt.wordMask && opt.wordMask(vk, pos[vk])))) cls += " mask";
        if (t === "e" && opt.cut && opt.cut.has(vk)) cls += " cut";
        if (t === "e" && opt.marks && (st.fav || {})[vk]) cls += " fav";
        if (opt.weak && t === "w" && !cls.includes("mask")) { const er = errOf(vk); if (er && errOpen(vk)) cls += " weak"; if (er && er.w[pos[vk]] > 0) cls += " errw"; }
        if (playingVk === vk) cls += " playing";
        const glyph = qcf ? ch : (t === "e" ? `﴿${AR(parseVk(vk)[1])}﴾` : esc(text));
        const style = qcf ? ` style="font-family:'${font}'"` : "";
        return `<span class="${cls}" data-vk="${vk}" data-t="${t}"${t === "w" ? ` data-i="${pos[vk]}"` : ""}${style}>${glyph}</span>`;
      }).join("");
      const center = ln.length === 1 && (ln[0][0] === "h" || ln[0][0] === "b");
      const sy = opt.marks ? [...new Set(vks.map(v => { const [a, b] = parseVk(v); const q = siyaqOf(a, b); return q ? key(a, q.n) : null; }).filter(Boolean))] : [];
      const mark = opt.marks ? `<span class="mmark">${sy.map(k => `<i style="--c:${COLORS[status(k)]}"></i>`).join("")}</span>` : "<span></span>";
      out.push(`${labels}<div class="mrow">${mark}<div class="mline${center ? " center" : ""}${qcf ? "" : " txt"}">${words}</div></div>`);
    });
    return `<div class="mpage" data-p="${pn}">${out.join("")}<div class="mfoot num">${FA(pg.p)}</div></div>`;
  }).join("");
}
function firstWordLine(pg, vk) { return pg.lines.findIndex(l => l.some(w => w[3] === vk && w[0] === "w")); }

// Fit every page line to the page width (the mushaf is a fixed 15-line layout)
function fitPages(root) {
  (root || document).querySelectorAll(".mpage").forEach(p => {
    const lines = [...p.querySelectorAll(".mline:not(.center)")];
    if (!lines.length) return;
    const base = 20; p.style.fontSize = base + "px";
    const avail = lines[0].clientWidth;
    let maxW = 0;
    lines.forEach(l => {
      const kids = [...l.children]; if (!kids.length) return;
      const gap = parseFloat(getComputedStyle(l).columnGap) || 0;
      const w = kids.reduce((a, c) => a + c.getBoundingClientRect().width, 0) + gap * (kids.length - 1);
      maxW = Math.max(maxW, w);
    });
    if (maxW > 0 && avail > 0) p.style.fontSize = Math.min(base * avail / maxW * 0.97, 44) + "px";

// ---------- mushaf player: play on from a verse to the end of the page, siyaq, fasl, surah or the whole Quran ----------
const MP_ENDS = [["page", "صفحه"], ["siyaq", "سیاق"], ["fasl", "فصل"], ["surah", "سوره"], ["quran", "قرآن"]];
const MP_REPS = [1, 2, 3, 4, 5, 7, 10, 20, 0];     // 0 = endless
const repName = n => n ? FA(n) + " بار" : "بی‌نهایت";
const nextV = (sn, ay) => ay < S[sn].total ? [sn, ay + 1] : sn < 114 ? [sn + 1, 1] : null;
const prevV = (sn, ay) => ay > 1 ? [sn, ay - 1] : sn > 1 ? [sn - 1, S[sn - 1].total] : null;
const pageOf = (sn, ay) => S[sn].vp[ay - 1];
function mpEnd(sn, ay, mode) {
  const s = S[sn];
  if (mode === "page") { let c = [sn, ay], n; const p = pageOf(sn, ay); while ((n = nextV(...c)) && pageOf(...n) === p) c = n; return c; }
  if (mode === "siyaq") return [sn, siyaqOf(sn, ay).e];
  if (mode === "fasl") { const f = faslOf(s, siyaqOf(sn, ay)); return [sn, f ? f.e : s.total]; }
  if (mode === "surah") return [sn, s.total];
  return [114, 6];
}
const firstOnPage = p => { for (const s of DATA.surahs) { const i = s.vp.indexOf(p); if (i >= 0) return [s.n, i + 1]; } return [1, 1]; };
let mp = {playing: false, cur: null, start: null, end: null, k: 0, round: 1, open: false};
function mpStart(sn, ay) {
  stopAudio();
  Object.assign(mp, {playing: true, start: [sn, ay], cur: [sn, ay], end: mpEnd(sn, ay, cfg.mpEnd), k: 0, round: 1});
  mpPlay();
}
function mpPlay() {
  const [sn, ay] = mp.cur;
  try { if (audio) audio.pause(); } catch (e) {}
  mp.playing = true;
  if (tab === "mushaf" && pageOf(sn, ay) !== mushafPage && !document.getElementById("sheet").innerHTML) { mushafPage = pageOf(sn, ay); closeWordbar(); render(); }
  setPlaying(key(sn, ay)); mpRefresh();
  const a = audio = new Audio(audioUrl(sn, ay));
  a.onended = () => { if (audio === a && mp.playing) mpNext(); };
  a.play().catch(() => { if (audio !== a) return; mp.playing = false; setPlaying(null); mpRefresh(); toast("پخش صوت ممکن نشد؛ اینترنت را بررسی کنید"); });
}
function mpNext() {
  mp.k++;
  if (!cfg.mpRep || mp.k < cfg.mpRep) return mpPlay();
  mp.k = 0;
  if (mp.cur[0] === mp.end[0] && mp.cur[1] === mp.end[1]) {
    mp.round++;
    if (!cfg.mpRangeRep || mp.round <= cfg.mpRangeRep) { mp.cur = mp.start.slice(); return mpPlay(); }
    return mpStop(true);
  }
  const n = nextV(...mp.cur); if (!n) return mpStop(true);
  mp.cur = n; mpPlay();
}
function mpStop(done) { mp.playing = false; try { if (audio) audio.pause(); } catch (e) {} setPlaying(null); if (done) { mp.cur = null; toast("پخش تمام شد"); } mpRefresh(); }
function mpToggle() {
  if (mp.playing) return mpStop(false);
  if (mp.cur && audio && audio.src && !audio.ended && playingVk === null && audio.currentTime > 0) { mp.playing = true; setPlaying(key(...mp.cur)); audio.play().catch(() => mpPlay()); return mpRefresh(); }
  const from = selVk ? parseVk(selVk) : mp.cur || firstOnPage(mushafPage);
  mpStart(from[0], from[1]);
}
function mpSkip(d) {
  const base = mp.cur || (selVk ? parseVk(selVk) : firstOnPage(mushafPage));
  const n = d > 0 ? nextV(...base) : prevV(...base); if (!n) return;
  if (!mp.start || !mp.playing) { mpStart(n[0], n[1]); return; }
  mp.cur = n; mp.k = 0; mpPlay();
}
function mpBar() {
  const c = mp.cur, endName = (MP_ENDS.find(x => x[0] === cfg.mpEnd) || MP_ENDS[3])[1];
  const where = c ? `سوره ${S[c[0]].name} · آیه ${FA(c[1])}` : selVk ? `از آیه ${FA(parseVk(selVk)[1])} سوره ${S[parseVk(selVk)[0]].name}` : "از ابتدای همین صفحه";
  const noFasl = cfg.mpEnd === "fasl" && !(S[(c || firstOnPage(mushafPage))[0]].fasls || []).length;
  return `<div class="player" id="player" role="region" aria-label="پخش ترتیل">
    <div class="pl-main">
      <button class="pl-btn" id="mp-prev" aria-label="آیه قبل"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-9 6 9 6z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <button class="pl-btn pl-play" id="mp-play" aria-label="${mp.playing ? "توقف" : "پخش"}">${mp.playing ? `<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.5" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="3.5" height="14" rx="1" fill="currentColor"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>`}</button>
      <button class="pl-btn" id="mp-next" aria-label="آیه بعد"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l9 6-9 6z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <div class="pl-info"><b class="small">${where}</b><span class="small muted">تا آخر ${noFasl ? "سوره (بی‌فصل)" : endName} · تکرار ${repName(cfg.mpRep)}${cfg.mpRangeRep !== 1 ? " · بازه " + repName(cfg.mpRangeRep) : ""}</span></div>
      <button class="pl-btn" id="mp-set" aria-label="تنظیمات پخش" aria-expanded="${mp.open}">${ICON_GEAR}</button>
    </div>
    ${mp.open ? `<div class="pl-set">
      <div class="field"><span class="small">پخش تا آخر</span><div class="seg">${MP_ENDS.map(([v, l]) => `<button data-mpend="${v}" aria-pressed="${cfg.mpEnd === v}">${l}</button>`).join("")}</div></div>

        <div class="field"><label class="small" for="mp-rep">تکرار هر آیه</label><select id="mp-rep">${MP_REPS.map(n => `<option value="${n}" ${cfg.mpRep === n ? "selected" : ""}>${repName(n)}</option>`).join("")}</select></div>
        <div class="field"><label class="small" for="mp-rr">تکرار کل بازه</label><select id="mp-rr">${MP_REPS.map(n => `<option value="${n}" ${cfg.mpRangeRep === n ? "selected" : ""}>${repName(n)}</option>`).join("")}</select></div>

    </div>` : ""}
  </div>`;
}
function wirePlayer(root) {
  const on = (sel, ev, f) => { const el = root.querySelector(sel); if (el) el.addEventListener(ev, f); };
  on("#mp-play", "click", mpToggle);

  on("#mp-rr", "change", e => { cfg.mpRangeRep = +e.target.value; saveCfg(); mpRefresh(); });
  on("#mp-reciter", "change", e => { cfg.reciter = e.target.value; saveCfg(); if (mp.playing) mpPlay(); else mpRefresh(); });
}
function mpRefresh() { const el = document.getElementById("player"); if (!el) return; el.outerHTML = mpBar(); wirePlayer(document.getElementById("player").parentNode); }

const WBW_API = "https://api.qurancdn.com/api/qdc/verses/by_chapter/";

  try { localStorage.setItem(wbwKey(sn), v); } catch (e) {}
}

    const out = {};
    for (let page = 1; page <= 10; page++) {
      const j = await getJSON(`${WBW_API}${sn}?words=true&word_translation_language=fa&word_fields=text_uthmani&fields=text_uthmani&per_page=50&page=${page}`);
      (j.verses || []).forEach(v => { out[v.verse_number] = (v.words || []).filter(w => w.char_type_name === "word").map(w => [w.text_uthmani || w.text, ((w.translation || {}).text || "").trim(), w.audio_url || ""]); });
      if (!j.pagination || !j.pagination.next_page) break;
    }
    if (Object.keys(out).length < S[sn].total) throw new Error("incomplete");
    WBW[sn] = out; storeWbw(sn, out); return out;
  })().finally(() => { WBW_LOADING[sn] = null; });
}
const wordMeaning = (sn, ay, i) => { const w = wbw(sn); return w && w[ay] && w[ay][i - 1] ? w[ay][i - 1] : null; };
function playWord(src) { if (!src) return; stopAudio(); try { audio = new Audio(WBW_AUDIO + src); audio.play().catch(() => toast("پخش تلفظ کلمه به اینترنت نیاز دارد")); } catch (e) {} }

// ---------- my vocabulary: words the reader did not know ----------
// st.vocab["2:255:3"] = {ar, fa, au, at: added (ms), ok: times known in practice}
const vocabKey = (sn, ay, i) => `${sn}:${ay}:${i}`;
const inVocab = k => !!(st.vocab || {})[k];
function toggleVocab(sn, ay, i) {
  const k = vocabKey(sn, ay, i), m = wordMeaning(sn, ay, i); st.vocab = st.vocab || {};
  if (st.vocab[k]) delete st.vocab[k]; else if (m) st.vocab[k] = {ar: m[0], fa: m[1], au: m[2], at: Date.now(), ok: 0};
  save(); toast(st.vocab[k] ? "به لغت‌نامه من اضافه شد" : "از لغت‌نامه برداشته شد");
}
let vocabCard = null;
function openVocab(mode) {
  lastDraw = () => openVocab(mode);
  const list = Object.entries(st.vocab || {}).sort((a, b) => (a[1].ok - b[1].ok) || (b[1].at - a[1].at));
  if (mode === "cards" && list.length) {
    if (!vocabCard || !st.vocab[vocabCard.k]) vocabCard = {k: list[0][0], show: false, i: 0};
    const [k, v] = [vocabCard.k, st.vocab[vocabCard.k]], [sn, ay] = k.split(":").map(Number);
    const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="تمرین لغت‌ها">
      <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>تمرین لغت‌ها · ${FA(vocabCard.i + 1)}</h2></header>
      <div class="body"><div class="card flash"><div class="ar flash-ar">${esc(v.ar)}</div>
        ${vocabCard.show ? `<div class="flash-fa">${esc(v.fa)}</div><span class="small muted">سوره ${S[sn].name} · آیه ${FA(ay)}</span>` : `<span class="small muted">معنی این کلمه چیست؟ اول در ذهن بگویید، بعد ببینید.</span>`}
        ${v.au ? `<button class="small" id="vc-say">🔊 تلفظ</button>` : ""}</div></div>
      <footer>${vocabCard.show ? `<button id="vc-no">بلد نبودم</button><button class="btn-main" id="vc-yes">بلد بودم</button>` : `<button class="btn-main" id="vc-show">نشانم بده</button>`}</footer></div>`, () => { vocabCard = null; openVocab(); });
    const on = (s, f) => { const el = box.querySelector(s); if (el) el.addEventListener("click", f); };
    on("#vc-say", () => playWord(v.au));
    on("#vc-show", () => { vocabCard.show = true; openVocab("cards"); });
    const next = known => { v.ok = known ? (v.ok || 0) + 1 : 0; save(); const rest = list.filter(([kk]) => kk !== k); const pick = rest.length ? rest[Math.floor(Math.random() * Math.min(rest.length, 8))][0] : k; vocabCard = {k: pick, show: false, i: vocabCard.i + 1}; openVocab("cards"); };
    on("#vc-yes", () => next(true)); on("#vc-no", () => next(false));
    return;
  }
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="لغت‌نامه من">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>لغت‌نامه من</h2></header>
    <div class="body">${list.length ? `<p class="small muted">${FA(list.length)} کلمه. کلمه‌هایی که کمتر بلد بوده‌اید بالاترند.</p><button class="btn-main" id="vc-go">تمرین با کارت</button>
      <section class="card" style="gap:0;padding-block:4px">${list.map(([k, v]) => { const [sn, ay] = k.split(":").map(Number);
        return `<div class="vrow"><span class="ar vrow-ar">${esc(v.ar)}</span><span class="vrow-fa">${esc(v.fa)}<br><span class="small muted">${S[sn].name} · ${FA(ay)}${v.ok ? " · ✓ " + FA(v.ok) : ""}</span></span>
          <span class="row" style="gap:4px;flex-wrap:nowrap">${v.au ? `<button class="small icon-btn" data-vsay="${k}" aria-label="تلفظ">🔊</button>` : ""}<button class="small icon-btn btn-ghost" data-vdel="${k}" aria-label="برداشتن">✕</button></span></div>`; }).join("")}</section>`
      : `<div class="card"><p class="small">هنوز کلمه‌ای اضافه نکرده‌اید. در مرحله «فهم آیات» یا در مصحف روی هر کلمه بزنید و «+ لغت‌نامه من» را انتخاب کنید.</p></div>`}</div></div>`);
  const go = box.querySelector("#vc-go"); if (go) go.addEventListener("click", () => { vocabCard = null; openVocab("cards"); });
  box.querySelectorAll("[data-vsay]").forEach(b => b.addEventListener("click", () => playWord(st.vocab[b.dataset.vsay].au)));
  box.querySelectorAll("[data-vdel]").forEach(b => b.addEventListener("click", () => { delete st.vocab[b.dataset.vdel]; save(); openVocab(); }));
}

// Stage 1, part 1: understanding the verses, word by word and verse by verse
function stepUnderstand(nav) {
  const {s, q} = ses, n = note(ses.k), ays = range(q.s, q.e);
  n.got = n.got || {};
  const W = wbw(s.n), got = ays.filter(a => n.got[a]).length;
  if (!W && !ses.wbwTried) { ses.wbwTried = true; loadWbw(s.n).then(() => { if (ses && ses.s.n === s.n) redraw(); }).catch(() => { ses.wbwFail = true; if (ses) redraw(); }); }
  const sel = ses.word;     // [ay, i] of the tapped word
  const verse = a => {
    const words = W && W[a];
    return `<div class="uv${n.got[a] ? " got" : ""}" id="uv-${a}">
      <div class="row between"><span class="small muted">آیه ${FA(a)}</span><button class="small icon-btn btn-ghost" data-uplay="${a}" aria-label="شنیدن آیه ${FA(a)}">▶</button></div>
      ${words ? `<div class="wbw">${words.map(([ar, fa], i) => `<button class="wb${sel && sel[0] === a && sel[1] === i + 1 ? " on" : ""}${inVocab(vocabKey(s.n, a, i + 1)) ? " mine" : ""}" data-w="${a}:${i + 1}"><span class="ar wb-ar">${esc(ar)}</span><span class="wb-fa">${esc(fa)}</span></button>`).join("")}</div>`
        : `<div class="ar">${esc(vplain(s.n, a) || vtext(s.n, a))}</div>`}
      ${sel && sel[0] === a && words ? (() => { const [ar, fa, au] = words[sel[1] - 1], k = vocabKey(s.n, a, sel[1]);
        return `<div class="wsel"><span class="ar">${esc(ar)}</span><b>${esc(fa)}</b><span class="row" style="gap:6px">${au ? `<button class="small" id="w-say">🔊 تلفظ</button>` : ""}<button class="small" id="w-vocab">${inVocab(k) ? "✓ در لغت‌نامه" : "+ لغت‌نامه من"}</button></span></div>`; })() : ""}
      ${trans(s.n, a) ? `<p class="tr uv-tr">${esc(trans(s.n, a))}</p>` : ""}
      <label class="switch small uv-ok"><span>این آیه را فهمیدم</span><input type="checkbox" data-got="${a}" ${n.got[a] ? "checked" : ""}></label></div>`;
  };
  return {
    body: `${nav}
    <div class="card"><div class="small muted">سیاق ${FA(q.n)} از ${FA(s.siyaqs.length)} سوره ${s.name} · آیات ${FA(q.s)} تا ${FA(q.e)}</div>${strip(s, q.n)}
    ${faslOf(s, q) && faslOf(s, q).t ? `<p class="small"><b>فصل ${FA(faslOf(s, q).n)}:</b> ${esc(faslOf(s, q).t)}</p>` : ""}
    <h3>قدم اول: فهم آیات</h3>
    <p class="small">پیش از تدبر باید بدانید آیات چه می‌گویند. هر آیه را کلمه‌به‌کلمه با معنایش بخوانید، روی کلمه‌ای که نمی‌شناسید بزنید تا تلفظش را بشنوید و اگر خواستید به «لغت‌نامه من» اضافه‌اش کنید. بعد ترجمه کامل آیه را بخوانید و وقتی معنایش را فهمیدید، تیک بزنید.</p>
    <div class="row"><button id="listen">▶ شنیدن کل سیاق</button><button id="les">🎬 درس استاد درباره این سوره</button></div>
    ${!W ? `<p class="small muted">${ses.wbwFail ? "معنای کلمه‌به‌کلمه دریافت نشد؛ برای بار اول به اینترنت نیاز است. فعلاً ترجمه کامل آیات آمده است." : "در حال دریافت معنای کلمه‌به‌کلمه…"}</p>${ses.wbwFail ? `<button class="small" id="w-retry">تلاش دوباره</button>` : ""}` : ""}
    <div class="small muted">فهمیده‌شده: <span class="num">${FA(got)} از ${FA(ays.length)}</span> آیه · ترجمه کامل: ${transName()}</div>${miniBar(got / ays.length, "var(--lapis)")}</div>
    ${ays.map(verse).join("")}
    <p class="small muted">معنای کلمه‌به‌کلمه: Quran.com</p>`,
    foot: `${cfg.gate ? "" : `<button class="btn-ghost" id="skip">رد شدن از تدبر</button>`}<button class="btn-main" id="next">${got < ays.length ? `فهمیدم (${FA(got)}/${FA(ays.length)})؛ برو به کشف گام‌ها` : "فهمیدم؛ برو به کشف گام‌ها"}</button>`,
    wire: b => {
      b.querySelector("#listen").addEventListener("click", () => playQueue(ays.map(i => [s.n, i])));
      b.querySelector("#les").addEventListener("click", () => { stopAudio(); const back = () => drawSession(); openLessons(s.n); lastDraw = () => {}; const c = document.querySelector("#sheet [data-close]"); c.replaceWith(c.cloneNode(true)); document.querySelector("#sheet [data-close]").addEventListener("click", back); });
      b.querySelectorAll("[data-uplay]").forEach(x => x.addEventListener("click", () => play(s.n, +x.dataset.uplay, 1)));
      b.querySelectorAll("[data-w]").forEach(x => x.addEventListener("click", () => {
        const [a, i] = x.dataset.w.split(":").map(Number); ses.word = sel && sel[0] === a && sel[1] === i ? null : [a, i];
        const m = ses.word && wordMeaning(s.n, a, i); if (m && m[2]) playWord(m[2]); redraw(); }));
      const say = b.querySelector("#w-say"); if (say) say.addEventListener("click", () => { const m = wordMeaning(s.n, sel[0], sel[1]); if (m) playWord(m[2]); });
      const voc = b.querySelector("#w-vocab"); if (voc) voc.addEventListener("click", () => { toggleVocab(s.n, sel[0], sel[1]); redraw(); });
      const rt = b.querySelector("#w-retry"); if (rt) rt.addEventListener("click", () => { ses.wbwTried = false; ses.wbwFail = false; redraw(); });
      b.querySelectorAll("[data-got]").forEach(x => x.addEventListener("change", () => { n.got[+x.dataset.got] = x.checked; save(); redraw(); }));
      b.querySelector("#next").addEventListener("click", () => {
        if (cfg.gate && got < ays.length) { toast("هر آیه را که فهمیدید تیک بزنید؛ " + FA(ays.length - got) + " آیه مانده"); const el = b.querySelector(`#uv-${ays.find(a => !n.got[a])}`); if (el) el.scrollIntoView({behavior: "smooth", block: "center"}); return; }
        ses.sub = 1; ses.word = null; drawSession(); });
      const sk = b.querySelector("#skip"); if (sk) sk.addEventListener("click", () => { n.done = true; save(); advance(); });
    }
  };
}

// Stage 1: tadabbur, in three parts
function stepTadabbur() {
  const {s, q} = ses, n = note(ses.k);
  const sub = ses.sub;
  const nav = `<div class="subnav">${["فهم آیات", "کشف گام‌ها", "پرسش‌ها"].map((l, i) => `<span class="${i === sub ? "on" : ""}">${FA(i + 1)}. ${l}</span>`).join("")}</div>`;
  if (sub === 0) return stepUnderstand(nav);
  if (sub === 1) {
    const cuts = new Set(n.cuts.filter(c => c > q.s && c <= q.e).map(c => key(s.n, c - 1)));
    const segs = [q.s, ...n.cuts.filter(c => c > q.s && c <= q.e).sort((a, b) => a - b)];
    const refStarts = q.steps.map(x => x.s).slice(1), myStarts = segs.slice(1);
    const hits = refStarts.filter(x => myStarts.includes(x)).length;
    return {
      body: `${nav}
      <div class="card"><h3>این سیاق از چند گام معنایی ساخته شده؟</h3>
      <p class="small">هر جا حس کردید معنا به مرحله تازه‌ای رفت، روی <b>نشانه پایان آیه</b> بزنید تا گام تازه از آیه بعد شروع شود. نشانه‌های طلایی مرز گام‌های شماست. بعد برای هر گام یک عنوان کوتاه بنویسید.</p></div>
      <div id="cutpages">${sesPages(q.s, q.e, {cut: cuts})}</div>
      <div class="card"><h3>گام‌های من</h3>
      ${segs.map((a, i) => { const e = (segs[i + 1] || q.e + 1) - 1; return `<div class="field"><label for="st-${a}">گام ${FA(i + 1)} · آیات ${FA(a)}${e > a ? " تا " + FA(e) : ""}</label><input type="text" id="st-${a}" data-stitle="${a}" value="${esc(n.stepTitles[a] || "")}" placeholder="عنوان کوتاه این گام"></div>`; }).join("")}</div>
      ${q.steps.length ? `<div class="card"><div class="row between"><h3>مقایسه با گام‌های مرجع</h3><button class="small" id="cmp" aria-expanded="${ses.cmp}">${ses.cmp ? "پنهان کن" : "نشانم بده"}</button></div>
        ${ses.cmp ? `<p class="small">شما ${FA(hits)} مرز از ${FA(refStarts.length)} مرز مرجع را پیدا کردید.</p><ol class="small" style="margin:0;padding-inline-start:20px">${q.steps.map(x => `<li>${esc(x.t)} <span class="muted">(آیات ${FA(x.s)}${x.e > x.s ? " تا " + FA(x.e) : ""})</span></li>`).join("")}</ol><p class="small muted">در حفظ، گام‌های مرجع مبنا هستند و برداشت شما کنارش نگه داشته می‌شود.</p>` : `<p class="small muted">بعد از تقسیم خودتان، گام‌های مرجع را ببینید و مقایسه کنید.</p>`}</div>` : `<p class="small muted">برای این سیاق هنوز گام مرجع نداریم؛ گام‌های خودتان مبنای حفظ می‌شود.</p>`}`,
      foot: `<button id="back">قبلی</button><button class="btn-main" id="next">برو به پرسش‌ها</button>`,
      wire: b => {
        b.querySelector("#cutpages").addEventListener("click", e => {
          const m = e.target.closest('[data-t="e"]'); if (!m) return;
          const [x, y] = parseVk(m.dataset.vk); if (x !== s.n || y < q.s || y >= q.e) return;
          const a = y + 1; n.cuts = n.cuts.includes(a) ? n.cuts.filter(c => c !== a) : [...n.cuts, a]; save(); redraw();
        });
        b.querySelectorAll("[data-stitle]").forEach(x => x.addEventListener("input", () => { n.stepTitles[x.dataset.stitle] = x.value; save(); }));
        const c = b.querySelector("#cmp"); if (c) c.addEventListener("click", () => { ses.cmp = !ses.cmp; redraw(); });
        b.querySelector("#back").addEventListener("click", () => { ses.sub = 0; drawSession(); });
        b.querySelector("#next").addEventListener("click", () => { ses.sub = 2; drawSession(); });
      }
    };
  }
  return {
    body: `${nav}
    <div class="card"><h3>پرسش‌های تدبری</h3><p class="small">کوتاه و به زبان خودتان بنویسید. پاسخ درست و غلط ندارد؛ هدف، ارتباط گرفتن با آیات پیش از حفظ است.</p></div>
    ${QUESTIONS.map((qq, i) => `<div class="field"><label for="qa-${i}">${FA(i + 1)}. ${qq}</label><textarea id="qa-${i}" data-qa="${i}" rows="2">${esc(n.answers[i] || "")}</textarea></div>`).join("")}
    <div class="field"><label for="mytitle"><b>عنوان این سیاق به زبان من</b></label><input type="text" id="mytitle" value="${esc(n.title)}" placeholder="در یک جمله کوتاه"></div>
    ${q.title ? `<div class="card"><div class="row between"><h3>${s.src === "book" ? "مقایسه با برداشت استاد" : "عنوان مرجع (آزمایشی)"}</h3><button class="small" id="cmp2" aria-expanded="${!!ses.cmp2}">${ses.cmp2 ? "پنهان کن" : "نشانم بده"}</button></div>
      ${ses.cmp2 ? `<div class="meaning"><b>${esc(q.title)}</b>${(q.sum || []).map(x => `<span class="small">${esc(x)}</span>`).join("")}</div>${s.source ? `<p class="small muted">از ${esc(s.source)}</p>` : ""}` : `<p class="small muted">اول برداشت خودتان را بنویسید، بعد با پیام اصلی این سیاق مقایسه کنید.</p>`}</div>` : ""}`,
    foot: `<button id="back">قبلی</button><button class="btn-main" id="next">تدبر تمام شد؛ برو به شنیدن</button>`,
    wire: b => {
      b.querySelectorAll("[data-qa]").forEach(x => x.addEventListener("input", () => { n.answers[+x.dataset.qa] = x.value; save(); }));
      b.querySelector("#mytitle").addEventListener("input", e => { n.title = e.target.value; save(); });
      const c2 = b.querySelector("#cmp2"); if (c2) c2.addEventListener("click", () => { ses.cmp2 = !ses.cmp2; redraw(); });
      b.querySelector("#back").addEventListener("click", () => { ses.sub = 1; drawSession(); });
      b.querySelector("#next").addEventListener("click", () => {
        if (cfg.gate && !n.title.trim() && !n.answers.some(a => a.trim())) { toast("دست‌کم به یک پرسش پاسخ دهید یا عنوانی بنویسید"); return; }
        n.done = true; markActive(); save(); advance();
      });
    }
  };
}

function stepListen() {

    <div class="card"><p class="small">کل سیاق را چند بار بشنوید و همراه قاری در دل بخوانید. قاری: ${reciterName(cfg.reciter)}</p>
    <div class="row"><span class="small">تکرار هر آیه</span><div class="seg" style="flex:1">${[1, 3, 5].map(x => `<button data-reps="${x}" aria-pressed="${cfg.reps === x}">${FA(x)} بار</button>`).join("")}</div></div>

    }};
}

const LEVELS = [["full", "کامل"], ["half", "نیمه"], ["first", "سرنخ"], ["none", "معنا"]];

// ---------- mistakes: where memorization slips and what still needs consolidating ----------
// st.err["2:5"] = {n: times wrong, t: {type: count}, w: {wordPos: count}, first, last: day, clean: clean recalls since, cday}
const ERR_TYPES = [["forget", "یادم نیامد"], ["word", "اشتباه در کلمه یا اعراب"], ["similar", "قاطی با آیه مشابه"], ["order", "جابه‌جایی ترتیب"]];
const errName = t => (ERR_TYPES.find(x => x[0] === t) || [, t])[1];
const CLEAN_NEED = 2;      // clean recalls, each on a later day, before a verse counts as consolidated
const errOf = vk => (st.err || {})[vk];
const errOpen = vk => { const e = errOf(vk); return !!e && (e.clean || 0) < CLEAN_NEED; };
const errList = () => Object.entries(st.err || {}).map(([vk, e]) => { const [sn, ay] = parseVk(vk); return {vk, sn, ay, e, open: (e.clean || 0) < CLEAN_NEED}; })
  .sort((a, b) => (b.open - a.open) || (b.e.n - a.e.n) || (b.e.last - a.e.last));
const weakOpen = () => errList().filter(x => x.open);
function addErr(vk, t) {
  st.err = st.err || {};
  const e = st.err[vk] || (st.err[vk] = {n: 0, t: {}, w: {}, first: today()});
  e.n++; e.t[t] = (e.t[t] || 0) + 1; e.last = today(); e.clean = 0; e.cday = null;
  markActive(); save();
}
function undoErr(vk, t, words) {
  const e = errOf(vk); if (!e) return;
  e.n--; e.t[t] = Math.max(0, (e.t[t] || 1) - 1);
  (words || []).forEach(i => { e.w[i] = Math.max(0, (e.w[i] || 1) - 1); });
  if (e.n <= 0) delete st.err[vk];
  save();
}
// A correct recall of a weak verse; counts once a day and not on the day of the mistake
function cleanCheck(vk) {
  const e = errOf(vk); if (!e || e.last === today() || e.cday === today()) return false;
  e.clean = (e.clean || 0) + 1; e.cday = today(); save(); return true;
}
const ago = d => { const n = today() - d; return n <= 0 ? "امروز" : n === 1 ? "دیروز" : FA(n) + " روز پیش"; };

// In-session marking: after a verse is revealed the reader says whether it was right
function markBar() {
  const m = ses.mark; if (!m) return "";
  const had = ses.errs[m.ay];
  if (had) return `<div class="markbar" role="status"><span class="small"><b>آیه ${FA(m.ay)}:</b> «${errName(had)}» در دفتر اشتباهات ثبت شد. اگر خواستید روی کلمه‌های اشتباه بزنید.</span><button class="small btn-ghost" data-mk="undo">لغو ثبت</button><button class="small" data-mk="ok">بستن</button></div>`;
  if (m.phase === "type") return `<div class="markbar"><span class="small"><b>آیه ${FA(m.ay)}</b> · چه اشتباهی بود؟</span>${ERR_TYPES.map(([k, l]) => `<button class="small" data-mk="t:${k}">${l}</button>`).join("")}<button class="small btn-ghost" data-mk="ok">انصراف</button></div>`;
  return `<div class="markbar"><span class="small">آیه ${FA(m.ay)} را درست از حفظ خواندید؟</span><button class="small" data-mk="ok">✓ درست</button><button class="small" data-mk="bad">✗ اشتباه داشتم</button></div>`;
}
function wireMark(b) {
  b.querySelectorAll("[data-mk]").forEach(x => x.addEventListener("click", () => {
    const a = x.dataset.mk, m = ses.mark; if (!m) return;
    const vk = key(ses.s.n, m.ay);
    if (a === "ok") ses.mark = null;
    else if (a === "bad") m.phase = "type";
    else if (a === "undo") { undoErr(vk, ses.errs[m.ay], ses.ew[m.ay]); delete ses.errs[m.ay]; delete ses.ew[m.ay]; ses.mark = null; }
    else if (a.startsWith("t:")) { const t = a.slice(2); addErr(vk, t); ses.errs[m.ay] = t; ses.ew[m.ay] = []; }
    redraw();
  }));
}
// Tapping a word of the verse just marked wrong toggles that word as one of the slips
function markWordClick(w) {
  const m = ses.mark; if (!m || !ses.errs[m.ay] || w.dataset.t !== "w") return false;
  const [x, y] = parseVk(w.dataset.vk); if (x !== ses.s.n || y !== m.ay) return false;
  const i = +w.dataset.i, e = errOf(w.dataset.vk), list = ses.ew[y];
  if (list.includes(i)) { ses.ew[y] = list.filter(v => v !== i); e.w[i] = Math.max(0, (e.w[i] || 1) - 1); }
  else { list.push(i); e.w[i] = (e.w[i] || 0) + 1; }
  save(); redraw(); return true;
}
// Revealed verses not marked wrong count as clean recalls
function settleChecks(ays) { ays.forEach(y => { if (ses.shown[y] && !ses.errs[y]) cleanCheck(key(ses.s.n, y)); }); }
const resetMarks = () => { ses.mark = null; ses.errs = ses.errs || {}; ses.ew = ses.ew || {}; };

// ---------- full text (for search and the mistakes book) ----------
let QTEXT = null, QNORM = null, QTEXT_LOADING = null;
function loadText() {
  if (QTEXT) return Promise.resolve(QTEXT);
  return QTEXT_LOADING = QTEXT_LOADING || fetch(DATA_BASE + "quran.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(j => (QTEXT = j)).catch(e => { QTEXT_LOADING = null; throw e; });
}
const vplain = (sn, ay) => QTEXT ? QTEXT[sn - 1][ay - 1] : vtext(sn, ay);
// Arabic folded for search: no diacritics, one form per letter, «صلوة/صلاة» and «إلاه/إله» alike
const arNorm = x => String(x || "").replace(/[ً-ٰٟۖ-ۭـ‌‍]/g, "")
  .replace(/[أإآٱ]/g, "ا").replace(/[ىی]/g, "ي").replace(/ک/g, "ك").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ة/g, "ه")
  .replace(/واه(?=\s|$)/g, "اه").replace(/(\S)ا/g, "$1").replace(/\s+/g, " ").trim();
const faNum = x => String(x).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const findSurah = name => { const n = normFa(name).replace(/^سوره\s+/, "").trim(); if (!n) return null;
  return DATA.surahs.find(s => surahNames(s.n).includes(n) || normFa(s.name) === n) || DATA.surahs.find(s => normFa(s.name).startsWith(n)) || null; };
function searchQuran(q) {
  const out = {ref: [], ar: [], tr: []}, raw = faNum(q.trim());
  if (!raw) return out;
  let m = raw.match(/^(\d{1,3})\s*[:：\/.\-]\s*(\d{1,3})$/);
  if (m && S[+m[1]] && +m[2] >= 1 && +m[2] <= S[+m[1]].total) out.ref.push([+m[1], +m[2]]);
  m = raw.match(/^(.+?)\s*[:：]?\s*(\d{1,3})$/);
  if (m && !/^\d+$/.test(m[1])) { const s = findSurah(m[1]); if (s && +m[2] >= 1 && +m[2] <= s.total) out.ref.push([s.n, +m[2]]); }
  if (!/\d/.test(raw)) { const s = findSurah(raw); if (s && normFa(raw).replace(/^سوره\s+/, "").length >= 2) out.ref.push([s.n, 1]); }
  const nq = arNorm(raw);
  if (QTEXT && nq.replace(/\s/g, "").length >= 2) {
    QNORM = QNORM || QTEXT.map(sv => sv.map(arNorm));
    QNORM.forEach((sv, si) => sv.forEach((v, ai) => { if (v.includes(nq)) out.ar.push([si + 1, ai + 1]); }));
  }
  const tq = normFa(raw).trim(), T = TR[cfg.trans];
  if (T && tq.length >= 2) T.forEach((sv, si) => sv.forEach((v, ai) => { if (normFa(v).includes(tq)) out.tr.push([si + 1, ai + 1]); }));
  return out;
}
// Verse text with the searched words (or the words once read wrong) highlighted
function arHtml(sn, ay, opt = {}) {
  const words = (vplain(sn, ay) || "").split(" "), toks = opt.q ? arNorm(opt.q).split(" ").filter(t => t.length >= 2) : [];
  const e = opt.err ? errOf(key(sn, ay)) : null;
  return words.map((w, i) => { const nw = arNorm(w);
    if (e && e.w[i + 1] > 0) return `<span class="errw">${esc(w)}</span>`;
    return toks.some(t => nw.includes(t) || (t.length > 2 && t.includes(nw) && nw.length > 2)) ? `<mark>${esc(w)}</mark>` : esc(w); }).join(" ");
}
let searchState = {q: "", scope: "all", more: 0};
function openSearch() {
  lastDraw = () => {};
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="جستجو در قرآن">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>جستجو در قرآن</h2></header>
    <div class="body">
      <input type="search" id="sq" value="${esc(searchState.q)}" placeholder="کلمه یا عبارت، یا آیه مثل «بقره ۲۵۵»" aria-label="عبارت جستجو" autocomplete="off">
      <div class="seg" role="group" aria-label="جستجو در">${[["all", "متن و ترجمه"], ["ar", "متن عربی"], ["tr", "ترجمه"]].map(([v, l]) => `<button data-scope="${v}" aria-pressed="${searchState.scope === v}">${l}</button>`).join("")}</div>
      <div id="sres"></div>
    </div></div>`);
  const input = box.querySelector("#sq");
  const run = () => drawResults(box);
  input.addEventListener("input", () => { searchState.q = input.value; searchState.more = 0; clearTimeout(run.t); run.t = setTimeout(run, 250); });
  box.querySelectorAll("[data-scope]").forEach(b => b.addEventListener("click", () => { searchState.scope = b.dataset.scope; searchState.more = 0; box.querySelectorAll("[data-scope]").forEach(x => x.setAttribute("aria-pressed", x === b)); run(); }));
  loadText().then(run).catch(() => { box.querySelector("#sres").innerHTML = `<p class="small">بارگیری متن قرآن ممکن نشد.</p>`; });
  if (cfg.trans !== "none") trans(1, 1);      // starts loading the chosen translation
  run(); setTimeout(() => input.focus(), 50);
}
function drawResults(box) {
  const out = box.querySelector("#sres"); if (!out) return;
  const q = searchState.q.trim();
  if (!q) { out.innerHTML = `<p class="small muted">در متن عربی آیات (بدون نیاز به اعراب) و در ترجمه «${transName()}» جستجو می‌شود. برای رفتن به یک آیه، نام یا شماره سوره و شماره آیه را بنویسید، مثل «بقره ۲۵۵» یا «۲:۲۵۵».</p>`; return; }
  if (!QTEXT) { out.innerHTML = `<p class="small muted">در حال بارگیری متن قرآن…</p>`; return; }
  const r = searchQuran(q), sc = searchState.scope;
  const seen = new Set(), list = [];
  const add = (arr, kind) => arr.forEach(([sn, ay]) => { const k = key(sn, ay); if (!seen.has(k)) { seen.add(k); list.push({sn, ay, kind}); } });
  add(r.ref, "ref"); if (sc !== "tr") add(r.ar, "ar"); if (sc !== "ar") add(r.tr, "tr");
  const nAr = sc !== "tr" ? r.ar.length : 0, nTr = sc !== "ar" ? r.tr.length : 0, lim = 40 + searchState.more;
  const trWait = sc !== "ar" && cfg.trans !== "none" && !TR[cfg.trans];
  out.innerHTML = `<p class="small muted">${[sc !== "tr" ? `${FA(nAr)} آیه در متن عربی` : "", sc !== "ar" ? (cfg.trans === "none" ? "ترجمه خاموش است" : trWait ? "ترجمه در حال بارگیری…" : `${FA(nTr)} آیه در ترجمه ${transName()}`) : ""].filter(Boolean).join(" · ")}</p>
    ${list.length ? list.slice(0, lim).map(x => { const k = key(x.sn, x.ay), sq = siyaqOf(x.sn, x.ay), tx = trans(x.sn, x.ay);
      return `<div class="sres"><div class="row between"><b>${x.kind === "ref" ? "↵ " : ""}سوره ${S[x.sn].name} · آیه ${FA(x.ay)}</b><span class="small muted">${sq ? "سیاق " + FA(sq.n) : ""}${errOf(k) ? ` · <span style="color:var(--st-due)">${FA(errOf(k).n)} اشتباه</span>` : ""}</span></div>

function restoreFrom(file) {

const upd = {state: "idle", app: null, meta: null, changed: [], err: false};
const vnum = v => String(v || "").replace(/^v/, "").split(".").map(x => parseInt(x) || 0);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };

async function checkUpdates(silent) {

// Keep progress when siyaq boundaries of a surah change: a new siyaq inherits what its overlapping old siyaqs had.
function migrateProgress(oldM, newM, surahNums) {
  surahNums.forEach(sn => {
    const os = oldM.surahs[sn - 1].siyaqs, ns = newM.surahs[sn - 1].siyaqs;
    const items = {}, notes = {};
    ns.forEach(q => {
      const ov = os.filter(o => o.e >= q.s && o.s <= q.e), ks = ov.map(o => key(sn, o.n));
      const its = ks.map(k => st.items[k]).filter(Boolean);
      if (its.length === ks.length && its.length) {
        const stage = Math.min(...its.map(x => x.stage || 0));
        if (stage >= 5) items[key(sn, q.n)] = {stage: 5, ivl: Math.min(...its.map(x => x.ivl || 1)), due: Math.min(...its.map(x => x.due || today()))};
        else if (stage > 0) items[key(sn, q.n)] = {stage};
      }
      const nts = ks.map(k => st.notes[k]).filter(Boolean);
      const same = ov.length === 1 && ov[0].s === q.s && ov[0].e === q.e;
      if (same && nts.length) notes[key(sn, q.n)] = nts[0];
      else if (nts.length === ks.length && nts.length && nts.every(x => x.done)) notes[key(sn, q.n)] = {done: true, title: "", answers: ["", "", "", ""], cuts: [], stepTitles: {}, carried: true};
    });
    Object.keys(st.items).filter(k => k.startsWith(sn + ":")).forEach(k => delete st.items[k]);
    Object.keys(st.notes).filter(k => k.startsWith(sn + ":")).forEach(k => delete st.notes[k]);
    Object.assign(st.items, items); Object.assign(st.notes, notes);
  });
  save();
}

function openGuide(section) {
  lastDraw = () => {};
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="راهنما">
  <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>راهنمای حفظ تدبری</h2></header>
  <div class="body">
    <p>این برنامه کمک می‌کند قرآن را <b>با فهم</b> حفظ کنید: هر بخش از آیات اول تدبر می‌شود و بعد، با تکیه بر همان معنا، حفظ و مرور می‌شود.</p>
    <details ${section ? "" : "open"}><summary>از کجا شروع کنم؟</summary><div><ol>
      <li><b>مبانی تدبر:</b> در داشبورد «شروع مبانی تدبر» را بزنید. جلسه‌های یکی از دوره‌های مبانی را ببینید یا بشنوید و بعد از هر جلسه تیک «دیده شد» را بزنید؛ یا کتاب «آشنایی با دانش تدبر در قرآن کریم» را بخوانید.</li>
      <li><b>گذر:</b> وقتی شرط‌ها کامل شد، «گذراندم» را بزنید. سطح ۱ باز می‌شود.</li>
      <li><b>سطح‌ها:</b> در هر سطح، درس‌های همان سطح را ببینید و سوره‌هایش را در برنامه تدبر کنید. سیاق امروز همیشه در داشبورد آماده است. وقتی یک دوره از درس‌ها دیده شد و همه سوره‌های سطح تدبر شد، سطح بعد باز می‌شود.</li>
      <li><b>حفظ و مرور:</b> بعد از تدبر هر سیاق، همان‌جا شنیدن و حفظ آن شروع می‌شود و مرورها خودکار برنامه‌ریزی می‌شوند. حفظ شرط گذر از سطح نیست و در سطح‌های بعد ادامه دارد.</li>
    </ol><p>سوره‌هایی را که از قبل حفظ هستید هر وقت خواستید ثبت کنید؛ این کار قفل ندارد. اگر دوره‌ها را قبلاً در کلاس گذرانده‌اید، در هر قدم «قبلاً گذرانده‌ام» را بزنید یا در تنظیمات «مسیر آزاد» را روشن کنید.</p></div></details>
    <details><summary>سیاق چیست و چرا واحد حفظ است؟</summary><div>
      <p>سیاق مجموعه‌ای از آیات پشت‌سرهم است که یک معنای پیوسته دارند. هر سوره از چند سیاق ساخته شده و هر سیاق از چند «گام» معنایی می‌گذرد.</p>
      <p>وقتی آیات را در قالب سیاق حفظ کنید، ترتیب آیات را از روی معنا به یاد می‌آورید، نه فقط از روی لفظ. این کار فراموشی و جابه‌جا خواندن آیات مشابه را کم می‌کند.</p>
      <p>در سوره‌های بلند، چند سیاق هم‌جهت یک «فصل» می‌سازند. گاهی فصلی کوتاه وسط فصل دیگر می‌آید (فصل معترضه)؛ مثل فصل دهم سوره بقره که درون فصل نهم است.</p>
      <p>تقسیم‌بندی هدف برنامه، روش «تدبر در قرآن کریم» استاد علی صبوحی طسوجی است. تا آماده شدن آن، مرز سیاق‌ها بر اساس رکوع‌های مصحف است و گام‌های معنایی هر سیاق را خودتان در مرحله تدبر مشخص می‌کنید.</p>
    </div></details>
    <details ${section === "cycle" ? "open" : ""}><summary>پنج مرحله هر سیاق</summary><div><ol>
      <li><b>تدبر:</b> فهم آیات (معنای کلمه‌به‌کلمه و ترجمه)، پیدا کردن گام‌های معنایی به دست خودتان، و پاسخ به چند پرسش تدبری.</li>
      <li><b>شنیدن:</b> گوش دادن به ترتیل کل سیاق با تکرار دلخواه.</li>
      <li><b>حفظ گام‌به‌گام:</b> هر گام معنایی جداگانه حفظ می‌شود و در پایان هر گام، کل آن یکجا از حفظ خوانده می‌شود.</li>
      <li><b>اتصال:</b> خواندن کل سیاق از حفظ با کمک «نقشه معنا».</li>
      <li><b>ثبت:</b> ارزیابی خودتان که زمان مرور بعدی را تعیین می‌کند.</li>
    </ol><p>همه مراحل روی صفحه‌های مصحف عثمان طه انجام می‌شود؛ فقط سطرهای همان سیاق نمایش داده می‌شود و آیه‌های بیرون از سیاق کم‌رنگ‌اند.</p></div></details>
    <details><summary>تدبر را چطور انجام دهم؟</summary><div>
      <p><b>۱. فهم آیات:</b> هر آیه کلمه‌به‌کلمه با معنای فارسی هر کلمه نمایش داده می‌شود. روی هر کلمه بزنید تا تلفظش را بشنوید؛ کلمه‌هایی را که نمی‌دانستید به «لغت‌نامه من» اضافه کنید تا بعداً با کارت تمرینشان کنید (در صفحه مرور). بعد ترجمه کامل آیه را بخوانید و «این آیه را فهمیدم» را بزنید. درس استاد درباره همان سوره هم از همین‌جا در دسترس است. معنای کلمه‌ها یک بار برای هر سوره از اینترنت گرفته و روی گوشی نگه داشته می‌شود.</p>
      <p><b>۲. کشف گام‌ها:</b> هر جا حس کردید معنا وارد مرحله تازه‌ای شد، روی نشانه پایان آیه بزنید. نشانه طلایی یعنی گام تازه از آیه بعد شروع می‌شود. برای هر گام عنوان کوتاهی بنویسید و بعد تقسیم خودتان را با گام‌های مرجع مقایسه کنید.</p>
      <p><b>۳. پرسش‌ها:</b> به چهار پرسش کوتاه جواب دهید و عنوان سیاق را به زبان خودتان بنویسید.</p>
      <p>همه این‌ها ذخیره می‌شوند و در حفظ و مرور به‌عنوان سرنخ معنایی به کار می‌روند.</p>
    </div></details>
    <details><summary>سطح‌های محو کلمات</summary><div><ul>
      <li><b>کامل:</b> همه کلمات دیده می‌شوند.</li>
      <li><b>نیمه:</b> یک کلمه در میان پنهان است.</li>
      <li><b>سرنخ:</b> فقط کلمه اول آیه دیده می‌شود.</li>
      <li><b>معنا:</b> همه کلمات پنهان‌اند و فقط عنوان گام می‌ماند؛ آیه را از روی معنا به یاد می‌آورید.</li>
    </ul><p>روی هر کلمه پنهان بزنید تا دیده شود.</p></div></details>
    <details ${section === "weak" ? "open" : ""}><summary>دفتر اشتباهات و تثبیت</summary><div>
      <p>در مرحله «اتصال»، در مرور و در پایان هر گام حفظ، هر آیه را از حفظ می‌خوانید و بعد روی آن می‌زنید تا دیده شود. برنامه می‌پرسد درست خواندید یا نه. اگر اشتباه داشتید، نوعش را بزنید: <b>یادم نیامد</b>، <b>اشتباه در کلمه یا اعراب</b>، <b>قاطی با آیه مشابه</b> یا <b>جابه‌جایی ترتیب</b>. بعد می‌توانید روی همان کلمه‌هایی که اشتباه خواندید بزنید.</p>
      <p>همه این‌ها در «دفتر اشتباهات» (از داشبورد یا صفحه مرور) جمع می‌شود: کدام آیه‌ها، چند بار، چه نوع اشتباهی و کدام کلمه‌ها. سیاق‌هایی که در مرور «سخت» زده‌اید هم آنجا هستند.</p>
      <p><b>تمرین تثبیت:</b> آیه قبل نشان داده می‌شود و آیه ضعیف را از حفظ می‌خوانید. هر آیه با ${FA(2)} بار درست خواندن در روزهای بعد از اشتباه «تثبیت‌شده» می‌شود. در مصحف هم زیر آیه‌های نیازمند تثبیت خط نقطه‌چین می‌آید.</p></div></details>
    <details ${section === "search" ? "open" : ""}><summary>جستجو در قرآن</summary><div>
      <p>با دکمه ذره‌بین بالای هر صفحه. کلمه یا عبارت را با حروف عربی یا فارسی و بدون اعراب بنویسید؛ در متن آیات و در ترجمه انتخاب‌شده جستجو می‌شود. برای رفتن مستقیم به یک آیه بنویسید «بقره ۲۵۵» یا «۲:۲۵۵». از هر نتیجه می‌توانید آیه را در مصحف ببینید، بشنوید یا سیاقش را باز کنید.</p></div></details>
    <details><summary>مرور و دکمه‌های سخت، خوب، آسان</summary><div>
      <p>هر مرور با «یادآوری معنا» شروع می‌شود: اول عنوان و گام‌های سیاق را در ذهن مرور می‌کنید، بعد آیات را از حفظ می‌خوانید.</p>
      <ul><li><b>سخت:</b> سیاق به مرحله حفظ برمی‌گردد.</li><li><b>خوب:</b> مرور بعدی حدود دو برابر فاصله قبلی.</li><li><b>آسان:</b> مرور بعدی حدود سه برابر فاصله قبلی.</li></ul>
    </div></details>
    <details><summary>مصحف و درس‌ها</summary><div>
      <p><b>مصحف:</b> صفحه‌های مصحف به خط عثمان طه. با کشیدن صفحه ورق بزنید و روی هر کلمه بزنید تا آیه، سیاق و ترتیل آن را ببینید. از همان‌جا می‌توانید آیه را به اشتراک بگذارید یا با ☆ به «علاقه‌مندی‌ها» (دکمه ★ بالای مصحف) اضافه کنید. پخش‌کننده پایین مصحف از آیه انتخاب‌شده تا آخر صفحه، سیاق، فصل، سوره یا کل قرآن می‌خواند، با تکرار هر آیه و کل بازه از ۱ بار تا بی‌نهایت؛ صفحه‌ها هم خودکار ورق می‌خورند.</p>
      <p><b>درس‌ها:</b> فیلم (آپارات) و صوت جلسه‌های تدبر استاد صبوحی برای هر سوره، مستقیم از سایت alisaboohi.com. این بخش به اینترنت نیاز دارد.</p>
    </div></details>
    <details><summary>معنی رنگ‌ها</summary><div>${legend()}<p>رنگ هر نوار، وضعیت آن سیاق را نشان می‌دهد. طول هر نوار به اندازه تعداد آیات آن سیاق است.</p></div></details>
    <details><summary>تنظیمات و پشتیبان‌گیری</summary><div><p>از دکمه چرخ‌دنده بالای هر صفحه: پوسته (روشن، تیره، کاغذی)، رنگ اصلی، اندازه متن برنامه، قلم مصحف و فاصله سطرها، قاری، تعداد تکرار، و «حفظ فقط بعد از تدبر».</p>
      <p><b>پشتیبان:</b> دکمه «ذخیره پشتیبان» یک فایل می‌سازد؛ در پنجره اشتراک‌گذاری Drive را انتخاب کنید. برای بازیابی، «بازیابی از فایل» را بزنید و فایل را از گوگل‌درایو انتخاب کنید.</p></div></details>
    <details><summary>پرسش‌های رایج</summary><div>
      <p><b>داده‌هایم کجا ذخیره می‌شود؟</b> روی همین دستگاه، و هر وقت پشتیبان بگیرید در گوگل‌درایو خودتان.</p>
      <p><b>چطور به‌روز کنم؟</b> در تنظیمات، «بررسی به‌روزرسانی» را بزنید. برنامه هم روزی یک بار خودش بررسی می‌کند. سیاق‌بندی سوره‌های تازه بدون نصب دوباره دریافت می‌شود و پیشرفت شما حفظ می‌شود؛ برای نسخه تازه برنامه به کافه‌بازار یا دانلود مستقیم هدایت می‌شوید.</p>
      <p><b>بدون اینترنت کار می‌کند؟</b> بله. متن، صفحه‌ها و چهار ترجمه داخل برنامه است. بعد از نصب، قلم عثمان طه و نه ترجمه دیگر خودکار روی گوشی ذخیره می‌شوند. ترتیل هر سوره را هم می‌توانید از تنظیمات ← «بدون اینترنت» یا از صفحه همان سوره، برای هر قاری جدا دانلود کنید. فقط درس‌های تدبر اینترنت لازم دارند.</p>
      <p><b>ترجمه کجاست؟</b> در مرحله تدبر زیر صفحه مصحف، و با زدن روی هر آیه در مصحف. مترجم را در تنظیمات انتخاب کنید.</p>
      <p><b>چرا بعضی سوره‌ها قفل‌اند؟</b> تدبر هر سوره در سطح خودش باز می‌شود تا با پشتوانه درس‌های همان سطح انجام شود. بعد از سطح ۶ همه سوره‌ها باز می‌شوند. مصحف، ثبت سوره‌های حفظ‌شده و مرور همیشه آزادند.</p>
      <p><b>سوره‌هایی را از قبل حفظ هستم؛ چه کنم؟</b> در «نقشه سیاق» سوره را باز کنید و «از قبل حفظ هستم» را بزنید. سوره در شمارنده بالای برنامه حساب می‌شود و مرورهایش در روزهای آینده پخش می‌شود.</p>
      <p><b>شمارنده بالای برنامه چه می‌شمارد؟</b> سوره‌ای «حفظ» حساب می‌شود که همه سیاق‌هایش ثبت شده باشد، و «تدبر» وقتی که مرحله تدبر همه سیاق‌هایش تمام شده باشد.</p>
    </div></details>
    <button id="replay-intro">نمایش دوباره معرفی برنامه</button>
  </div></div>`);
  box.querySelector("#replay-intro").addEventListener("click", () => { box.innerHTML = ""; showIntro(); });
}

// ---------- first-run welcome: name and mobile number, kept on the phone ----------
const normPhone = v => faNum(String(v || "")).replace(/[\s\-()]/g, "").replace(/^\+98|^0098/, "0").replace(/^9(\d{9})$/, "09$1");
const PHONE_OK = v => /^09\d{9}$/.test(v);
function showWelcome(err) {
  const box = document.getElementById("intro");
  box.innerHTML = `<div class="intro" role="dialog" aria-modal="true" aria-label="خوش آمدید" data-welcome>
    <h1>به حفظ تدبری خوش آمدید</h1>
    <p>برای شروع، خودتان را معرفی کنید تا برنامه با نام خودتان همراهتان باشد.</p>
    <form id="wl" class="wform" novalidate>
      <label for="wl-name">نام شما</label><input id="wl-name" type="text" autocomplete="given-name" value="${esc(cfg.name)}" placeholder="مثلاً کمیل" required>
      <label for="wl-phone">شماره همراه</label><input id="wl-phone" type="tel" inputmode="numeric" dir="ltr" autocomplete="tel" value="${esc(cfg.phone)}" placeholder="09xxxxxxxxx" required>
      ${err ? `<p class="werr" role="alert">${err}</p>` : ""}
      <button type="submit">ادامه</button>
      <p class="small" style="opacity:.85">این اطلاعات فقط روی همین گوشی ذخیره می‌شود و برای کسی فرستاده نمی‌شود. بعداً از تنظیمات قابل تغییر است.</p>
    </form></div>`;
  box.querySelector("#wl").addEventListener("submit", e => { e.preventDefault();
    const name = box.querySelector("#wl-name").value.trim(), phone = normPhone(box.querySelector("#wl-phone").value);
    cfg.name = name; cfg.phone = phone;
    if (name.length < 2) return showWelcome("نام خود را بنویسید.");
    if (!PHONE_OK(phone)) return showWelcome("شماره همراه را درست بنویسید؛ ۱۱ رقم که با ۰۹ شروع شود.");
    saveCfg(); box.innerHTML = ""; render();
    if (!cfg.seenIntro) showIntro(); else toast("خوش آمدید " + name);
  });
  setTimeout(() => { const i = box.querySelector(err && err.includes("شماره") ? "#wl-phone" : "#wl-name"); if (i) i.focus(); }, 50);
}

// ---------- first-run intro ----------
const INTRO = [
  ["اول بفهم، بعد حفظ کن", "هر بخش از آیات اول تدبر می‌شود: می‌خوانید، گام‌های معنایی‌اش را پیدا می‌کنید و به چند پرسش جواب می‌دهید."],
  ["واحد حفظ: سیاق", "آیات در قالب سیاق، یعنی مجموعه‌ای با معنای پیوسته، روی صفحه‌های مصحف عثمان طه حفظ می‌شوند. معنا ترتیب آیات را در ذهن نگه می‌دارد."],
  ["هر روز کمی، با مرور", "برنامه هر سیاق را درست پیش از فراموش شدن برای مرور برمی‌گرداند. داشبورد نشان می‌دهد امروز چه باید کرد."],
  ["مسیر شما قدم‌به‌قدم است", "قدم اول «مبانی تدبر» است: فیلم‌های استاد علی صبوحی یا کتاب «آشنایی با دانش تدبر در قرآن کریم». بعد سطح ۱ باز می‌شود و هر سطح، با گذراندن سطح قبل."]
];
function showIntro(i = 0) {
  const box = document.getElementById("intro");
  const [h, p] = INTRO[i];
  box.innerHTML = `<div class="intro" role="dialog" aria-modal="true" aria-label="معرفی برنامه">
    <div class="dots">${INTRO.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>
    <h1>${h}</h1><p>${p}</p>
    <div class="row"><button id="in-next">${i < INTRO.length - 1 ? "بعدی" : passed("intro") ? "شروع" : "شروع از مبانی تدبر"}</button>${i < INTRO.length - 1 ? `<button class="skip" id="in-skip">رد شدن</button>` : ""}</div></div>`;
  const done = () => { cfg.seenIntro = true; saveCfg(); box.innerHTML = ""; render(); };
  box.querySelector("#in-next").addEventListener("click", () => { if (i < INTRO.length - 1) return showIntro(i + 1); done(); if (!passed("intro")) openLevel("intro"); });
  const sk = box.querySelector("#in-skip"); if (sk) sk.addEventListener("click", done);
}

// Android back button: close intro, word bar or an open sheet, else go to the dashboard
window.__back = () => {
  const intro = document.getElementById("intro");
  if (intro.querySelector("[data-welcome]")) return true;     // the welcome form has to be filled in
  if (intro.innerHTML) { cfg.seenIntro = true; saveCfg(); intro.innerHTML = ""; return true; }
  if (document.getElementById("wordbar").innerHTML) { closeWordbar(); return true; }
  const box = document.getElementById("sheet");
  if (box.innerHTML) { stopAudio(); openVid = null; box.innerHTML = ""; ses = null; render(); return true; }
  if (tab !== "home") { tab = "home"; render(); return true; }
  return false;
};

mushafPage = 1;
if (window.__oldWebView) throw new Error("old webview");
applySettings();
render();
if (!myName() || !PHONE_OK(cfg.phone)) showWelcome(); else if (!cfg.seenIntro) showIntro();
if (IS_APP && !qcfLocal() && !cfg.qcfAsked && cfg.qfont === "qcf") qcfStart();
if (IS_APP && !cfg.transAsked) { cfg.transAsked = true; saveCfg(); setTimeout(downloadAllTrans, 1500); }
if (navigator.onLine !== false && (!cfg.lastUpdateCheck || Date.now() - cfg.lastUpdateCheck > 864e5)) setTimeout(() => checkUpdates(true), 4000);
</script>

</body>
</html>
