<title>حفظ تدبری</title>
<meta name="description" content="اپلیکیشن حفظ تدبری قرآن: اول تدبر، بعد حفظ سیاق‌به‌سیاق">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar, full-screen sheets; Quran always shown as Madinah mushaf pages */
:root{
  --acc-l:#1F4E79; --acc-d:#7FB0E3; --accs-l:#E3ECF5; --accs-d:#1B2C3D;
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5E6E68; --line:#DCE3E0;
  --page:#FFFDF7; --page-edge:#E6DDC6;
  --lapis:var(--acc-l); --lapis-soft:var(--accs-l); --on-lapis:#FFFFFF;
  --gold:#A8711A; --gold-soft:#F6EBD6;
  --st-new:#C9D1CE; --st-learn:#3A78C2; --st-solid:#2E8B57; --st-due:#D9822B;
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-q:"Amiri Quran","Amiri","Scheherazade New",serif;
  --q-lh:1.9;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="sepia"]){
  --paper:#0F1715; --surface:#17221F; --ink:#E7EEEB; --muted:#93A39D; --line:#2A3834;
  --page:#141D1A; --page-edge:#2A3834;
  --lapis:var(--acc-d); --lapis-soft:var(--accs-d); --on-lapis:#0F1715;
  --gold:#E0B25E; --gold-soft:#33291A;
  --st-new:#3A4743; --st-learn:#5B98DD; --st-solid:#4DB37A; --st-due:#E89A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1715; --surface:#17221F; --ink:#E7EEEB; --muted:#93A39D; --line:#2A3834;
  --page:#141D1A; --page-edge:#2A3834;
  --lapis:var(--acc-d); --lapis-soft:var(--accs-d); --on-lapis:#0F1715;
  --gold:#E0B25E; --gold-soft:#33291A;
  --st-new:#3A4743; --st-learn:#5B98DD; --st-solid:#4DB37A; --st-due:#E89A4A; color-scheme:dark}
:root[data-theme="sepia"]{
  --paper:#EFE5CD; --surface:#FBF5E7; --ink:#3A2E1F; --muted:#76664F; --line:#E0D3B6;
  --page:#FBF3DF; --page-edge:#D9C9A3;
  --gold:#9A6516; --gold-soft:#EEDDB8; --st-new:#D6CBB2}
:root[data-accent="green"]{--acc-l:#2F6B4F; --acc-d:#7CC4A0; --accs-l:#E2EFE8; --accs-d:#18302A}
:root[data-accent="teal"]{--acc-l:#0F6E73; --acc-d:#6CC9CC; --accs-l:#DDF0F0; --accs-d:#14302F}
:root[data-accent="maroon"]{--acc-l:#7A2E3B; --acc-d:#E39AA6; --accs-l:#F4E3E6; --accs-d:#33191E}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:15px;line-height:1.7}
.app{max-width:480px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;padding-block:16px 96px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--lapis)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{background:var(--lapis);color:var(--on-lapis);border:none}
.hero .muted{color:inherit;opacity:.8}
.hero .q{font-family:"Amiri Quran",var(--f-q);font-size:22px;line-height:2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-main{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.hero .btn-main{background:var(--on-lapis);color:var(--lapis);border-color:var(--on-lapis)}
.btn-ghost{background:transparent}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;flex:none}
.icon-btn svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--st-solid)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
.siyaq-strip{display:flex;gap:3px}
.siyaq-strip span{height:10px;border-radius:3px;background:var(--c)}
.siyaq-strip span.cur{outline:2px solid var(--gold);outline-offset:1px}
.surah-row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;border-radius:0;text-align:right;width:100%}
.surah-row .idx{font-size:12px;color:var(--muted);text-align:center}
.surah-row .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:none;border-radius:0;background:none;padding:9px 2px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-current="page"]{color:var(--lapis);font-weight:700}
.tabs svg{width:22px;height:22px}
.topbar{display:flex;flex-direction:column;gap:8px}
.counters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.chip{font-size:12.5px;padding:2px 10px 2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.mem{--c:var(--st-solid)} .chip.tad{--c:var(--lapis)}
.chip b{font-size:14px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--lapis-soft);color:var(--ink)}
.tag-test{background:var(--gold-soft);color:var(--ink);font-size:12px;padding:6px 10px;border-radius:10px}
.siyaq-item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;width:100%}
.siyaq-item .stripe{align-self:stretch;border-radius:4px;background:var(--c)}
.mine{font-size:12px;color:var(--lapis)}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--paper);z-index:10;display:flex;flex-direction:column;max-width:480px;margin-inline:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{flex:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 16px 0}
.steps span{height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--gold)}
.steplabels{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 16px 0;font-size:11px;color:var(--muted);text-align:center}
.steplabels .on{color:var(--ink);font-weight:700}
.sheet .body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet .body > *,main > *{flex-shrink:0}
.sheet footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.sheet footer button{flex:1}
.subnav{display:flex;gap:6px}
.subnav span{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:8px;background:var(--line);color:var(--muted)}
.subnav span.on{background:var(--lapis-soft);color:var(--ink);font-weight:700}
.help{background:var(--lapis-soft);border-radius:12px;padding:12px 14px;font-size:13px}
.meaning{background:var(--lapis-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.meaning b{font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;font-size:13px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;gap:2px;padding:12px 6px}
.rate small{color:var(--muted);font-size:12px}
select,input[type=text],textarea{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
textarea{resize:vertical}
label{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:12px}
.swatch{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold)}
input[type=range]{width:100%;accent-color:var(--lapis)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--lapis);flex:none}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
details summary::after{content:"+";float:left;color:var(--muted)}
details[open] summary::after{content:"−"}
details > div{padding-bottom:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details ol,details ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;bottom:84px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30}
.intro{position:fixed;inset:0;z-index:40;background:var(--lapis);color:var(--on-lapis);display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:20px;max-width:480px;margin-inline:auto}
.intro h1{font-size:26px}
.intro p{font-size:16px;opacity:.9}
.intro .dots{display:flex;gap:6px}
.intro .dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.intro .dots i.on{opacity:1}
.intro button{background:var(--on-lapis);color:var(--lapis);border:none;font-weight:700}
.intro .skip{background:transparent;color:inherit;opacity:.8}
footer.note{font-size:12px;color:var(--muted);text-align:center}

/* ---- Madinah mushaf page ---- */
.mpage{background:var(--page);border:1px solid var(--page-edge);border-radius:6px;padding:10px 8px 6px;box-shadow:inset 0 0 0 4px var(--page),inset 0 0 0 5px var(--page-edge);color:var(--ink);overflow:hidden}
.mrow{display:grid;grid-template-columns:5px minmax(0,1fr);gap:5px;align-items:stretch}
.mmark{display:flex;flex-direction:column;border-radius:3px;overflow:hidden}
.mmark i{flex:1;background:var(--c)}
.mline{min-width:0;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;direction:rtl;line-height:var(--q-lh);min-height:1.2em}
.mline.center{justify-content:center}
.mline.txt{column-gap:.22em;font-family:var(--f-q)}
.mw,.me{cursor:pointer;border-radius:4px;transition:opacity .15s}
.mw.dim,.me.dim{opacity:.28}
.mw.mask,.me.mask{color:transparent!important;background:var(--line)}
.mw.peek{color:inherit!important;background:var(--gold-soft)}
.mw.sel,.me.sel{background:var(--gold-soft)}
.mw.playing,.me.playing{background:var(--lapis-soft)}
.me.cut{background:var(--gold);color:#fff}
.mhead{border:1px solid var(--page-edge);border-radius:6px;padding:0 1em;background:var(--surface)}
.mhead.txt{font-family:var(--f-ui);font-weight:700;font-size:.62em;padding:.15em 1.4em}
.mfoot{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-ui);margin-top:4px}
.mlabel{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--lapis);display:flex;align-items:center;gap:6px;margin:4px 0 0}
.mlabel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lapis)}
.mnav{display:flex;align-items:center;gap:8px}
.mnav .pg{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.wordbar{position:fixed;inset-inline:0;bottom:64px;max-width:480px;margin-inline:auto;padding:0 12px;z-index:6}
.wordbar .card{box-shadow:0 6px 24px rgba(0,0,0,.18);gap:8px}
/* lessons */
.tr{margin:0;font-size:14.5px;line-height:1.9}
.lesson{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lesson audio{width:100%}
.vframe{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const DATA = /*DATA*/;
const DATA_BASE = "/*DATABASE*/";
const PAGE_BASE = DATA_BASE + "pages/";
const VERSION = "0.3.0";
const IS_APP = !!(window.Android && window.Android.qcfReady);
const BAZAAR_ID = "ir.tadabbor.hefz";
const RATE_URL = IS_APP ? "bazaar://details?id=" + BAZAAR_ID : "https://cafebazaar.ir/app/" + BAZAAR_ID;
const TRANSLATIONS = [["ansarian", "حسین انصاری‌نژاد (انصاریان)"], ["makarem", "ناصر مکارم شیرازی"], ["fooladvand", "محمدمهدی فولادوند"], ["none", "بدون ترجمه"]];
const FA = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const S = Object.fromEntries(DATA.surahs.map(s => [s.n, s]));
const key = (sn, i) => sn + ":" + i;
const STAGES = ["تدبر", "شنیدن", "حفظ", "اتصال", "ثبت"];
const COLORS = {new: "var(--st-new)", learn: "var(--st-learn)", solid: "var(--st-solid)", due: "var(--st-due)"};
const LABELS = {new: "شروع‌نشده", learn: "در حال حفظ", solid: "تثبیت‌شده", due: "نیاز به مرور"};
const RECITERS = [["Abu_Bakr_Ash-Shaatree_64kbps", "ابوبکر الشاطری"], ["Parhizgar_48kbps", "شهریار پرهیزگار"], ["Muhammad_Ayyoub_64kbps", "محمد ایوب"]];
const QFONTS = [["qcf", "عثمان طه (مصحف مدینه)"], ["amiri", "امیری قرآن"], ["sch", "شهرزاد نو"]];
const TEXTFONT = {amiri: '"Amiri Quran","Amiri",serif', sch: '"Scheherazade New","Amiri Quran",serif', qcf: '"Amiri Quran","Amiri",serif'};
const ACCENTS = [["lapis", "لاجوردی", "#1F4E79"], ["green", "سبز", "#2F6B4F"], ["teal", "فیروزه‌ای", "#0F6E73"], ["maroon", "عنابی", "#7A2E3B"]];
const THEMES = [["system", "خودکار"], ["light", "روشن"], ["dark", "تیره"], ["sepia", "کاغذی"]];
const UISIZES = [[0.92, "کوچک"], [1, "معمولی"], [1.1, "بزرگ"]];
const QUESTIONS = [
  "مخاطب این سیاق کیست و در چه حالی است؟",
  "سیاق از کجا شروع می‌کند و مخاطب را به کجا می‌رساند؟",
  "کدام کلمه یا تعبیر محور این آیات است؟",
  "این سیاق امروز از من چه می‌خواهد؟"
];
const QCF_BASE = "https://cdn.jsdelivr.net/npm/quran-qcf4@1.1.0/fonts-woff2/";
const SITE = "https://alisaboohi.com";
const SITE_NAME = {1: "حمد", 94: "انشراح"};
const siteName = n => SITE_NAME[n] || S[n].name;

// ---------- storage ----------
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const DEFAULTS = {theme: "system", accent: "lapis", qfont: "qcf", qlh: 1.9, ui: 1, reciter: "Abu_Bakr_Ash-Shaatree_64kbps", reps: 3, gate: true, trans: "ansarian", seenIntro: false, lastBackup: null, qcfAsked: false};
let cfg = Object.assign({}, DEFAULTS, load("tadabbor-settings", {}));
if (!RECITERS.some(r => r[0] === cfg.reciter)) cfg.reciter = DEFAULTS.reciter;
if (!QFONTS.some(f => f[0] === cfg.qfont)) cfg.qfont = "qcf";
const saveCfg = () => store("tadabbor-settings", cfg);

// Progress lives only on this device and in the user's own backups.
const EMPTY = () => ({streak: 0, lastActive: null, notes: {}, items: {}, watched: {}});
let st = Object.assign(EMPTY(), load("tadabbor-progress", {}));
const save = () => store("tadabbor-progress", st);
// Calendar day number in the phone's local time; reviews are scheduled on these.
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
function markActive() {
  const d = today(); if (st.lastActive === d) return;
  st.streak = st.lastActive === d - 1 ? (st.streak || 0) + 1 : 1; st.lastActive = d; save();
}
const streakNow = () => st.lastActive !== null && st.lastActive >= today() - 1 ? st.streak : 0;

function applySettings() {
  const r = document.documentElement;

// ---------- helpers ----------
function status(k) {
  const it = st.items[k];
  if (it && it.stage >= 5) return it.due <= today() ? "due" : "solid";
  if ((it && it.stage) || st.notes[k]) return "learn";
  return "new";
}
const isMem = k => (st.items[k] || {}).stage >= 5;
const isTad = k => !!(st.notes[k] || {}).done;
const surahAll = (s, f) => s.siyaqs.every(q => f(key(s.n, q.n)));
function surahCounts() {
  let m = 0, t2 = 0;
  DATA.surahs.forEach(s => { if (surahAll(s, isMem)) m++; if (surahAll(s, isTad)) t2++; });
  return {m, t: t2};
}
const siyaqs = () => DATA.surahs.flatMap(s => s.siyaqs.map(q => ({s, q, k: key(s.n, q.n)})));
const ayahCount = q => q.e - q.s + 1;
const range = (a, b) => Array.from({length: b - a + 1}, (_, j) => a + j);
const note = k => st.notes[k] || (st.notes[k] = {done: false, title: "", answers: ["", "", "", ""], cuts: [], stepTitles: {}});
const title = (s, q) => q.title || ((st.notes[key(s.n, q.n)] || {}).title) || ("سیاق " + FA(q.n));
const siyaqOf = (sn, ay) => S[sn].siyaqs.find(q => ay >= q.s && ay <= q.e);
const parseVk = vk => vk.split(":").map(Number);

function stepsOf(s, q) {
  if (q.steps.length) return q.steps.map(x => ({...x, ref: true}));
  const n = st.notes[key(s.n, q.n)];
  if (n && n.cuts.length) {
    const starts = [q.s, ...n.cuts.filter(c => c > q.s && c <= q.e).sort((a, b) => a - b)];
    return starts.map((a, i) => ({s: a, e: (starts[i + 1] || q.e + 1) - 1, t: n.stepTitles[a] || ("گام " + FA(i + 1))}));
  }
  return [{s: q.s, e: q.e, t: title(s, q)}];
}

// ---------- QCF (Uthman Taha) fonts: loaded at runtime from the npm CDN ----------
const fontState = {};
let fontWarned = false;
const qcfLocal = () => { try { return IS_APP && Android.qcfReady(); } catch (e) { return false; } };
const fontFile = name => (qcfLocal() ? Android.qcfBase() : QCF_BASE) + (name === "QCF4_QBSML" ? "QCF4_QBSML.woff2" : name + "_W.woff2");
// Download progress reported by the Android app
const qcf = {state: "idle", done: 0, total: 48};
window.__qcfProgress = (done, total, state) => {
  qcf.done = done; qcf.total = total; qcf.state = state;
  if (state === "done") { Object.keys(fontState).forEach(k => delete fontState[k]); fontWarned = false; toast("مصحف روی گوشی ذخیره شد؛ از این پس بدون اینترنت باز می‌شود"); refresh(); return; }
  if (state === "error") { toast("دریافت مصحف قطع شد؛ اینترنت را بررسی کنید و دوباره تلاش کنید"); refresh(); return; }
  document.querySelectorAll(".qcf-bar i").forEach(i => i.style.width = Math.round(done / total * 100) + "%");
  document.querySelectorAll(".qcf-num").forEach(x => x.textContent = FA(Math.round(done / total * 100)) + "٪");
};
function qcfStart() { try { Android.qcfStart(); qcf.state = "run"; cfg.qcfAsked = true; saveCfg(); } catch (e) {} refresh(); }
function qcfCard(inSettings) {

    ${running || qcf.done ? `<div class="bar qcf-bar"><i style="width:${pc}%;background:var(--gold)"></i></div><span class="small muted qcf-num num">${FA(pc)}٪</span>` : ""}
    ${running ? "" : `<button class="btn-main" id="qcf-go">${qcf.state === "error" ? "تلاش دوباره" : qcf.done ? "ادامه دریافت" : "دریافت و ذخیره"}</button>`}</section>`;
}
function wireQcf(root) {
  const g = root.querySelector("#qcf-go"); if (g) g.addEventListener("click", qcfStart);
  const d = root.querySelector("#qcf-del"); if (d) d.addEventListener("click", () => { try { Android.qcfDelete(); } catch (e) {} qcf.done = 0; qcf.state = "idle"; Object.keys(fontState).forEach(k => delete fontState[k]); toast("مصحف از گوشی پاک شد"); refresh(); });
}
function ensureFonts(names) {
  if (cfg.qfont !== "qcf") return false;
  let ready = true;
  names.forEach(n => {
    if (fontState[n] === "ok") return;
    ready = false;
    if (fontState[n]) return;
    fontState[n] = "loading";
    try {
      const ff = new FontFace(n, `url(${fontFile(n)}) format("woff2")`, {display: "block"});
      ff.load().then(f => { document.fonts.add(f); fontState[n] = "ok"; refresh(); })
        .catch(() => { fontState[n] = "fail"; if (!fontWarned) { fontWarned = true; toast("قلم مصحف دریافت نشد؛ صفحه با قلم جایگزین نمایش داده شد"); } refresh(); });
    } catch (e) { fontState[n] = "fail"; }
  });
  return ready;
}
const pageFonts = pg => [...new Set(pg.lines.flat().map(w => w[2]))];

// Mushaf pages are loaded on demand (604 small files) and kept in memory
const PAGE_CACHE = {}, PAGE_LOADING = {};
function getPage(p) {
  if (PAGE_CACHE[p]) return PAGE_CACHE[p];
  if (!PAGE_LOADING[p]) {
    PAGE_LOADING[p] = fetch(PAGE_BASE + String(p).padStart(3, "0") + ".json").then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => { PAGE_CACHE[p] = j; refresh(); })
      .catch(() => { setTimeout(() => { PAGE_LOADING[p] = null; }, 3000); });
  }
  return null;
}
const pagesFor = (sn, a, b) => { const s = S[sn], set = new Set(); for (let i = a; i <= b; i++) { set.add(s.vp[i - 1]); (s.split[i] || []).forEach(x => set.add(x)); } return [...set].sort((x, y) => x - y); };
const pageOfSurah = sn => S[sn].vp[0];
function vtext(sn, ay) {
  const p = S[sn].vp[ay - 1], pg = getPage(p);
  if (!pg) return "";
  return pg.lines.flat().filter(w => w[0] === "w" && w[3] === key(sn, ay)).map(w => w[4]).join(" ");
}

/* Render mushaf pages.
   opt.state(vk) -> "show" | "dim" | "mask" | "hidden-line"
   opt.wordMask(vk, pos) -> true to mask one word
   opt.only(vk) -> line is shown only if it holds a verse where only() is true
   opt.labels: {vk: label} shown above the line holding that verse's first word
   opt.cut: end markers act as step dividers
   opt.marks: siyaq status bar beside each line */
function renderPages(pnums, opt = {}) {
  const st8 = opt.state || (() => "show");
  return pnums.map(pn => {
    const pg = getPage(pn);
    if (!pg) return `<div class="mpage" style="min-height:40vh;display:grid;place-items:center"><span class="small muted">در حال بارگیری صفحه ${FA(pn)}…</span></div>`;
    const qcf = ensureFonts(pageFonts(pg));
    const out = [];
    let curSura = null;
    pg.lines.forEach((ln, li) => {
      const vks = ln.filter(w => w[0] === "w" || w[0] === "e").map(w => w[3]);
      if (ln[0] && (ln[0][0] === "h" || ln[0][0] === "b")) curSura = +ln[0][3];
      if (opt.only) {
        const keep = vks.length ? vks.some(opt.only) : (curSura && opt.onlySura === curSura && opt.showHead);
        if (!keep) return;
      }
      const labels = opt.labels ? [...new Set(vks)].filter(v => opt.labels[v] && ln.find(w => w[3] === v) === ln.find(w => w[3] === v && w[0] === "w") && firstWordLine(pg, v) === li).map(v => `<div class="mlabel">${esc(opt.labels[v])}</div>`).join("") : "";
      let pos = {};
      const words = ln.map(w => {
        const [t, ch, font, ref, text] = w;
        if (t === "h") return qcf ? `<span class="mhead" style="font-family:'${font}'">${ch}</span>` : `<span class="mhead txt">سوره ${esc(S[+ref] ? S[+ref].name : text)}</span>`;
        if (t === "b") return qcf ? `<span style="font-family:'${font}'">${ch}</span>` : `<span style="font-family:var(--f-q)">${esc(text || "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ")}</span>`;
        const vk = ref, s8 = st8(vk);
        pos[vk] = (pos[vk] || 0) + (t === "w" ? 1 : 0);
        let cls = t === "e" ? "me" : "mw";
        if (s8 === "dim") cls += " dim";
        if (t === "w" && (s8 === "mask" || (opt.wordMask && opt.wordMask(vk, pos[vk])))) cls += " mask";
        if (t === "e" && opt.cut && opt.cut.has(vk)) cls += " cut";
        if (playingVk === vk) cls += " playing";
        const glyph = qcf ? ch : (t === "e" ? `﴿${AR(parseVk(vk)[1])}﴾` : esc(text));
        const style = qcf ? ` style="font-family:'${font}'"` : "";
        return `<span class="${cls}" data-vk="${vk}" data-t="${t}"${style}>${glyph}</span>`;
      }).join("");
      const center = ln.length === 1 && (ln[0][0] === "h" || ln[0][0] === "b");
      const sy = opt.marks ? [...new Set(vks.map(v => { const [a, b] = parseVk(v); const q = siyaqOf(a, b); return q ? key(a, q.n) : null; }).filter(Boolean))] : [];
      const mark = opt.marks ? `<span class="mmark">${sy.map(k => `<i style="--c:${COLORS[status(k)]}"></i>`).join("")}</span>` : "<span></span>";
      out.push(`${labels}<div class="mrow">${mark}<div class="mline${center ? " center" : ""}${qcf ? "" : " txt"}">${words}</div></div>`);
    });
    return `<div class="mpage" data-p="${pn}">${out.join("")}<div class="mfoot num">${FA(pg.p)}</div></div>`;
  }).join("");
}
function firstWordLine(pg, vk) { return pg.lines.findIndex(l => l.some(w => w[3] === vk && w[0] === "w")); }

// Fit every page line to the page width (the mushaf is a fixed 15-line layout)
function fitPages(root) {
  (root || document).querySelectorAll(".mpage").forEach(p => {
    const lines = [...p.querySelectorAll(".mline:not(.center)")];
    if (!lines.length) return;
    const base = 20; p.style.fontSize = base + "px";
    const avail = lines[0].clientWidth;
    let maxW = 0;
    lines.forEach(l => {
      const kids = [...l.children]; if (!kids.length) return;
      const gap = parseFloat(getComputedStyle(l).columnGap) || 0;
      const w = kids.reduce((a, c) => a + c.getBoundingClientRect().width, 0) + gap * (kids.length - 1);
      maxW = Math.max(maxW, w);
    });
    if (maxW > 0 && avail > 0) p.style.fontSize = Math.min(base * avail / maxW * 0.97, 44) + "px";
  });
}

function play(sn, i, reps = 1) { playQueue([...Array(reps)].map(() => [sn, i])); }
function playQueue(list) {
  try { if (audio) audio.pause(); } catch (e) {}
  queue = list.slice();
  const next = () => {
    const it = queue.shift(); if (!it) { setPlaying(null); return; }
    setPlaying(key(it[0], it[1]));
    audio = new Audio(audioUrl(it[0], it[1]));
    audio.onended = next;
    audio.play().catch(() => { queue = []; setPlaying(null); toast("پخش صوت ممکن نشد؛ اینترنت را بررسی کنید"); });
  };
  next();
}

function surahProgress(sn) {

function levelProgress(L) {

function parseLessons(posts, n) {
  const nm = n ? siteName(n) : "";
  return posts.filter(p => !nm || (p.title && p.title.rendered || "").includes(nm)).map(p => {
    const html = (p.content && p.content.rendered) || "";
    const vid = (html.match(/aparat\.com\/video\/video\/embed\/videohash\/([A-Za-z0-9]+)/) || [])[1] || null;
    const mp3 = (html.match(/https?:\/\/[^"'\s<>]+?\.mp3/i) || [])[0] || null;
    const tmp = document.createElement("div"); tmp.innerHTML = p.title.rendered;
    return {id: p.id, title: tmp.textContent.trim(), link: p.link, date: (p.date || "").slice(0, 10), vid, mp3};
  }).sort((a, b) => a.date < b.date ? -1 : 1);
}
async function fetchLessons(n) {
  const url = `${SITE}/wp-json/wp/v2/posts?search=${encodeURIComponent("سوره " + siteName(n))}&per_page=40&_fields=id,title,link,content,date`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const items = parseLessons(await r.json(), n);
  store("tadabbor-lessons-" + n, {at: Date.now(), items});
  return items;
}
function openLessons(n, items, state) {

  const body = !items ? (state === "error"
      ? `<div class="card"><p>اتصال به سایت ممکن نشد. اینترنت را بررسی کنید یا صفحه سوره را در سایت باز کنید.</p><div class="row"><button id="retry" class="btn-main">تلاش دوباره</button><a href="${surahPageUrl(n)}" target="_blank" rel="noopener">صفحه سوره در سایت</a></div></div>`
      : `<p class="muted">در حال دریافت درس‌ها از سایت…</p>`)
    : items.length ? items.map((x, i) => `<div class="lesson"><label class="switch"><b style="font-size:14px">${esc(x.title)}</b><input type="checkbox" data-watch="${x.id}" ${(st.watched || {})[x.id] ? "checked" : ""} aria-label="دیده شد"></label><span class="small muted num">${esc(x.date)}</span>
        ${x.vid ? (openVid === x.id ? `<div class="vframe"><iframe src="https://www.aparat.com/video/video/embed/videohash/${x.vid}/vt/frame" allowfullscreen allow="autoplay; fullscreen" title="${esc(x.title)}"></iframe></div>` : `<button data-vid="${x.id}">🎬 دیدن فیلم</button>`) : ""}
        ${x.mp3 ? `<audio controls preload="none" src="${esc(x.mp3)}"></audio>` : ""}
        <div class="row small">${x.vid ? `<a href="https://www.aparat.com/v/${x.vid}" target="_blank" rel="noopener">فیلم در آپارات</a>` : ""}<a href="${esc(x.link)}" target="_blank" rel="noopener">صفحه درس در سایت</a></div></div>`).join("")
      : `<div class="card"><p>درسی برای این سوره در سایت پیدا نشد.</p><a href="${surahPageUrl(n)}" target="_blank" rel="noopener">صفحه سوره در سایت</a></div>`;
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="درس‌های سوره ${s.name}">
    <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>درس‌های تدبر سوره ${s.name}</h2><button class="icon-btn btn-ghost" id="reload" aria-label="به‌روزرسانی">⟳</button></header>
    <div class="body"><p class="small muted">از سایت استاد علی صبوحی طسوجی · <a href="${surahPageUrl(n)}" target="_blank" rel="noopener">صفحه سوره</a></p>${body}</div></div>`);
  box.querySelectorAll("[data-vid]").forEach(b => b.addEventListener("click", () => { openVid = +b.dataset.vid; openLessons(n, items); }));
  box.querySelectorAll("[data-watch]").forEach(c => c.addEventListener("change", () => { st.watched = st.watched || {}; st.watched[c.dataset.watch] = c.checked; save(); }));
  const go = () => { openLessons(n, null, "loading"); fetchLessons(n).then(it => openLessons(n, it)).catch(() => openLessons(n, null, "error")); };
  box.querySelector("#reload").addEventListener("click", go);
  const rt = box.querySelector("#retry"); if (rt) rt.addEventListener("click", go);
  if (!items && state !== "error" && state !== "loading") go();
}
let openVid = null;

// ---------- generic sheet ----------

// ---------- session ----------
let ses;
const HELP = [
  "تدبر پیش از حفظ: اول آیات را آرام بخوانید، بعد خودتان گام‌های معنایی سیاق را پیدا کنید و به چند پرسش پاسخ دهید. همین گام‌ها بعداً سرنخ حفظ می‌شوند.",
  "شنیدن: کل سیاق را با ترتیل بشنوید. آیه‌ای که پخش می‌شود روی صفحه رنگی می‌شود. تعداد تکرار را می‌توانید انتخاب کنید.",
  "حفظ گام‌به‌گام: هر گام معنایی جدا حفظ می‌شود. کلمات در چهار سطح محو می‌شوند؛ در سطح «معنا» فقط عنوان گام می‌ماند. آخر هر گام، کل گام را یکجا از حفظ می‌خوانید.",
  "اتصال: کل سیاق را از حفظ بخوانید. نقشه معنا (عنوان گام‌ها) بالای سطرها کمک می‌کند ترتیب را از روی معنا به یاد بیاورید. روی هر آیه بزنید تا دیده شود.",
  "ثبت: صادقانه بگویید چطور خواندید. «سخت» سیاق را به حفظ برمی‌گرداند؛ «خوب» و «آسان» مرور بعدی را دورتر می‌برند."
];
function startSession(k, mode) {
  const [sn, qn] = k.split(":").map(Number);
  const s = S[sn], q = s.siyaqs[qn - 1];
  const it = st.items[k] || {stage: 0};
  ses = {k, s, q, mode, step: mode === "review" ? 3 : Math.min(it.stage, 4), sub: 0, si: 0, ay: q.s, level: 0, recap: false, shown: {}, map: mode !== "review", recall: false, help: false, cmp: false};
  if (ses.step === 2) ses.ay = stepsOf(s, q)[0].s;
  drawSession();
}
// Mushaf lines for a verse range of the session's surah
function sesPages(a, b, opt = {}) {
  const {s} = ses;
  const inRange = vk => { const [x, y] = parseVk(vk); return x === s.n && y >= a && y <= b; };
  return renderPages(pagesFor(s.n, a, b), Object.assign({only: inRange, state: vk => inRange(vk) ? "show" : "dim"}, opt, {state: opt.state ? (vk => inRange(vk) ? opt.state(vk) : "dim") : (vk => inRange(vk) ? "show" : "dim")}));
}
function drawSession() {
  lastDraw = redraw;
  const {s, q, step} = ses;
  const content = [stepTadabbur, stepListen, stepMemorize, stepConnect, stepRate][step]();
  const box = sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="جلسه تدبر و حفظ">
  <header><button class="icon-btn btn-ghost" data-close aria-label="بستن">✕</button><h2>${s.name} · ${esc(title(s, q))}</h2><button class="icon-btn btn-ghost" id="shelp" aria-label="راهنمای این مرحله" aria-expanded="${ses.help}">${ICON_HELP}</button></header>
  <div class="steps">${STAGES.map((_, i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>
  <div class="steplabels">${STAGES.map((l, i) => `<span class="${i === step ? "on" : ""}">${l}</span>`).join("")}</div>
  <div class="body">${ses.help ? `<div class="help">${HELP[step]}</div>` : ""}${content.body}</div>
  <footer>${content.foot}</footer></div>`);
  box.querySelector("#shelp").addEventListener("click", () => { ses.help = !ses.help; redraw(); });
  content.wire && content.wire(box);
  fitPages(box);
  const b = box.querySelector(".body"); if (ses.keepScroll) { b.scrollTop = ses.keepScroll; ses.keepScroll = 0; }
}
function redraw() { const b = document.querySelector(".sheet .body"); if (ses) { ses.keepScroll = b ? b.scrollTop : 0; drawSession(); } }
function advance() {
  stopAudio();
  const it = st.items[ses.k] || (st.items[ses.k] = {stage: 0});
  if (ses.mode === "learn") it.stage = Math.max(it.stage || 0, ses.step + 1);
  save(); ses.step++; ses.sub = 0; ses.recap = false; ses.shown = {}; ses.level = 0; ses.si = 0;
  if (ses.step === 2) ses.ay = stepsOf(ses.s, ses.q)[0].s;
  drawSession();
}

// Stage 1: tadabbur, in three parts
function stepTadabbur() {
  const {s, q} = ses, n = note(ses.k);
  const sub = ses.sub;
  const nav = `<div class="subnav">${["خواندن", "کشف گام‌ها", "پرسش‌ها"].map((l, i) => `<span class="${i === sub ? "on" : ""}">${FA(i + 1)}. ${l}</span>`).join("")}</div>`;
  if (sub === 0) return {
    body: `${nav}
    <div class="card"><div class="small muted">سیاق ${FA(q.n)} از ${FA(s.siyaqs.length)} سوره ${s.name} · آیات ${FA(q.s)} تا ${FA(q.e)}</div>${strip(s, q.n)}
    ${s.dir ? `<p class="small"><b>جهت هدایتی سوره (آزمایشی):</b> ${esc(s.dir)}</p>` : ""}
    <p class="small">آیات را آرام و با توجه بخوانید یا بشنوید. هنوز قصد حفظ نداشته باشید؛ فقط بپرسید: این آیات درباره چیست و چه می‌خواهد؟</p>
    <div class="row"><button id="listen">▶ شنیدن کل سیاق</button><button id="les">🎬 درس استاد درباره این سوره</button></div></div>
    ${sesPages(q.s, q.e)}
    ${transBlock(s.n, q.s, q.e)}`,
    foot: `${cfg.gate ? "" : `<button class="btn-ghost" id="skip">رد شدن از تدبر</button>`}<button class="btn-main" id="next">خواندم؛ برو به کشف گام‌ها</button>`,
    wire: b => {
      b.querySelector("#listen").addEventListener("click", () => playQueue(range(q.s, q.e).map(i => [s.n, i])));
      b.querySelector("#les").addEventListener("click", () => { stopAudio(); const back = () => drawSession(); openLessons(s.n); lastDraw = () => {}; const c = document.querySelector("#sheet [data-close]"); c.replaceWith(c.cloneNode(true)); document.querySelector("#sheet [data-close]").addEventListener("click", back); });
      b.querySelector("#next").addEventListener("click", () => { ses.sub = 1; drawSession(); });
      const sk = b.querySelector("#skip"); if (sk) sk.addEventListener("click", () => { n.done = true; save(); advance(); });
    }
  };
  if (sub === 1) {
    const cuts = new Set(n.cuts.filter(c => c > q.s && c <= q.e).map(c => key(s.n, c - 1)));
    const segs = [q.s, ...n.cuts.filter(c => c > q.s && c <= q.e).sort((a, b) => a - b)];
    const refStarts = q.steps.map(x => x.s).slice(1), myStarts = segs.slice(1);
    const hits = refStarts.filter(x => myStarts.includes(x)).length;
    return {
      body: `${nav}
      <div class="card"><h3>این سیاق از چند گام معنایی ساخته شده؟</h3>
      <p class="small">هر جا حس کردید معنا به مرحله تازه‌ای رفت، روی <b>نشانه پایان آیه</b> بزنید تا گام تازه از آیه بعد شروع شود. نشانه‌های طلایی مرز گام‌های شماست. بعد برای هر گام یک عنوان کوتاه بنویسید.</p></div>
      <div id="cutpages">${sesPages(q.s, q.e, {cut: cuts})}</div>
      <div class="card"><h3>گام‌های من</h3>
      ${segs.map((a, i) => { const e = (segs[i + 1] || q.e + 1) - 1; return `<div class="field"><label for="st-${a}">گام ${FA(i + 1)} · آیات ${FA(a)}${e > a ? " تا " + FA(e) : ""}</label><input type="text" id="st-${a}" data-stitle="${a}" value="${esc(n.stepTitles[a] || "")}" placeholder="عنوان کوتاه این گام"></div>`; }).join("")}</div>
      ${q.steps.length ? `<div class="card"><div class="row between"><h3>مقایسه با گام‌های مرجع</h3><button class="small" id="cmp" aria-expanded="${ses.cmp}">${ses.cmp ? "پنهان کن" : "نشانم بده"}</button></div>
        ${ses.cmp ? `<p class="small">شما ${FA(hits)} مرز از ${FA(refStarts.length)} مرز مرجع را پیدا کردید.</p><ol class="small" style="margin:0;padding-inline-start:20px">${q.steps.map(x => `<li>${esc(x.t)} <span class="muted">(آیات ${FA(x.s)}${x.e > x.s ? " تا " + FA(x.e) : ""})</span></li>`).join("")}</ol><p class="small muted">در حفظ، گام‌های مرجع مبنا هستند و برداشت شما کنارش نگه داشته می‌شود.</p>` : `<p class="small muted">بعد از تقسیم خودتان، گام‌های مرجع را ببینید و مقایسه کنید.</p>`}</div>` : `<p class="small muted">برای این سیاق هنوز گام مرجع نداریم؛ گام‌های خودتان مبنای حفظ می‌شود.</p>`}`,
      foot: `<button id="back">قبلی</button><button class="btn-main" id="next">برو به پرسش‌ها</button>`,
      wire: b => {
        b.querySelector("#cutpages").addEventListener("click", e => {
          const m = e.target.closest('[data-t="e"]'); if (!m) return;
          const [x, y] = parseVk(m.dataset.vk); if (x !== s.n || y < q.s || y >= q.e) return;
          const a = y + 1; n.cuts = n.cuts.includes(a) ? n.cuts.filter(c => c !== a) : [...n.cuts, a]; save(); redraw();
        });
        b.querySelectorAll("[data-stitle]").forEach(x => x.addEventListener("input", () => { n.stepTitles[x.dataset.stitle] = x.value; save(); }));
        const c = b.querySelector("#cmp"); if (c) c.addEventListener("click", () => { ses.cmp = !ses.cmp; redraw(); });
        b.querySelector("#back").addEventListener("click", () => { ses.sub = 0; drawSession(); });
        b.querySelector("#next").addEventListener("click", () => { ses.sub = 2; drawSession(); });
      }
    };
  }
  return {
    body: `${nav}
    <div class="card"><h3>پرسش‌های تدبری</h3><p class="small">کوتاه و به زبان خودتان بنویسید. پاسخ درست و غلط ندارد؛ هدف، ارتباط گرفتن با آیات پیش از حفظ است.</p></div>
    ${QUESTIONS.map((qq, i) => `<div class="field"><label for="qa-${i}">${FA(i + 1)}. ${qq}</label><textarea id="qa-${i}" data-qa="${i}" rows="2">${esc(n.answers[i] || "")}</textarea></div>`).join("")}

      });
    }
  };
}

}

const LEVELS = [["full", "کامل"], ["half", "نیمه"], ["first", "سرنخ"], ["none", "معنا"]];
function stepMemorize() {
  const {s, q} = ses, steps = stepsOf(s, q), g = steps[ses.si];
  const head = `<div class="meaning"><span class="small muted">گام ${FA(ses.si + 1)} از ${FA(steps.length)} · آیات ${FA(g.s)}${g.e > g.s ? " تا " + FA(g.e) : ""}</span><b>${esc(g.t)}</b></div>`;
  const ayOf = vk => parseVk(vk)[1];
  if (ses.recap) {
    const ay = range(g.s, g.e), opened = ay.filter(i => ses.shown[i]).length;
    return {body: `${head}
      <div class="card"><h3>کل این گام را یکجا از حفظ بخوانید</h3><p class="small">بعد روی هر آیه بزنید تا متن را ببینید و خودتان را بسنجید. <span class="num">(${FA(opened)} از ${FA(ay.length)})</span></p></div>
      <div id="mpages">${sesPages(g.s, g.e, {state: vk => ses.shown[ayOf(vk)] ? "show" : "mask"})}</div>`,
      foot: `<button id="again">تمرین دوباره گام</button><button class="btn-main" id="go" ${opened < ay.length ? "disabled" : ""}>${ses.si < steps.length - 1 ? "گام بعد" : "برو به اتصال"}</button>`,
      wire: b => {
        b.querySelector("#mpages").addEventListener("click", e => { const w = e.target.closest("[data-vk]"); if (!w) return; const y = ayOf(w.dataset.vk); if (y >= g.s && y <= g.e) { ses.shown[y] = 1; redraw(); } });
        b.querySelector("#again").addEventListener("click", () => { ses.recap = false; ses.ay = g.s; ses.level = 0; ses.shown = {}; drawSession(); });
        b.querySelector("#go").addEventListener("click", () => {
          if (ses.si < steps.length - 1) { ses.si++; ses.ay = steps[ses.si].s; ses.level = 0; ses.recap = false; ses.shown = {}; drawSession(); } else advance();
        });
      }};
  }
  const lv = LEVELS[ses.level][0];
  const wordMask = (vk, pos) => {
    const y = ayOf(vk); if (y !== ses.ay || parseVk(vk)[0] !== s.n) return false;
    if (lv === "half") return pos % 2 === 0;
    if (lv === "first") return pos > 1;
    if (lv === "none") return true;
    return false;
  };
  return {body: `${head}
    <div class="card"><div class="row between"><span class="small muted">سطح محو کلمات</span><span class="small num">آیه ${FA(ses.ay)}</span></div>
    <div class="seg" role="group" aria-label="سطح محو">${LEVELS.map((l, i) => `<button data-lv="${i}" aria-pressed="${i === ses.level}">${l[1]}</button>`).join("")}</div>
    ${ses.level === 3 ? `<p class="small">فقط معنای گام مانده؛ آیه را از روی معنا به یاد بیاورید. روی کلمه پنهان بزنید تا دیده شود.</p>` : `<p class="small muted">آیه‌های بعدی این گام پنهان‌اند. روی کلمه پنهان بزنید تا دیده شود.</p>`}</div>
    <div id="mpages">${sesPages(g.s, g.e, {state: vk => { const y = ayOf(vk); return y < ses.ay ? "show" : y === ses.ay ? "show" : "mask"; }, wordMask})}</div>
    <button id="hear">▶ شنیدن آیه ${FA(ses.ay)} (${FA(cfg.reps)} بار)</button>`,
    foot: `<button id="prev" ${ses.ay === g.s && ses.level === 0 ? "disabled" : ""}>قبلی</button><button class="btn-main" id="nextay">${ses.level < 3 ? "سطح بعد" : ses.ay < g.e ? "آیه بعد" : "مرور کل گام"}</button>`,
    wire: b => {
      b.querySelectorAll("[data-lv]").forEach(x => x.addEventListener("click", () => { ses.level = +x.dataset.lv; redraw(); }));
      b.querySelector("#mpages").addEventListener("click", e => { const w = e.target.closest(".mw.mask"); if (w && ayOf(w.dataset.vk) === ses.ay) w.classList.add("peek"); });
      b.querySelector("#hear").addEventListener("click", () => play(s.n, ses.ay, cfg.reps));
      b.querySelector("#prev").addEventListener("click", () => { if (ses.level > 0) ses.level--; else { ses.ay--; ses.level = 0; } redraw(); });
      b.querySelector("#nextay").addEventListener("click", () => {
        if (ses.level < 3) ses.level++; else if (ses.ay < g.e) { ses.ay++; ses.level = 0; } else { ses.recap = true; ses.shown = {}; }
        redraw();
      });
    }};
}

function stepConnect() {
  const {s, q} = ses, steps = stepsOf(s, q), n = st.notes[ses.k];
  const total = ayahCount(q), opened = range(q.s, q.e).filter(i => ses.shown[i]).length;
  const labels = ses.map ? Object.fromEntries(steps.map(g => [key(s.n, g.s), g.t])) : null;
  const recallCard = ses.mode === "review" ? `<div class="card"><h3>اول معنا را به یاد بیاورید</h3>
    <p class="small">پیش از خواندن، در ذهن مرور کنید: این سیاق درباره چیست و از چه گام‌هایی می‌گذرد؟</p>
    ${ses.recall ? `<div class="meaning"><b>${esc(title(s, q))}</b>${n && n.title && q.title ? `<span class="mine">برداشت من: ${esc(n.title)}</span>` : ""}</div><ol class="small" style="margin:0;padding-inline-start:20px">${steps.map(g => `<li>${esc(g.t)}</li>`).join("")}</ol>` : `<button id="recall">نقشه معنا را نشانم بده</button>`}</div>` : "";
  return {body: `${recallCard}
    <div class="card"><div class="small muted">خواندن کل سیاق از حفظ</div>
    <p class="small">هر آیه را از حفظ بخوانید، بعد روی آن بزنید تا دیده شود.</p>
    <label class="switch small"><span>نمایش نقشه معنا بالای سطرها</span><input type="checkbox" id="mapsw" ${ses.map ? "checked" : ""}></label>
    <div class="small muted num">بررسی‌شده: ${FA(opened)} از ${FA(total)}</div></div>
    <div id="cpages">${sesPages(q.s, q.e, {labels, state: vk => ses.shown[parseVk(vk)[1]] ? "show" : "mask"})}</div>`,
    foot: `<button class="btn-main" id="next" ${opened < total ? "disabled" : ""}>${opened < total ? "همه آیات را بررسی کنید" : "ثبت نتیجه"}</button>`,
    wire: b => {
      b.querySelector("#cpages").addEventListener("click", e => { const w = e.target.closest("[data-vk]"); if (!w) return; const [x, y] = parseVk(w.dataset.vk); if (x === s.n && y >= q.s && y <= q.e) { ses.shown[y] = 1; redraw(); } });
      const r = b.querySelector("#recall"); if (r) r.addEventListener("click", () => { ses.recall = true; ses.map = true; redraw(); });
      b.querySelector("#mapsw").addEventListener("change", e => { ses.map = e.target.checked; redraw(); });
      b.querySelector("#next").addEventListener("click", advance);
    }};
}

function stepRate() {
  const it = st.items[ses.k] || {}, n = note(ses.k);
  const ivl = it.ivl || 1;
  const opts = [["hard", "سخت", 1], ["good", "خوب", Math.max(2, Math.round(ivl * 2))], ["easy", "آسان", Math.max(4, Math.round(ivl * 3))]];
  return {body: `
    <div class="card"><h2>این سیاق را چطور خواندید؟</h2>
    <p class="small muted">پاسخ شما زمان مرور بعدی را تعیین می‌کند. «سخت» سیاق را به مرحله حفظ برمی‌گرداند.</p></div>
    <div class="rate">${opts.map(([k, l, d]) => `<button data-rate="${k}" data-days="${d}"><b>${l}</b><small class="num">${k === "hard" ? "بازگشت به حفظ" : "مرور " + FA(d) + " روز بعد"}</small></button>`).join("")}</div>
    <div class="field"><label for="insight">نکته تازه‌ای در این ${ses.mode === "review" ? "مرور" : "جلسه"} فهمیدید؟ (اختیاری)</label><textarea id="insight" rows="2" placeholder="برداشت تازه شما کنار تدبرهای این سیاق ذخیره می‌شود"></textarea></div>`,
    foot: `<button class="btn-ghost" data-close>بعداً</button>`,
    wire: b => {
      b.querySelectorAll("[data-rate]").forEach(x => x.addEventListener("click", () => {
        const ins = b.querySelector("#insight").value.trim();
        if (ins) { n.extra = n.extra || []; n.extra.push({day: today(), text: ins}); }
        const item = st.items[ses.k] || (st.items[ses.k] = {});
        if (x.dataset.rate === "hard") { item.stage = 2; delete item.due; toast("سیاق به مرحله حفظ برگشت"); }
        else { item.stage = 5; item.ivl = +x.dataset.days; item.due = today() + item.ivl; toast("ثبت شد · مرور بعدی " + FA(item.ivl) + " روز دیگر"); }
        markActive(); save(); ses = null; document.getElementById("sheet").innerHTML = ""; render();
      }));
    }};
}

// ---------- backup (Google Drive via the share sheet) ----------
const backupName = () => `tadabbor-hefz-backup-${new Date().toISOString().slice(0, 10)}.json`;
const backupJson = () => JSON.stringify({app: "tadabbor-hefz", v: 1, at: new Date().toISOString(), progress: st, settings: cfg}, null, 1);
async function doBackup() {
  const json = backupJson(), name = backupName();
  const done = () => { cfg.lastBackup = Date.now(); saveCfg(); };
  if (window.Android && Android.shareFile) { Android.shareFile(name, json); done(); return; }
  try {
    const file = new File([json], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "پشتیبان حفظ تدبری"}); done(); toast("پشتیبان فرستاده شد"); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], {type: "application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); done(); toast("فایل پشتیبان ذخیره شد؛ آن را در گوگل‌درایو بارگذاری کنید");
  } catch (e) { toast("ذخیره فایل ممکن نشد"); }
}
function restoreFrom(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "tadabbor-hefz" || !d.progress) throw new Error("bad");
      st = Object.assign(EMPTY(), d.progress); delete st.day; save();
      cfg = Object.assign({}, DEFAULTS, d.settings || {}, {seenIntro: true}); saveCfg(); applySettings();
      toast("بازیابی انجام شد · " + (d.at || "").slice(0, 10)); openSettings();
    } catch (e) { toast("این فایل پشتیبان حفظ تدبری نیست"); }
  };
  r.readAsText(file);
}

    </ol><p>همه مراحل روی صفحه‌های مصحف مدینه انجام می‌شود؛ فقط سطرهای همان سیاق نمایش داده می‌شود و آیه‌های بیرون از سیاق کم‌رنگ‌اند.</p></div></details>

      <p><b>۱. خواندن:</b> آیات را بی‌عجله بخوانید یا بشنوید. اگر خواستید، درس استاد درباره همان سوره را ببینید یا بشنوید.</p>
      <p><b>۲. کشف گام‌ها:</b> هر جا حس کردید معنا وارد مرحله تازه‌ای شد، روی نشانه پایان آیه بزنید. نشانه طلایی یعنی گام تازه از آیه بعد شروع می‌شود. برای هر گام عنوان کوتاهی بنویسید و بعد تقسیم خودتان را با گام‌های مرجع مقایسه کنید.</p>
      <p><b>۳. پرسش‌ها:</b> به چهار پرسش کوتاه جواب دهید و عنوان سیاق را به زبان خودتان بنویسید.</p>
      <p>همه این‌ها ذخیره می‌شوند و در حفظ و مرور به‌عنوان سرنخ معنایی به کار می‌روند.</p>
    </div></details>
    <details><summary>سطح‌های محو کلمات</summary><div><ul>
      <li><b>کامل:</b> همه کلمات دیده می‌شوند.</li>
      <li><b>نیمه:</b> یک کلمه در میان پنهان است.</li>
      <li><b>سرنخ:</b> فقط کلمه اول آیه دیده می‌شود.</li>
      <li><b>معنا:</b> همه کلمات پنهان‌اند و فقط عنوان گام می‌ماند؛ آیه را از روی معنا به یاد می‌آورید.</li>
    </ul><p>روی هر کلمه پنهان بزنید تا دیده شود.</p></div></details>
    <details><summary>مرور و دکمه‌های سخت، خوب، آسان</summary><div>
      <p>هر مرور با «یادآوری معنا» شروع می‌شود: اول عنوان و گام‌های سیاق را در ذهن مرور می‌کنید، بعد آیات را از حفظ می‌خوانید.</p>
      <ul><li><b>سخت:</b> سیاق به مرحله حفظ برمی‌گردد.</li><li><b>خوب:</b> مرور بعدی حدود دو برابر فاصله قبلی.</li><li><b>آسان:</b> مرور بعدی حدود سه برابر فاصله قبلی.</li></ul>
    </div></details>
    <details><summary>مصحف و درس‌ها</summary><div>
      <p><b>مصحف:</b> صفحه‌های مصحف مدینه به خط عثمان طه. با کشیدن صفحه ورق بزنید و روی هر کلمه بزنید تا آیه، سیاق و ترتیل آن را ببینید.</p>
      <p><b>درس‌ها:</b> فیلم (آپارات) و صوت جلسه‌های تدبر استاد صبوحی برای هر سوره، مستقیم از سایت alisaboohi.com. این بخش به اینترنت نیاز دارد.</p>
    </div></details>
    <details><summary>معنی رنگ‌ها</summary><div>${legend()}<p>رنگ هر نوار، وضعیت آن سیاق را نشان می‌دهد. طول هر نوار به اندازه تعداد آیات آن سیاق است.</p></div></details>
    <details><summary>تنظیمات و پشتیبان‌گیری</summary><div><p>از دکمه چرخ‌دنده بالای هر صفحه: پوسته (روشن، تیره، کاغذی)، رنگ اصلی، اندازه متن برنامه، قلم مصحف و فاصله سطرها، قاری، تعداد تکرار، و «حفظ فقط بعد از تدبر».</p>
      <p><b>پشتیبان:</b> دکمه «ذخیره پشتیبان» یک فایل می‌سازد؛ در پنجره اشتراک‌گذاری Drive را انتخاب کنید. برای بازیابی، «بازیابی از فایل» را بزنید و فایل را از گوگل‌درایو انتخاب کنید.</p></div></details>
    <details><summary>پرسش‌های رایج</summary><div>
      <p><b>داده‌هایم کجا ذخیره می‌شود؟</b> روی همین دستگاه، و هر وقت پشتیبان بگیرید در گوگل‌درایو خودتان.</p>
      <p><b>بدون اینترنت کار می‌کند؟</b> بله. متن، صفحه‌ها و ترجمه داخل برنامه است و قلم عثمان طه بعد از نصب یک بار روی گوشی ذخیره می‌شود. فقط ترتیل و درس‌ها اینترنت لازم دارند.</p>
      <p><b>ترجمه کجاست؟</b> در مرحله تدبر زیر صفحه مصحف، و با زدن روی هر آیه در مصحف. مترجم را در تنظیمات انتخاب کنید.</p>
      <p><b>سوره‌هایی را از قبل حفظ هستم؛ چه کنم؟</b> در «نقشه سیاق» سوره را باز کنید و «از قبل حفظ هستم» را بزنید. سوره در شمارنده بالای برنامه حساب می‌شود و مرورهایش در روزهای آینده پخش می‌شود.</p>
      <p><b>شمارنده بالای برنامه چه می‌شمارد؟</b> سوره‌ای «حفظ» حساب می‌شود که همه سیاق‌هایش ثبت شده باشد، و «تدبر» وقتی که مرحله تدبر همه سیاق‌هایش تمام شده باشد.</p>
    </div></details>
    <button id="replay-intro">نمایش دوباره معرفی برنامه</button>
  </div></div>`);
  box.querySelector("#replay-intro").addEventListener("click", () => { box.innerHTML = ""; showIntro(); });
}

// ---------- first-run intro ----------
const INTRO = [
  ["اول بفهم، بعد حفظ کن", "هر بخش از آیات اول تدبر می‌شود: می‌خوانید، گام‌های معنایی‌اش را پیدا می‌کنید و به چند پرسش جواب می‌دهید."],
  ["واحد حفظ: سیاق", "آیات در قالب سیاق، یعنی مجموعه‌ای با معنای پیوسته، روی صفحه‌های مصحف مدینه حفظ می‌شوند. معنا ترتیب آیات را در ذهن نگه می‌دارد."],
  ["هر روز کمی، با مرور", "برنامه هر سیاق را درست پیش از فراموش شدن برای مرور برمی‌گرداند. داشبورد نشان می‌دهد امروز چه باید کرد."]
];
function showIntro(i = 0) {
  const box = document.getElementById("intro");
  const [h, p] = INTRO[i];
  box.innerHTML = `<div class="intro" role="dialog" aria-modal="true" aria-label="معرفی برنامه">
    <div class="dots">${INTRO.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>
    <h1>${h}</h1><p>${p}</p>
    <div class="row"><button id="in-next">${i < INTRO.length - 1 ? "بعدی" : "شروع"}</button>${i < INTRO.length - 1 ? `<button class="skip" id="in-skip">رد شدن</button>` : ""}</div></div>`;
  const done = () => { cfg.seenIntro = true; saveCfg(); box.innerHTML = ""; render(); };
  box.querySelector("#in-next").addEventListener("click", () => i < INTRO.length - 1 ? showIntro(i + 1) : done());
  const sk = box.querySelector("#in-skip"); if (sk) sk.addEventListener("click", done);
}

// Android back button: close intro, word bar or an open sheet, else go to the dashboard
window.__back = () => {
  const intro = document.getElementById("intro");
  if (intro.innerHTML) { cfg.seenIntro = true; saveCfg(); intro.innerHTML = ""; return true; }
  if (document.getElementById("wordbar").innerHTML) { closeWordbar(); return true; }
  const box = document.getElementById("sheet");
  if (box.innerHTML) { stopAudio(); openVid = null; box.innerHTML = ""; ses = null; render(); return true; }
  if (tab !== "home") { tab = "home"; render(); return true; }
  return false;
};

mushafPage = 1;
if (window.__oldWebView) throw new Error("old webview");
applySettings();
render();
if (!cfg.seenIntro) showIntro();
if (IS_APP && !qcfLocal() && !cfg.qcfAsked && cfg.qfont === "qcf") qcfStart();
</script>
